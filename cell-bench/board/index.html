<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Bench — 셀 배터리 내구 시험</title>
<script>
(function(){var m='auto';try{m=JSON.parse(localStorage.getItem('theme')||'"auto"')}catch(e){}
var d=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');})();
</script>
<style>
/* 설계 메모 — 승인된 시안 docs/design/cellbench-app-mockup.html 을 실데이터로 입힌 것.
   앱 셸: 왼쪽 내비 216px(관제 · 추이 분석 · 절차 · 기준 · 점검 + 세트 묶음) · 위 막대 52px(위치 · 전역 상태 알약 · 계정).
   화면 6개: 관제(첫 화면) · 세트 상세 · 추이 분석 · 절차 · 기준 · 점검(신호등 9계통) · 세트 등록(3단계).
   점검은 첫 화면에 두지 않는다 — 내비 '점검' + 위 막대 알약 + 내비 배지로만 드러난다. 세트 등록은 관제의 미등록 칸 [등록]에서 들어간다.
   데이터: cloud-config.js 가 없으면 serve_board.py 의 /api/*, 있으면 Supabase. 10초마다 다시 읽는다. 외부 리소스 없음(시험망에 인터넷이 없다).
   상태 색: s-ok 정상 · s-warn 준비 · s-bad 조치 · s-unk 신호 없음(빨강과 같은 무게 — 빨간 고리) · s-idle 운전 대기(회색 고리) · s-none 기록 없음(회색).
   불마다 글자가 함께 간다 — 색만으로 뜻을 전하지 않는다. */
:root{
  --bg:#F5F6F4; --panel:#FFFFFF; --side:#EEF0EC; --line:#E2E5E0; --line-2:#D2D7D0;
  --ink:#1C2124; --ink-2:#4B5458; --ink-3:#7D878C;
  --brand:#0E9F6E; --brand-soft:#E5F5EE; --hover:#F7F8F6; --sel:#EEF6F2;
  --ok:#11A06E; --ok-z:#DDF1E7; --warn:#C27C12; --warn-z:#FBEBCB; --warn-soft:#FDF5E6; --bad:#C2453B; --bad-z:#F6D6D2; --bad-soft:#FCEDEB;
  --unk:#AAB2B6; --unk-z:#E7EAE7;
  --d1:#2F6FB3; --d1-z:#DCE7F4; --on-solid:#FFFFFF; --scrim:rgba(10,15,12,.35);
  --shadow:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06); --lift:0 1px 2px rgba(0,0,0,.08); --lift-2:0 1px 3px rgba(0,0,0,.2);
  --font:"IBM Plex Sans KR","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
}
/* 화면 모드: <head> 의 스크립트가 저장된 선택(자동 · 라이트 · 다크)을 읽어 data-theme 를 light/dark 로 정한다 */
:root[data-theme="dark"]{
  --bg:#111416; --panel:#191E20; --side:#14181A; --line:#283034; --line-2:#343D41;
  --ink:#E8ECE9; --ink-2:#B6BEC1; --ink-3:#7E888D;
  --brand:#34D399; --brand-soft:#16322A; --hover:#1E2427; --sel:#1B2C27;
  --ok:#34D399; --ok-z:#183A2E; --warn:#E8AE52; --warn-z:#4A3816; --warn-soft:#2E2614; --bad:#F08C84; --bad-z:#4D2724; --bad-soft:#2E1C1B;
  --unk:#5F6A70; --unk-z:#262D30;
  --d1:#79AEEB; --d1-z:#1F3047; --on-solid:#111416; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --lift:0 1px 2px rgba(0,0,0,.4); --lift-2:0 1px 3px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:is(button,input,a,label,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg text{font-family:var(--font)}
.mono{font-family:var(--mono)}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* 상태 색 묶음 — 신호 없음은 빨강과 같은 무게(빨간 고리), 운전 대기는 회색 고리, 기록 없음은 회색 */
.s-ok{--c:var(--ok);--z:var(--ok-z);--soft:var(--brand-soft)}
.s-warn{--c:var(--warn);--z:var(--warn-z);--soft:var(--warn-soft)}
.s-bad{--c:var(--bad);--z:var(--bad-z);--soft:var(--bad-soft)}
.s-unk{--c:var(--bad);--z:var(--bad-z);--soft:var(--bad-soft)}
.s-idle{--c:var(--unk);--z:var(--unk-z);--soft:var(--unk-z)}
.s-none{--c:var(--ink-3);--z:var(--line);--soft:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3));flex:none;display:inline-block}
.s-unk.dot,.s-unk .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--bad)}
.s-idle.dot,.s-idle .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--unk)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;background:var(--soft,var(--bg));color:var(--c,var(--ink-2));font-weight:600;font-size:12px;white-space:nowrap}
.s-unk.badge{color:var(--bad)} .s-idle.badge,.s-none.badge{color:var(--ink-3)}
button.badge{border:0;cursor:pointer}
.badge.sm{height:20px;padding:0 7px;font-size:11px;gap:5px}
.badge.sm .dot{width:7px;height:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip svg{color:var(--ink-3)}
.chip.sm{height:20px;padding:0 7px;font-size:11px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:700;margin-left:6px;vertical-align:1px}
.muted{color:var(--ink-3)} .sm{font-size:12px}
.msg-bad{color:var(--bad)} .msg-ok{color:var(--ok)} .msg-warn{color:var(--warn)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-z);background:var(--bad-soft)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);background:var(--bad-soft)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:var(--on-solid)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.icon-btn{width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.inp{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;min-width:0}
.inp.pin{width:84px;font-family:var(--mono);letter-spacing:.08em}
.inp:disabled{opacity:.5}

/* 분할 단추 (범위 · 정렬 · 화면 모드) */
.seg{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px}
.seg>div{display:inline-flex;padding:2px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--lift),0 0 0 1px var(--line)}
.seg.th button{width:28px;padding:0;justify-content:center}

/* 앱 셸 */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 0 215px,var(--line) 215px 216px,transparent 216px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em;flex:none}
.brand>div{min-width:0}
.brand b{display:block;font-size:13.5px} .brand small{display:block;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:grid;gap:2px}
.nav button,.sets button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--ink-2);cursor:pointer;text-align:left;font-weight:500;width:100%}
.nav button:hover,.sets button:hover{background:var(--hover)}
.nav button[aria-current="page"],.sets button[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--c);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .cnt.s-unk{background:var(--panel);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.sets{display:grid;gap:2px}
.sets .gl{padding:0 10px 4px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.sets button{height:30px;font-size:13px}
.sets button .dot{margin:0 3px 0 4px}
.sets button small{margin-left:auto;color:var(--ink-3);font-size:11.5px;font-weight:500}
.sets button small.s-warn{color:var(--warn);font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:6px 4px 6px 10px;color:var(--ink-3);font-size:12px}
.side-foot .lv{display:flex;align-items:center;gap:8px;min-width:0}
.side-foot .lv span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .md{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pulse{position:relative}
@media (prefers-reduced-motion:no-preference){
  .pulse.s-ok::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb button{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:5px;color:var(--ink-3);cursor:pointer}
.crumb button:hover{color:var(--ink);background:var(--hover)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.health{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--c);white-space:nowrap}
.health.s-unk{border-style:dashed;border-color:var(--bad-z)}
.health.s-none,.health.s-idle{color:var(--ink-2)}
.me{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 10px 0 3px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2);max-width:220px}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .av,.av{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.me.out{padding:0 12px 0 10px}
.th-m,.det-m{display:none}

.content{padding:24px;display:grid;gap:18px;max-width:1400px;width:100%;align-content:start}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:32px}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph h1:focus,#regChk:focus,.wz-b h2:focus{outline:none}
.ph .sub{color:var(--ink-3);font-size:12.5px}
.ph .ph-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 카드 · 집계 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:6px 10px;min-height:52px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-b{padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;display:grid;gap:6px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s;align-content:start;min-width:0}
div.stat{cursor:default}
button.stat:hover{border-color:var(--line-2)}
.stat[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px var(--z)}
.stat .l{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:500;font-size:12.5px;min-width:0}
.stat .l svg{color:var(--ink-3);flex:none}
.stat .n{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:5px}
.stat .n small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.stat .n.c{color:var(--c)}
.stat.zero .n{color:var(--ink-3)}
.stat .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.stat .bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.stat .foot{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;min-height:18px;min-width:0}
.stat .foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 기준 게이지 (셀 잔량 · 공용) */
.g{position:relative;height:8px;border-radius:4px;background:var(--line);display:flex;overflow:visible}
.g .z{position:absolute;top:0;bottom:0}
.g .z.ok{background:var(--ok-z)} .g .z.warn{background:var(--warn-z)} .g .z.bad{background:var(--bad-z)}
.g .z:first-child{border-radius:4px 0 0 4px} .g .z:last-of-type{border-radius:0 4px 4px 0}
.g .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 3px var(--c),var(--lift-2)}
.soc{position:relative;height:8px;border-radius:4px;background:var(--line);display:block}
.soc i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}
.soc .bl{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--warn)}
.ends{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--ink-3);position:relative}
.ends .blab{position:absolute;transform:translateX(-50%);color:var(--warn);font-weight:600}

/* 목록 + 상세 패널 */
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1280px){.body{grid-template-columns:minmax(0,1fr) 360px}}
.insp{display:none;align-content:start}
@media (min-width:1280px){.insp{display:grid;position:sticky;top:76px;max-height:calc(100vh - 96px)}.insp .card{overflow:auto}}
.insp .card{display:grid;box-shadow:var(--shadow)}
.ih{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ih b{font-size:15px}
.ih .x{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:none;place-items:center}
.ib{padding:18px 16px;display:grid;gap:20px;min-width:0}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big span{font-size:15px;color:var(--ink-2);font-weight:600}
.lab{color:var(--ink-3);font-size:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-3);font-weight:600;gap:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv>div{padding:10px 12px;display:grid;gap:3px;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-child(odd){border-right:1px solid var(--line)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv>div:nth-child(odd):last-child{grid-column:1/-1;border-right:0}
.kv span{color:var(--ink-3);font-size:11.5px;display:flex;align-items:center;gap:5px}
.kv b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.kv b small{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.kv.t b{font-size:13px;font-weight:600;line-height:1.35}
.scrim{display:none}
@media (max-width:1279px){
  .insp.open{display:grid;position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(400px,100%);padding:12px}
  .insp.open .card{max-height:100%;overflow:auto}
  .insp .ih .x{display:grid}
  .scrim.open{display:block;position:fixed;inset:0;z-index:15;background:var(--scrim)}
}

/* 알림 · 토스트 · 떠 있는 상자 */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);z-index:40;background:var(--ink);color:var(--panel);border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:var(--on-solid)}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:12;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;text-align:left}
.pop>b{display:flex;align-items:center;gap:8px;font-size:13.5px}
.pop>b.dg{color:var(--bad)}
.pop ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--ink-2);font-size:12.5px}
.pop li{display:flex;align-items:center;gap:7px}
.pop li svg{color:var(--ink-3);flex:none}
.pop .r{display:flex;justify-content:flex-end;gap:8px}
.pop form{display:grid;gap:8px}
.pop .inp{width:100%}
.login{position:fixed;top:58px;right:16px;z-index:30}
.empty{padding:36px;text-align:center;color:var(--ink-3)}

<script>

const localApi={cloud:false,

  // 확인은 그 원인에 묶인다 — 화면이 보던 이유·불을 함께 보낸다(원인이 바뀌면 서버 판정이 다시 '확인'을 띄운다)
  ack:async(key,reason,light)=>{const r=await fetch('/api/alert/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,reason,light})});return r.json();}};
function cloudApi(cfg){
  const tok=()=>{try{return JSON.parse(sessionStorage.getItem('sb_session')||'null')}catch(e){return null}};
  const headers=()=>{const t=tok();return {'apikey':cfg.anon,'Authorization':'Bearer '+(t?t.access_token:cfg.anon),'Content-Type':'application/json'};};
  const rest=async(path,opt={})=>{const r=await fetch(`${cfg.url}/rest/v1/${path}`,{...opt,headers:{...headers(),...(opt.headers||{})},cache:'no-store'});
    if(r.status===401){sessionStorage.removeItem('sb_session');authLost();throw new Error('로그인 필요');}
    if(!r.ok){throw new Error(`${r.status} ${await r.text()}`);} const txt=await r.text();return txt?JSON.parse(txt):null;};
  // 행이 많아질 수 있는 읽기는 1000행씩 끝까지 나눠 읽는다 — Supabase 는 한 번에 최대 1000행만 돌려준다(H-6). 정렬 열이 유일해야 겹치지 않는다
  const restAll=async path=>{const out=[];for(let o=0;o<500000;o+=1000){const rows=await rest(`${path}&limit=1000&offset=${o}`)||[];out.push(...rows);if(rows.length<1000)break;}return out;};
  const b=`bench_id=eq.${encodeURIComponent(cfg.bench)}`;
  let lastCycle=null;
  return {cloud:true, cfg,
    loggedIn:()=>!!tok(), email:()=>(tok()||{}).user?.email||'',
    login:async(email,password)=>{const r=await fetch(`${cfg.url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':cfg.anon,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.msg||j.error||'로그인 실패'); sessionStorage.setItem('sb_session',JSON.stringify(j));},
    logout:()=>sessionStorage.removeItem('sb_session'),
    now:async()=>{const rows=await rest(`bench_state?${b}&select=payload,updated_at`);const n=rows[0]?rows[0].payload:{};lastCycle=n.cycle??lastCycle;return n;},
    samples:async(rng)=>{const conv=r=>({time:fmtLocal(r.t),cycle:r.cycle,phase:r.phase,plug:r.plug_on==null?'':(r.plug_on?'on':'off'),watts:r.watts==null?'':String(r.watts),wh:String(r.wh??0),cells:r.cells_alive,batt_min:r.batt_min??'',batt_avg:r.batt_avg??'',batt_max:r.batt_max??'',hr_cells:0,n:r.n});
      if(rng==='all'){const rows=await restAll(`bench_sample_1h?${b}&order=t.asc`);return {cycle:null,range:rng,rows:rows.map(conv)};}
      if(rng==='recent'){if(lastCycle==null)return{cycle:null,range:rng,rows:[]};const rows=await restAll(`bench_sample_10m?${b}&cycle=gte.${Math.max(1,lastCycle-4)}&order=t.asc`);return {cycle:null,range:rng,rows:rows.map(conv)};}
      if(lastCycle==null)return{cycle:null,rows:[]};const rows=await restAll(`bench_sample?${b}&cycle=eq.${lastCycle}&order=t.asc`);
      return {cycle:lastCycle,rows:rows.map(conv)};},
    cycles:async()=>(await restAll(`bench_cycle?${b}&order=cycle.asc`)).map(r=>r.row),
    events:async()=>(await rest(`bench_event?${b}&order=t.desc&limit=200`)).reverse().map(r=>({time:fmtLocal(r.t),cycle:r.cycle,phase:r.phase,kind:r.kind,serial:r.serial,detail:r.detail})),
    discharge:async()=>(await restAll(`bench_discharge?${b}&order=cycle.asc,serial.asc`)).map(r=>({cycle:r.cycle,serial:r.serial,start_pct:r.start_pct,end_pct:r.end_pct,hours:r.hours,pct_per_h:r.pct_per_h,est_runtime_h:r.est_runtime_h==null?'':r.est_runtime_h})),
    cells:async()=>[],
    control:async()=>{if(!tok())return {enabled:true,locked:false,needLogin:true,pending:null,last_ack:null};const rows=await rest(`bench_command?${b}&order=requested_at.desc&limit=5`);const p=rows.find(r=>!r.taken_at);const a=rows.find(r=>r.result);
      return {enabled:true,locked:false,pending:p?{cmd:p.cmd,t:Date.parse(p.requested_at)/1000}:null,last_ack:a?{cmd:a.cmd,result:a.result,t:Date.parse(a.taken_at||a.requested_at)/1000}:null};},
    send:async(cmd)=>{const email=(tok()||{}).user?.email;await rest('bench_command',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({bench_id:cfg.bench,cmd,requested_by:email})});
      return {ok:true,note:'시험 프로그램이 20초 안에 집어 갑니다. 결과는 아래에 나옵니다'};},
    // 신호등 — 감시자가 1분마다 올린 판정. updated_at 이 stale_after_s(5분)보다 묵으면 화면이 스스로 전체를 '신호 없음'으로 (PC 가 죽어도 불이 켜진다)
    health:async()=>{const rows=await rest(`bench_health?${b}&select=payload,updated_at`);if(!rows||!rows.length)return null;
      const p=rows[0].payload||{}, age=Date.now()/1000-Date.parse(rows[0].updated_at)/1000;
      return age>(p.stale_after_s||300)?staleHealth(p,age):p;}};
}

// ---- 신호등 판정의 글자 · 색 (cellbench/health.py 의 판정을 그대로 그린다 — 판정은 여기서 하지 않는다) ----
const LCLS={green:'ok',yellow:'warn',red:'bad',unknown:'unk',none:'none'};
const LWORD={green:'정상',yellow:'경고',red:'조치',unknown:'신호 없음',none:'기록 없음'};   // 10-10 낱말 변경 (준비→경고 · 신호 없음→신호 없음, QA M-2)   // none = 엔진이 아직 돈 적 없어 잴 것이 없음 (불 없음)
const ACK_TITLE='누르면 이 차선의 Slack 반복 알림(15분마다)이 멈춥니다. 장비는 움직이지 않습니다. 원인이 바뀌면 다시 알립니다.';
function staleHealth(h,age){   // 클라우드: 제어 PC 소식이 끊기면 마지막 판정을 믿지 않는다 — 전체를 신호 없음으로
  // hold: 원인은 띠의 '제어 PC 소식 없음' 하나 — 차선마다 '확인' 안내를 되풀이하지 않는다. 심박·감시자도 마지막 판정 때 것이라 지운다
  const lanes=(h.lanes||[]).map(l=>({...l,light:'unknown',reason:'제어 PC 소식 없음 — 값은 마지막 판정 때 것',ai:'',human:'제어 PC 전원·인터넷·감시자 확인',acked_at:null,hold:true}));
  return {...h,light:'unknown',stale:true,beat_age:null,supervisor:`제어 PC 소식 ${dur(age)} 전이 마지막`,
    reason:`제어 PC 에서 ${dur(age)}째 소식 없음 — 마지막 판정 ${kst(h.t,true)}`,reason_items:null,
    todo:{key:'program',name:'제어 PC',human:'제어 PC 전원·인터넷·감시자 확인'},
    counts:{yellow:0,red:0,unknown:lanes.length},lanes,   // 미등록 감지는 옛 소식이라 지운다
    sets:(h.sets||[]).filter(s=>!s.detect).map(s=>s.running?{...s,light:'unknown',word:'신호 없음',reason:'제어 PC 소식 없음'}:s)};
}
// 띠 첫 줄: 넓은 화면은 짧은 글 세 개까지, 폰은 하나만 + '외 N건'. 옛 판정(reason_items 없음)은 한 줄 그대로
function bandWhy(h){
  const items=Array.isArray(h.reason_items)?h.reason_items:null;
  if(!items||!items.length)return `<span class="txt">${esc(h.reason)}</span>`;
  const n=narrow()?1:3, more=items.length-n;
  return `<span class="txt">${esc(h.reason_head)} — ${esc(items.slice(0,n).join(' · '))}</span>`+(more>0?` <span class="more">외 ${more}건</span>`:'');
}
// 응답이 끊겼을 때 마지막 판정을 버리지 않는다(세트 목록 · 시험대 이름이 무너지지 않게 — M-9). 다만 지금 값처럼 보이지 않게 전체를 신호 없음으로
function heldHealth(h){
  const why=API.cloud?'클라우드 응답 없음':'결과판 서버 응답 없음', todo=API.cloud?'인터넷 연결 확인':'제어 PC 의 결과판 서버 · 감시자 확인';
  const lanes=(h.lanes||[]).map(l=>({...l,light:'unknown',reason:`${why} — 값은 마지막 판정 때 것`,ai:'',human:todo,acked_at:null,hold:true}));
  return {...h,light:'unknown',stale:true,held:true,beat_age:null,supervisor:`마지막 판정 ${kst(h.t,true)}`,reason:`${why} — 마지막 판정 ${kst(h.t,true)}`,reason_items:null,
    todo:{key:'program',name:API.cloud?'연결':'결과판 서버',human:todo},counts:{yellow:0,red:0,unknown:lanes.length},lanes,
    sets:(h.sets||[]).map(s=>s.running?{...s,light:'unknown',word:'신호 없음',reason:why}:s)};
}
async function refreshHealth(){
  try{const h=await API.health();HFAIL=false;HL=h||null;HGOOD=h||HGOOD;HERR=h?'':'신호등 자료 없음 — 제어 PC 의 감시자가 아직 올리지 않았습니다';}
  catch(e){HFAIL=true;HL=HGOOD?heldHealth(HGOOD):null;HERR=API.cloud?'신호등을 읽지 못함 — 클라우드 표(bench_health)가 아직 없거나 연결 오류':'신호등을 읽지 못함 — 결과판 서버 응답 없음';}
}
function setLight(id){const s=HL&&(HL.sets||[]).find(x=>x.id===id);return s&&s.running&&s.light?s:null;}
// 세트 자리 5칸: 등록된 세트(설정 bench.json 의 sets — 신호등 판정 HL.sets 에 실려 온다. running = 지금 엔진이 도는 세트) →
// 미등록 감지(같은 목록의 detect 항목 — 엔진이 들은 미등록 셀 · 감시자가 찾은 미등록 플러그) → 빈 자리. LiveHub 는 공용 1대.
const SLOTS=5;
function setSlots(){
  if(!HL&&(!HERR||HFAIL))return Array.from({length:SLOTS},(_,i)=>({id:i+1,kind:'loading'}));   // 첫 로딩 · 한 번도 못 읽음 — 빈 자리라고 단정하지 않는다(H-5 · M-9)
  const hs=HL&&Array.isArray(HL.sets)&&HL.sets.length?HL.sets:[{id:1,running:true}];
  const out=hs.filter(s=>!s.detect).map(s=>({...s,kind:s.running?'run':'idle'})), det=hs.find(s=>s.detect);
  let next=Math.max(0,...out.map(s=>+s.id||0))+1;
  if(det&&out.length<SLOTS){out.push({...det,id:det.id??next,kind:'detect'});next=Math.max(next,+det.id||0)+1;}
  while(out.length<SLOTS)out.push({id:next++,kind:'empty'});
  return out.slice(0,SLOTS);
}
const slotOf=id=>setSlots().find(s=>String(s.id)===String(id));
const runSlot=()=>setSlots().find(s=>s.kind==='run')||{id:1,kind:'run'};

// ---- 지금 상태 요약 ----
// 셀 수신 판정은 now.json 이 쓰인 순간의 나이(age ≤ 15초)로 한다 — 신호등 '셀 수신' 차선(health._live)과 같은 기준.
// 쓰인 뒤 흐른 시간(lag)을 15초 문턱에 더하면 20초마다 쓰는 사이에 셀 전부가 끊김으로 깜빡인다. 대신 lag 는
// '마지막 수신'에 더하고(register.heard_from_now 와 같은 규칙), 엔진 소식이 끊기면 수신 수 · 예상을 흐리게 + '마지막 소식 HH:MM 기준'(H-4)
const lag=()=>{const t=+S.now.t;return t?Math.max(0,Date.now()/1000-t):0;};
const cellAgo=c=>c==null||c.age==null?null:+c.age+lag();
function alive(){const n=S.now;return (n.cells||[]).filter(c=>c.age<=15&&!c.waiting);}
const liveOK=()=>engineStat().cls==='ok';
const oldTag=()=>`마지막 소식 ${S.now.t?hm(S.now.t):'-'} 기준`;
// 이번 사이클 = cycle_start 이후의 표본만 — 같은 사이클 번호로 섞인 옛 실행 기록을 빼고 그린다(M-7)
function cycleRows(rows){const cs=+S.now.cycle_start;if(!cs)return rows||[];return (rows||[]).filter(r=>{const t=parseTs(r.time);return t==null||t>=cs-1;});}
function health(){const n=S.now;if(!n.phase)return 'warn';const age=Date.now()/1000-n.t;if(age>90)return 'bad';const a=alive().length;return a<(n.expected||24)?'warn':n.events?'warn':'ok';}
function dischargeEta(){   // 범위와 무관하게 이번 사이클 원본 표본(S.cur)으로 — 최근 30분 최저 잔량의 직선 기울기
  const n=S.now, rows=cycleRows(S.cur).filter(r=>r.phase==='DISCHARGE'&&r.batt_min!=='');
  if(rows.length<6) return null;
  const pts=rows.map(r=>[parseTs(r.time),+r.batt_min]); const tEnd=pts[pts.length-1][0];
  const w=pts.filter(p=>tEnd-p[0]<=1800); if(w.length<6) return null;
  const mx=w.reduce((a,p)=>a+p[0],0)/w.length, my=w.reduce((a,p)=>a+p[1],0)/w.length;
  const num=w.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0), den=w.reduce((a,p)=>a+(p[0]-mx)**2,0);
  const slope=den?num/den:0; if(slope>=0) return null;
  // 도달 예상 시각은 지금이 아니라 마지막 표본 시각 + 남은 시간 — 엔진이 멈췄으면 옛 표본에서 지금으로 미끄러지지 않게(H-4)
  const cur=w[w.length-1][1], sec=(cur-n.stop_pct)/(-slope); return {sec, rate:-slope*3600, t0:tEnd, v0:cur, at:tEnd+sec, left:tEnd+sec-Date.now()/1000};
}
// 엔진 상태 한 마디 — 신호등 판정(HL.engine)을 그대로 쓴다(신호등과 어긋나지 않게). 신호등이 없으면 now.json 나이로
function engineStat(){
  const n=S.now, have=!!n.phase, age=have?Date.now()/1000-n.t:Infinity;
  if(NETERR||(HL&&HL.held))return{cls:'bad',text:'서버 응답 없음'};
  if(!LOADED&&!HL)return{cls:'none',text:'불러오는 중',loading:true};
  if(HL&&HL.stale)return{cls:'bad',text:'제어 PC 소식 없음'};
  const e=HL&&HL.engine;
  if(e==='none')return{cls:'none',text:'기록 없음'};
  if(e==='ended')return{cls:'none',text:HL.engine_exit==='interrupted'?'엔진 멈춤 · 사람이 멈춤':`엔진 끝남 · ${PHK[HL.phase]||HL.phase||'-'}`};
  if(e==='stale')return{cls:'bad',text:`정지 의심 · ${dur(age)} 전`};
  if(e==='live')return{cls:'ok',text:'실행 중'};
  if(!LOADED)return{cls:'none',text:'불러오는 중',loading:true};
  return !have?{cls:'none',text:'기록 없음'}:age>90?{cls:'bad',text:`정지 의심 · ${dur(age)} 전`}:{cls:'ok',text:'실행 중'};
}
const benchName=()=>(HL&&HL.bench_name)||'시험대';

// 알약 · 내비 배지의 숫자는 아직 확인하지 않은 경고 · 조치 · 신호 없음만 센다(N-9). 확인한 뒤 원인이 바뀌면 서버가 acked_at 을 비우므로 다시 센다.
// 점검 화면의 집계 칸은 그대로 전체 수다
const unacked=l=>['yellow','red','unknown'].includes(l.light)&&!l.acked_at;
function lightOf(){   // 전역 상태 — 신호등 띠의 불. 없으면 신호 없음
  if(!HL)return{cls:'unk',word:'신호 없음',n:0};
  const L=HL.light, c=LCLS[L]||'unk', lanes=HL.lanes||[], all=lanes.filter(l=>l.light===L).length, n=lanes.filter(l=>l.light===L&&unacked(l)).length;
  return{cls:c,word:LWORD[L]||'신호 없음',n:L==='green'?0:n,acked:L!=='green'&&all>0&&n===0};
}
function shell(){
  const cur=V[U.view]||{};
  $('nav').querySelectorAll('button').forEach(b=>{if(b.dataset.v===cur.nav)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  // 위치
  const cr=cur.crumb?cur.crumb():[];
  keepFocus($('crumb'),()=>{$('crumb').innerHTML=`<span class="c-root">${esc(benchName())}</span><span class="c-root" aria-hidden="true">/</span>`+cr.map((c,i)=>i<cr.length-1?`<button type="button" data-v="${c[1]}" data-fk="cr-${i}">${esc(c[0])}</button><span aria-hidden="true">/</span>`:`<b>${esc(c[0])}</b>`).join('');
    $('crumb').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));});
  // 전역 상태 알약 · 내비 배지 (점검은 첫 화면에 두지 않는다 — 여기와 내비로만 드러난다)
  const lt=lightOf(), lanes=(HL&&HL.lanes)||[], attn=lanes.filter(unacked).length;
  const loading=!HL&&!HERR&&!NETERR, held=!!(HL&&HL.held);   // 첫 로딩 중에는 '신호 없음'을 단정하지 않는다(H-5) · 응답이 끊기면 머리말과 같은 말(M-9)

  $('health').innerHTML=`<span class="dot"></span>${loading?'불러오는 중':held||(!HL&&HFAIL)?'서버 응답 없음':HL?(lt.n?`${lt.word} ${lt.n}`:lt.acked?`${lt.word} · 확인함`:lt.word):'신호 없음'}`;
  $('health').title=HL?(HL.reason||''):HERR;
  const c=$('navCnt');c.className='cnt s-'+lt.cls;c.textContent=HL&&!held?attn:'!';c.hidden=loading||(!!HL&&!held&&!attn);
  // 엔진 상태 (내비 아래)

  $('brandSub').title=`${benchName()} · ${API.cloud?'클라우드 결과판 (Supabase)':'제어 PC 결과판'}`;
  // 세트 묶음 (내비 아래) — 비어 있지 않은 칸만

    return `<button type="button" data-s="${esc(s.id)}" data-k="${s.kind}" data-fk="ns-${esc(s.id)}" ${on?'aria-current="page"':''}><span class="dot s-${st.cls}"></span>세트 ${esc(s.id)}<small class="${s.kind==='detect'?'s-warn':''}">${small}</small></button>`;}).join('');

    $('detChip').onclick=()=>{if(API.cloud)go('ops');else go('reg',{set:det.id});};}

// 세트의 색 한 마디: 운전 중 = 신호등의 세트 차선(플러그 · Dock·셀 · 셀 수신 · 사람 조작) 중 가장 나쁜 불. 신호등이 없으면 예전 요약 색
function setTone(s){
  if(s.kind==='empty')return{cls:'none',word:'빈 자리'};
  if(s.kind==='idle')return{cls:'idle',word:'운전 대기',why:s.reason};
  if(s.kind==='detect')return{cls:'warn',word:'미등록 감지',why:s.reason};
  if(NETERR||(HL&&HL.held))return{cls:'unk',word:'서버 응답 없음',why:'마지막으로 받은 값 — '+oldTag()};
  const sl=setLight(s.id);
  if(sl)return{cls:LCLS[sl.light]||'unk',word:sl.word,why:sl.reason,light:sl.light};
  if(!LOADED)return{cls:'none',word:'불러오는 중'};
  if(!S.now.phase)return{cls:'none',word:'기록 없음'};
  const h=health();return{cls:h,word:{ok:'정상',warn:'경고',bad:'조치'}[h]};
}

const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;

function applyTheme(mode,save){
  const dark=mode==='dark'||(mode==='auto'&&mq&&mq.matches);

// ───── 충방전 기록 (세트 상세): 전력 · 잔량 두 그래프가 시간축 · 범위 · 확대 · 값 읽기를 함께 쓴다 ─────
// 그래프는 실제 픽셀 폭으로 그린다(viewBox = 화면 폭). 폰에서 960 폭을 줄여 그리면 축 글자가 5px 로 작아지기 때문이다.
// 위 띠(자) = 여러 사이클이면 사이클 번호, 이번 사이클이면 단계 이름. 아래 축 = 시각.
// 이번 사이클 · 방전 중이면 방전 도달 예상(dischargeEta — 이번 사이클 원본 표본)까지 '예상' 구간을 빗금으로 잇는다(시안).
const RLABEL={cycle:'이번 사이클',recent:'최근 5사이클',all:'전체'};
const BUCKET={recent:'10분 묶음',all:'1시간 묶음'}, BUCKET_S={recent:600,all:3600};
const dhm=t=>{const d=new Date(t*1000);return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const md=t=>{const d=new Date(t*1000);return `${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const textW=s=>[...String(s)].reduce((a,c)=>a+(/[ㄱ-힣]/.test(c)?11:6.6),0);   // 11px 글자 폭 어림 (숨은 화면에서도 쓰려고 측정 대신)
const canHover=!!(window.matchMedia&&matchMedia('(hover: hover)').matches);
const HINT=canHover?'올리면 값 · 누르면 고정 · 가로로 끌면 확대 · 더블클릭 전체':'누르면 값 · 가로로 끌면 확대';
let PT=null, HOV=null, G=null, figW=0;   // PT = 값 읽기로 고정한 시각, HOV = 마우스가 가리키는 시각, G = 마지막 그림의 좌표계
// 시각 눈금: 최소 64px 간격이 되는 가장 작은 단위를 고르고, 자정은 날짜로 적는다
function timeTicks(tA,tB,px){
  const need=64*(tB-tA)/px, out=[], d=new Date(tA*1000); d.setHours(0,0,0,0);
  const st=[600,900,1800,3600,7200,10800,21600,43200,86400,172800,345600,604800,1209600].find(s=>s>=need);
  if(st&&st<86400){for(let t=d.getTime()/1000;t<=tB;t+=st){if(t<tA)continue;const dd=new Date(t*1000);out.push([t,dd.getHours()||dd.getMinutes()?hm(t):md(t)]);}}
  else if(st){for(;d.getTime()/1000<=tB;d.setDate(d.getDate()+st/86400)){const t=d.getTime()/1000;if(t>=tA)out.push([t,md(t)]);}}
  else{const m=[1,2,3,6,12].find(k=>k*30*86400>=need)||12;d.setDate(1);for(;d.getTime()/1000<=tB;d.setMonth(d.getMonth()+m)){const t=d.getTime()/1000;if(t>=tA)out.push([t,md(t)]);}}
  return out;
}
// 묶음 점이 화면 픽셀보다 촘촘하면(수백 사이클의 '전체') 같은 규칙으로 한 번 더 묶는다 — 평균은 표본 수로 가중, 최저 · 최고는 그 구간의 최저 · 최고.
const spanLab=s=>s%86400===0?`${s/86400}일`:s%3600===0?`${s/3600}시간`:`${s/60}분`;
function regroup(rows,ts,gs,t0){   // t0 = 전체 기록의 첫 시각 — 묶음 경계를 여기에 맞춰 첫 묶음이 반쪽이 되지 않게 하고, 확대해도 경계가 같게 한다
  const out=[], ots=[]; let g=null,k0=null;
  rows.forEach((r,i)=>{const k=Math.floor((ts[i]-t0)/gs);
    if(k!==k0){g={cycle:r.cycle,phase:r.phase,plug:r.plug,wh:r.wh,n:0,batt_min:'',batt_max:'',_w:0,_wn:0,_a:0,_an:0};out.push(g);ots.push(t0+k*gs);k0=k;}
    const n=+r.n||1; g.n+=n;
    if(has(r.watts)){g._w+=+r.watts*n;g._wn+=n;} if(has(r.batt_avg)){g._a+=+r.batt_avg*n;g._an+=n;}
    if(has(r.batt_min))g.batt_min=g.batt_min===''?+r.batt_min:Math.min(g.batt_min,+r.batt_min);
    if(has(r.batt_max))g.batt_max=g.batt_max===''?+r.batt_max:Math.max(g.batt_max,+r.batt_max);});
  out.forEach(g=>{g.watts=g._wn?g._w/g._wn:'';g.batt_avg=g._an?g._a/g._an:'';});
  return [out,ots];
}
// 표본 사이가 평소 간격의 3배 넘게 비면 선을 끊는다 (기록이 없던 구간을 이어 그리지 않는다)
function segments(ts,lo,hi){const d=[];for(let i=lo+1;i<=hi;i++)d.push(ts[i]-ts[i-1]);d.sort((a,b)=>a-b);const gap=(d.length?d[d.length>>1]:60)*3+1;
  const out=[];let cur=[lo];for(let i=lo+1;i<=hi;i++){if(ts[i]-ts[i-1]>gap){out.push(cur);cur=[];}cur.push(i);}out.push(cur);return out;}

function renderCharts(){
  const fig=$('fig');if(!fig)return;
  const sw=$('chartW'), sb=$('chartB'), n=S.now;

  fig.classList.remove('loading');

  if(Z){let i0=allTs.findIndex(t=>t>=Z[0]), i1=allTs.findIndex(t=>t>Z[1]); if(i0<0)i0=allTs.length; if(i1<0)i1=allTs.length; i0=Math.max(0,i0-1); i1=Math.min(allTs.length,i1+1); rows=all.slice(i0,i1); ts=allTs.slice(i0,i1);}

  const pw={top:24,y0:HW-4}, pb={y1:8,y0:HB-24};
  const tEndRaw=ts[ts.length-1], bucket=R!=='cycle', rows0=rows, ts0=ts;   // rows0 · ts0 = 다시 묶기 전 (사이클 경계 · 사이클 수는 이것으로 센다)
  // 예상: 이번 사이클 · 방전 중 · 확대 안 함 · 12시간 안 — 마지막 표본에서 기준선 도달 예상 시각까지
  let proj=null;
  if(!bucket&&!Z&&n.phase==='DISCHARGE'&&engineStat().cls==='ok'){const e=dischargeEta();   // 엔진이 멈춘 듯하면 예상을 긋지 않는다 — 옛 표본에서 지금으로 이으면 틀린 그림이다
   if(e&&e.sec>0&&e.sec<12*3600)proj={t0:tEndRaw,v0:e.v0,t1:e.at};}   // 도달 예상 = 마지막 표본 시각 + 남은 시간(H-4)
  let tA=Z?Z[0]:ts[0], tB=Z?Z[1]:Math.max(ts[ts.length-1],tA+60), bs=BUCKET_S[R]||0;

    if(want>bs*1.5){bs=[1200,1800,3600,7200,10800,14400,21600,28800,43200,86400,172800,259200,604800,1209600].find(v=>v>=want&&v%BUCKET_S[R]===0)||1209600;
      [rows,ts]=regroup(rows,ts,bs,allTs[0]);}}
  const X=t=>x0+(x1-x0)*(t-tA)/(tB-tA);
  let lo=ts.findIndex(t=>t>=tA); if(lo<0)lo=0; let hi=ts.length-1; while(hi>lo&&ts[hi]>tB)hi--;
  const ilo=Math.max(0,lo-1), ihi=Math.min(ts.length-1,hi+1);   // 그릴 때는 양 끝 한 점씩 더 (가장자리에서 선이 끊기지 않게)
  const wide=(tB-tA)>20*3600, grpLab=bucket?`${spanLab(bs)} 묶음`:'';

  const clip=(s,id,y1,y0)=>{const d=el('defs');const c=el('clipPath',{id});c.appendChild(el('rect',{x:x0,y:y1-3,width:x1-x0,height:y0-y1+6}));d.appendChild(c);

    // 사이클이 많으면 1·2·5·10… 단위로 솎아 번호를 단다 (라벨 하나 폭 + 여백이 들어가는 가장 작은 단위)

  marks.forEach(m=>{const x=X(m.t);if(x<x0-0.5||x>x1+0.5)return;

  const wTop=Math.max(80,Math.ceil(Math.max(0,...rows.map(r=>has(r.watts)?+r.watts:0))/20)*20), Yw=v=>pw.y0-(pw.y0-pw.top)*v/wTop;

  {const g=el('g',{'clip-path':'url(#clipB)'});sg.forEach(ix=>{const k=ix.filter(i=>has(rows[i].batt_min)&&has(rows[i].batt_max));if(k.length<2)return;

function bindChart(svg){
  let sx=null, sel=[];
  const vx=cx=>{const bb=svg.getBoundingClientRect();return (cx-bb.left)/bb.width*G.W;};
  const toT=px=>G.tA+(G.tB-G.tA)*(Math.min(G.x1,Math.max(G.x0,px))-G.x0)/(G.x1-G.x0);
  const clearSel=()=>{sel.forEach(r=>r.remove());sel=[];};
  svg.addEventListener('pointerdown',e=>{if(!G||e.button>0)return;sx=e.clientX;try{svg.setPointerCapture(e.pointerId);}catch(_){}});
  svg.addEventListener('pointermove',e=>{if(!G)return;
    if(sx==null){if(e.pointerType==='mouse'){const t=G.ts[G.near(toT(vx(e.clientX)))];if(t!==HOV){HOV=t;drawXH();}}return;}
    if(Math.abs(e.clientX-sx)<8&&!sel.length)return;
    if(!sel.length){HOV=null;drawXH();sel=[$('chartW'),$('chartB')].map(s=>s.appendChild(el('rect',{class:'zsel',y:0,height:'100%'})));}
    const a=Math.max(G.x0,Math.min(vx(sx),vx(e.clientX))), b=Math.min(G.x1,Math.max(vx(sx),vx(e.clientX)));
    sel.forEach(r=>{r.setAttribute('x',a);r.setAttribute('width',Math.max(0,b-a));});});
  svg.addEventListener('pointerup',e=>{if(sx==null||!G)return;const moved=sel.length>0;const a=toT(vx(Math.min(sx,e.clientX))),b=toT(vx(Math.max(sx,e.clientX)));sx=null;clearSel();
    if(moved){if(G.ts.filter(t=>t>=a&&t<=b).length>=3){Z=[a,b];PT=null;HOV=null;renderCharts();}}
    else{const t=G.ts[G.near(a)];PT=PT===t?null:t;drawXH();}});
  svg.addEventListener('pointercancel',()=>{sx=null;clearSel();});
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&sx==null&&HOV!=null){HOV=null;drawXH();}});
  svg.addEventListener('dblclick',()=>{if(Z){Z=null;PT=null;renderCharts();}});
}

function verdicts(cyc,ser,val){
  // 기준 = 사이클 1. 3사이클 연속 미달 → 주의, 같은 대상의 주의 2회 → 점검 (가안)
  const ref={};ser.forEach(s=>ref[s]=val(s,cyc[0]));
  const avgOf=c=>{const v=ser.map(s=>val(s,c)).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  ref.avg=avgOf(cyc[0]);
  const ents=[...ser,'avg'],run={},warns={};
  return cyc.map(c=>{const r={c,avg:avgOf(c),out:[],caution:[],inspect:[]};
    ents.forEach(e=>{const v=e==='avg'?r.avg:val(e,c);if(v==null||ref[e]==null)return;
      if(v<ref[e]*0.95){r.out.push(e);run[e]=(run[e]||0)+1;if(run[e]>=3){run[e]=0;warns[e]=(warns[e]||0)+1;(warns[e]>=2?r.inspect:r.caution).push(e);}}else run[e]=0;});
    r.status=r.inspect.length?'inspect':r.caution.length?'caution':r.out.length?'out':'ok';r.ref=ref;return r;});
}

let TM=null, TMsig='';
function trendModel(){   // 방전 기록이 바뀔 때만 다시 계산한다 (수백 사이클 × 24대)
  const D=S.dis, lr=D[D.length-1], sig=`${D.length}|${lr?lr.cycle+':'+lr.serial+':'+lr.est_runtime_h:''}`;
  if(TM&&sig===TMsig)return TM; TMsig=sig;

  const cyc=[...new Set(D.map(r=>+r.cycle))].sort((a,b)=>a-b), ser=[...new Set(D.map(r=>+r.serial))].sort((a,b)=>a-b);
  const val=(s,c)=>{const v=map.get(`${s}|${c}`);return v==null?null:v;};

    let caution=0,inspect=0;vd.forEach(r=>{if(r.caution.includes(s))caution++;if(r.inspect.includes(s))inspect++;});
    let streak=0;for(let k=cyc.length-1;k>=0;k--){const v=val(s,cyc[k]);if(v!=null&&ref[s]!=null&&v<ref[s]*0.95)streak++;else break;}

function renderRegLow(){const lows=regLows(), n=RS.picked.size, need=regNeed();
  const c=$('regCount');if(c){c.className='counter '+(n===need?'s-ok':n>need?'s-warn':'');c.innerHTML=`${n}<small>/ ${need}</small>`;}
  if($('regLow'))$('regLow').innerHTML=lows.length?lows.map(([s,b])=>`<span class="badge sm s-warn">${s} · 잔량 ${b} %</span>`).join(' ')+' <span class="muted">등록은 가능 · 첫 방전 전에 충전 확인 필요</span>':'';}
// 범위 선택: 시작~끝 중 등록되지 않은 시리얼로 선택을 바꾼다. 감지되지 않은 시리얼도 고를 수 있다 — 10초 검사가 수신을 다시 본다
function rangePick(a,b,registered,heard){
  a=String(a).trim();b=String(b).trim();
  if(!/^\d+$/.test(a)||(b&&!/^\d+$/.test(b)))return{err:'시리얼은 숫자로 넣는다'};
  let lo=+a, hi=b?+b:+a; if(hi<lo)[lo,hi]=[hi,lo];
  if(hi-lo>=1000)return{err:'범위가 너무 넓다 (오타?)'};
  const pick=[], skip=[], unheard=[];
  for(let s=lo;s<=hi;s++){if(registered.has(s))skip.push(s);else{pick.push(s);if(!heard.has(s))unheard.push(s);}}
  return{pick,skip,unheard,lo,hi};
}

const regExpect=()=>RG&&!RG.engine_running?(+RG.listen_s||10):3;   // 진행 막대의 잣대 — 엔진이 안 돌면 셀을 직접 듣는 시간, 돌면 금방 끝난다
async function regSave(again){

  if(!pin){RS.result=null;RS.msg='PIN 입력 필요';RS.bad=true;renderReg(true);if($('regPin'))$('regPin').focus();return;}
  RS.busy=true;RS.t0=Date.now();RS.msg=`검사 중 — 플러그 응답 · 셀 ${regNeed()}대 수신 · 겹침 · 전력`;RS.bad=false;RS.result=null;renderReg(true);
  clearInterval(regTick);regTick=setInterval(()=>{const el=(Date.now()-RS.t0)/1000,p=$('regProg'),s=$('regSec');if(!RS.busy||!p){clearInterval(regTick);return;}p.style.width=Math.min(95,el/regExpect()*100)+'%';if(s)s.textContent=`${Math.floor(el)}초 경과`;const w=$('wzSave')||$('wzAgain');if(w)w.lastChild.textContent=`검사 중… ${Math.floor(el)}초`;},250);
  try{

  html:()=>API.cloud?`<div class="wz-col"><div class="ph"><h1 tabindex="-1" id="regTitle">세트 등록</h1></div>
      <section class="card"><div class="card-h"><h2>세트 등록은 제어 PC 결과판에서</h2></div><div class="card-b" style="display:grid;gap:14px">
        <p class="sm">미등록 셀·플러그는 여기서도 보이지만, 등록은 제어 PC 결과판(Tailscale 로 여는 주소)에서만 합니다 — 플러그와 셀을 직접 확인하는 검사와 설정 파일(bench.json) 저장이 제어 PC 안에서만 되기 때문입니다.</p>
        <div><button type="button" class="btn" id="regCloudBack">${I('back',15)}관제로</button></div></div></section></div>`
    :`<div class="wz-col"><div class="ph"><h1 tabindex="-1" id="regTitle">세트 등록</h1><span class="sub" id="regSub"></span><div class="ph-r"><button type="button" class="btn ghost" id="regCancel">취소</button></div></div>
      <div class="warnbar" role="note">${I('alert',15)}<span><b>주의</b> <span id="regWarn">짝을 잘못 묶으면 다중 세트 운전 때 다른 세트의 전원을 끊는다 — 플러그 별명·케이블을 따라가 실물로 확인</span></span></div>
      <section class="card" aria-label="세트 등록"><div class="wst" id="wst"></div><div class="wz-b" id="wzb"></div><div class="wz-f" id="wzf"></div></section></div>`,
  mount(){if(API.cloud){$('regCloudBack').onclick=()=>go('ops');return;}$('regCancel').onclick=()=>go('ops');},
  update(){if(!API.cloud)renderReg(false);}
};
// ---- 10초마다 다시 읽기 ----
let reqSeq=0, appliedSeq=0;   // 범위를 빨리 바꿔도 늦게 온 이전 응답이 새 그림을 덮지 않게
// 방전 기록 · 사이클 기록 · 셀 추출 결과는 사이클이나 단계가 바뀔 때(또는 5분마다 · 추이 분석을 보는 동안 1분마다)만 다시 받는다(M-5).
// 최근 5사이클 · 전체 범위의 묶음 표본도 1분 동안은 다시 쓴다 — 서버가 수백 사이클을 다시 묶지 않게
let LAZY={key:null,at:0,force:true}, SMP={rng:null,at:0,v:null};
async function refresh(){
  const my=++reqSeq, rng=R;
  // 신호등과 지금 상태를 함께 받는다 — 느린 연결에서 첫 화면이 줄줄이 기다리지 않게(H-5). 신호등이 실패해도 아래 화면은 그대로 그린다
  const nowP=API.now().then(x=>({ok:x}),e=>({err:e}));
  await refreshHealth();
  try{
    const nr=await nowP;if(nr.err)throw nr.err;
    const now=nr.ok||{}, t=Date.now();
    const key=`${now.cycle}|${now.phase}`, lazy=LAZY.force||key!==LAZY.key||t-LAZY.at>300e3||(U.view==='trend'&&t-LAZY.at>60e3);
    const reuse=rng!=='cycle'&&SMP.rng===rng&&SMP.key===now.cycle&&t-SMP.at<60e3;
    const [smp,cur,ev,cyc,dis,cx]=await Promise.all([reuse?SMP.v:API.samples(rng),rng==='cycle'?null:API.samples('cycle'),API.events(),lazy?API.cycles():null,lazy?API.discharge():null,lazy?API.cells():null]);
    if(my<appliedSeq)return; appliedSeq=my;
    if(rng!=='cycle'&&!reuse)SMP={rng,at:t,key:now.cycle,v:smp};
    if(lazy)LAZY={key,at:t,force:false};
    const rows=(smp&&smp.rows)||[];
    S={now,samples:rows,cur:rng==='cycle'?rows:((cur&&cur.rows)||[]),range:rng,cycles:lazy?(cyc||[]):S.cycles,events:ev||[],dis:lazy?(dis||[]):S.dis,cellsX:lazy?(cx||[]):S.cellsX};
    NETERR=false; LOADED=true; LASTOK=Date.now()/1000;
    if(U.view==='reg'&&!API.cloud)await loadReg();     // 등록 화면에 있으면 감지 목록 · 플러그 표도 새로
    update(); refreshControl();
  }catch(e){console.warn('결과판 갱신 실패 — 마지막으로 받은 값을 유지',e);NETERR=true;update();}
}
// 처음 열 때: 주소 끝의 화면이 이긴다(링크 공유). 없으면 저장된 화면 — 단, 등록은 늘 관제에서 들어간다.
// 처음 연 주소는 기록 하나로 바꿔 둔다 — 직접 연 #register 에서 화면 단추로 나갈 때 결과판 밖으로 나가지 않게(state.reg=false)
{const h0=fromHash();if(h0){U.view=h0.view;if(h0.set)U.set=h0.set;}else if(U.view==='reg')U.view='ops';saveU();
 history.replaceState({reg:false},'',location.pathname+location.search+hashOf(U.view,U.set));}
if(U.view==='reg')startReg();
render(); refresh(); setInterval(refresh,10000);
})();
</script>
