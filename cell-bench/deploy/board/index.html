function helpEl(){let h=$('railHelp');if(h)return h;
  h=document.createElement('aside');h.id='railHelp';h.className='rail hd';h.setAttribute('role','dialog');h.setAttribute('aria-label','도움말');h.hidden=true;document.body.appendChild(h);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!h.hidden)closeHelp();});return h;}
let HTAB='about', HBACK=null;
function openHelp(tab,anchor){const h=helpEl();HTAB=tab||HTAB;HBACK=document.activeElement;
  h.innerHTML=`<div class="hd-h"><b>도움말</b><span class="muted sm">동적 벤치 시험</span><button type="button" class="icon-btn" id="hdX" aria-label="도움말 닫기">${I('x',16)}</button></div>
    <div class="hd-t" role="tablist">${HELP_TABS.map(([k,t])=>`<button type="button" role="tab" data-t="${k}" aria-selected="${k===HTAB}">${t}</button>`).join('')}</div>
    <div class="hd-b">${HELP[HTAB]()}</div>`;
  h.hidden=false;requestAnimationFrame(()=>h.classList.add('open'));
  h.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openHelp(b.dataset.t));$('hdX').onclick=closeHelp;
  if(anchor){const a=h.querySelector('#'+anchor);if(a){a.open=true;a.scrollIntoView({block:'start'});}}
  $('hdX').focus({preventScroll:true});}
function closeHelp(){const h=$('railHelp');if(!h)return;h.classList.remove('open');setTimeout(()=>{h.hidden=true;},180);if(HBACK&&HBACK.focus)HBACK.focus();}
const helpBtn=(tab,anchor,label)=>`<button type="button" class="hq" data-help="${tab}" ${anchor?`data-ha="${anchor}"`:''} aria-label="${label||'도움말'}" title="${label||'도움말'}">?</button>`;
const bindHelp=root=>root.querySelectorAll('[data-help]').forEach(b=>b.onclick=e=>{e.stopPropagation();openHelp(b.dataset.help,b.dataset.ha);});

function cloudLine(c){
  if(!c||!c.local)return '';
  if(c.state==='off')return ' · <span class="muted">클라우드에 올리지 않음 · 클라우드 키 없음</span>';
  if(c.state==='fail')return ` · <span class="msg-bad">클라우드 올리기 실패 · ${esc(c.error||'')} · 1분마다 다시</span>`;
  if(c.state==='wait')return ' · <span class="muted">클라우드 확인 중</span>';
  const bad=Object.values(c.bad||{});
  return ` · 클라우드에 올림 ${c.uploaded}/${c.local}${bad.length?` · <span class="msg-bad">${bad.length}개 못 올림 · ${esc(bad[0])}</span>`:''}`;
}
// 묶음 값(단계별 등)의 첫 숫자 — 값 보기에서 칸을 비우지 않게
const firstNum=v=>{if(num(v))return v;if(v&&typeof v==='object')for(const x of Object.values(v)){const n=firstNum(x);if(num(n))return n;}return null;};

const cellVal=it=>!it?null:num(it.v)?it.v:firstNum(it.v);
// 몰림 — 같은 회차에 3대 이상 불합격이면 회차 몰림(장비 · 환경 쪽), 같은 셀이 2회 이상 불합격이면 셀 반복(셀 쪽). 장비 유효 회차만 센다
function clusters(X,rows){
  const byRun=rows.filter(r=>r.m&&!r.inv).map(r=>({r,n:Object.values(r.m.cells).filter(x=>x.verdict==='불합격').length})).filter(x=>x.n>=3);
  const byCell=X.cells.map(c=>({c,n:rows.filter(r=>r.m&&!r.inv&&r.m.cells[c.s]&&r.m.cells[c.s].verdict==='불합격').length})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n);
  return{byRun,byCell};}
/* ---- 동적 벤치 시험 화면 — 승인 시안 rail-qc-tools.html(2026-11-04)을 옮겼다. ① 목록 · ② 세트 한 장(+ 셀 서랍) · ③ 회차 결과.
   관제 · 추이 분석의 틀(.ph · .stp · .stats · .card · .hm · .insp · .cell · .tbl)과 셸 함수(openInsp · toast · I · textW)를 그대로 쓴다.
   관제의 renderSteps · renderSetStats · renderHeat 는 관제 값(S.now · trendModel)과 고정 id 를 직접 읽어 레일 값으로 부를 수 없다 —
   그래서 같은 틀(같은 클래스 · 같은 마크업)에 레일 값을 채우는 그리기만 여기 둔다. 판정은 다시 하지 않는다(파일의 판정 글자를 세기만 한다).
   화면에는 숫자 · 그림 · 표만 두고, 설명이 꼭 필요한 것은 도움말 서랍(머리의 ?)으로 보낸다.
   두 회차 비교(V.railCmp)는 기본 흐름에서 뺐지만 주소(#rail/cmp/…)로 들어오면 예전 화면 그대로 뜬다(사용자 결정 6) ---- */
const PART={A:{n:'GPS 수신 품질',sub:'셀 정지 · 시뮬레이터 장면'},
  B:{n:'이동 속도 정확도',sub:'레일 이동 · 같은 속도 장면'},
  C:{n:'움직임 판단 응답',sub:'레일 가속도 계단 · 정지 장면'},
  '미확인':{n:'파트 미확인',sub:'조건 칸 없는 판정 파일 (프로토콜 판 v1)'}};
const PORDER=['A','B','C','미확인'];
// 한 파일에 파트가 둘 이상 적혔으면(예: A · C) 이름을 이어 붙인다
const PT=p=>PART[p]||(String(p).split(' · ').every(x=>PART[x])?{n:String(p).split(' · ').map(x=>PART[x].n).join(' · '),sub:''}:{n:String(p),sub:''});
const pLetter=p=>(PART[p]&&p!=='미확인')||String(p).split(' · ').every(x=>PART[x]&&x!=='미확인')?`파트 ${p} `:'';
const pName=p=>`${pLetter(p)}${PT(p).n}`;
const pL=p=>p==='미확인'?'파트 미확인':`파트 ${p}`;
// 항목 — 이름은 LABEL(용어표 3절), 단위만 화면에서 덧붙인다
const ITEM={rx:{u:'%'},clock:{u:'ms'},imu:{u:'÷ 모터'},gps_rx:{u:'%'},cn0_sim:{u:'dBHz'}};
const iName=id=>LABEL[id]||id;
const uu=u=>u==='s'?'초':u||'';
const iUnit=(id,u)=>(ITEM[id]&&ITEM[id].u)||uu(u||UNIT[id]);
const DEC={pass:['합격','s-ok'],fail:['불합격','s-bad'],retest:['재시험','s-warn']};
const RACT={retest:'칸 바꿔 재시험',exclude:'출하 제외',hold:'판단 보류',none:'조치 없음'};
const VAL=(id,v)=>!num(v)?'–':v===0?'0':id==='rx'||id==='gate_on'||id==='gps_move'?fmt(v,3):id==='clock'?fmt(v,1):fmtA(v);
const uniq=a=>[...new Set(a.filter(x=>x!=null&&x!==''))];
const fmtL=v=>num(v)?String(+(+v).toFixed(3)):'–';   // 기준 숫자 — 1.00 이 아니라 1
const md=d=>!d?'':/^\d{4}-/.test(d.d||'')?d.d.slice(5):(d.d||'');   // 날짜는 월-일만
// 기준의 모양 — criteria.<id> 의 lo · hi 가 있으면 그것으로(이상 · 범위), 없으면 value(숫자는 이하, 두 숫자는 범위). 판정은 하지 않는다
const limOf=c=>{if(!c)return null;const lo=num(c.lo)?c.lo:null, hi=num(c.hi)?c.hi:null;if(lo!=null||hi!=null)return{lo,hi};
  const v=c.value;if(Array.isArray(v)&&v.length===2&&v.every(num))return{lo:v[0],hi:v[1]};return num(v)?{lo:null,hi:v}:null;};
const limT=(L,u)=>!L?'':L.lo!=null&&L.hi!=null?`${fmtL(L.lo)} ~ ${fmtL(L.hi)} ${u}`:L.lo!=null?`≥ ${fmtL(L.lo)} ${u}`:`≤ ${fmtL(L.hi)} ${u}`;

// 실시간 — 시험 중일 때만 목록 머리에 '실시간' 단추. 갱신이 30초 넘게 멈췄으면 시험 중으로 보지 않는다
const LIVE={on:false,at:0};
async function loadLive(){try{const j=await API.railNow();const k=j&&j.step&&j.step.key;LIVE.on=!!(k&&k!=='idle'&&num(j._file_age_s)&&j._file_age_s<30);}catch(e){LIVE.on=false;}LIVE.at=Date.now();}

/* ===== 세트 한 장의 재료 — setsOf · setCells · runModel · basisOf 로 만든다(새 판정 아님) ===== */
function setData(S){
  const X=setCells(S);
  const pk=[...PORDER.filter(p=>X.parts.includes(p)),...X.parts.filter(p=>!PORDER.includes(p))];
  const parts=pk.map(p=>{
    const rows=S.runs.filter(r=>r.top.part===p).map((lm,i)=>{const m=runModel(lm.name);
      return{name:lm.name,lm,m,idx:i+1,date:lm.date,inv:!!(m&&m.rig&&m.rig.valid===false),rig:m&&m.rig?m.rig.reasons.map(reasonText):[],
        cells:m&&m.cells?Object.fromEntries(Object.values(m.cells).map(x=>[x.s,{v:x.verdict,
          pf:Object.fromEntries((m.items||[]).filter(i=>i.kind==='pf').map(i=>[i.id,{v:cellVal(x.items[i.id]),j:x.items[i.id]?x.items[i.id].j:null}]))}])):{}};});

// 시안의 숫자 — setData 가 낸 값을 세기만 한다. cols = 파트 × 회차 칸, hot = 같은 회차 불합격 3대 이상, rep = 같은 셀 불합격 2회 이상

/* ===== 그림 — 막대 · 파레토 · 히스토그램. 실제 픽셀로 그린다(viewBox = 그림 크기, 글씨가 줄거나 커지지 않게) ===== */

/* ===== ② 세트 한 장 — 관제 > 세트 상세의 틀: 단계 표시 · 지표 카드 · 불량 파레토도 · 층별 체크시트(+ 셀 서랍) · 히스토그램 · 살펴봄 항목 · QC 판정 ===== */
// RQ = 세트 한 장의 상태 {key, D, M, cell, step, sort, q}. q = 고르는 중인 QC 판정 {dec, act:{시리얼: 조치}, note, comment, err, edit}
// 저장된 판정이 있으면 q 는 비고 화면은 잠긴다(고치기를 누르면 q 를 저장된 값으로 채워 다시 연다)
let RQ=null;
const qDisp=()=>RQ&&RQ.D&&DP.map?DP.map[RQ.D.S.comp]||null:null;   // 열쇠는 셀 구성(dispOf 와 같은 값)
const qLocked=()=>!!(qDisp()&&!(RQ.q&&RQ.q.edit));
const curDec=()=>qLocked()?qDisp().verdict:RQ.q?RQ.q.dec:null;
const curAct=s=>{if(qLocked()){const a=(qDisp().actions||{})[s];return a?a.act:'none';}return RQ.q?RQ.q.act[s]:undefined;};   // 저장 기록에 없는 셀은 '조치 없음'
const qState=D=>D.B.tentative?'제안값':uniq(D.B.pf.map(x=>x.c.status)).join(' · ')||'없음';
const qKind=(D,c)=>c.auto==='미판정'?'hold':D.READ[c.s]?D.READ[c.s].kind:'one';
function qPH(){const D=RQ.D,n=D.X.n,nf=D.fails.length,acts=D.fails.filter(c=>curAct(c.s)).length,dec=curDec();
  return [['회차',`${D.S.runs.length}회`],['장비 유효',`${D.nValid} / ${D.S.runs.length}`],['셀 판정',`${D.cells.length}대`],['합격 · 불합격',`${n['합격']} · ${n['불합격']}`],['QC 판정',dec?DEC[dec][0]:'대기'],['셀 조치',`${acts} / ${nf}`]];}
function qStepState(i){const D=RQ.D,nf=D.fails.length,acts=D.fails.filter(c=>curAct(c.s)).length,dec=curDec();
  if(i<4)return 'done';if(i===4)return dec?'done':'cur';return !dec?'todo':acts>=nf?'done':'cur';}
function qStepInfo(i){const {D,M}=RQ,n=D.X.n,dec=curDec();
  if(i===0)return M.parts.map(pt=>[pL(pt.p),`${pt.rows.length}회 · ${md(pt.rows[0].date)}${pt.rows.length>1?' ~ '+md(pt.rows[pt.rows.length-1].date):''}`]);
  if(i===1)return [['장비 유효',`${D.nValid}회`],['장비 무효',`${D.X.inval.length}회`],...M.invRows.map(c=>[`${pL(c.p)} ${c.r.idx}회차`,c.r.rig.join(' · ')||'장비 무효'])];
  if(i===2)return [['셀 종류',`${D.type} · ${D.model}`],['셀',`${D.cells.length}대`],['시리얼',serialRange(D.cells.map(c=>c.s))],['펌웨어',D.meta.fw.join(' · ')||'미확인']];
  if(i===3)return [['합격',`${n['합격']}대`],['불합격',`${n['불합격']}대`],['보류',`${D.holdN}대`],['기준 상태',qState(D)]];
  if(i===4){const d=qDisp();return [['QC 판정',dec?DEC[dec][0]:'대기'],...(qLocked()?[['저장',`${d.by||'담당자 미상'} · ${d.at?fmtLocal(d.at):'시각 미확인'}`]]:[]),
    ['판정 코드 커밋',D.meta.commit.join(' · ')||'미확인'],['프로토콜 판',D.meta.protocol.join(' · ')],['장면',D.meta.scene.join(' · ')||'미확인']];}
  const c={};for(const x of D.fails){const a=curAct(x.s)||'미선택';c[a]=(c[a]||0)+1;}
  return [...Object.entries(RACT).map(([k,t])=>[t,`${c[k]||0}대`]),['미선택',`${c['미선택']||0}대`]];}
function qSteps(){const P=qPH(), st=$('stp');if(!st)return;
  st.innerHTML=P.map(([k,v],i)=>{const c=qStepState(i);return `<li class="${c}"><button type="button" data-i="${i}" aria-expanded="${RQ.step===i}" aria-controls="stpDr"><span class="nd">${c==='done'?I('check',13,2.6):c==='cur'?'':i+1}</span><span class="t">${k}</span><span class="s">${esc(v)}</span></button></li>`;}).join('');
  st.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;RQ.step=RQ.step===i?null:i;qSteps();});
  const dr=$('stpDr');dr.hidden=RQ.step==null;
  if(RQ.step!=null)dr.innerHTML=`<div class="sec-h"><span>${P[RQ.step][0]}</span><span>${esc(P[RQ.step][1])}</span></div><div class="kv t">${qStepInfo(RQ.step).map(r=>`<div><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>`;
  const bd=$('setBadge');if(bd)bd.outerHTML=decBadge(curDec(),false,'setBadge');}
function viewSet(key){
  const b=box();if(!b)return;

  if(!S||!X||!X.loaded){RQ.D=null;b.innerHTML=`<div class="ph"><h1 tabindex="-1">${esc(key||'세트')}</h1><div class="ph-r"><button type="button" class="btn sm" data-golist>${I('back',14)}목록</button></div></div>
    <section class="card"><div class="empty">${!RL.runs||(S&&(!X||!X.loaded))?'불러오는 중':`${esc(key)} 기록 없음`}</div></section>`;bindQ(b);return;}

  b.innerHTML=`<div class="ph"><h1 tabindex="-1">${esc(S.key)}</h1><span class="badge" id="setBadge"></span><span class="sub">${esc(D.type)} · ${esc(D.model)} · 셀 ${nc} · ${esc(D.meta.sky.join(' · ')||'하늘 조건 미확인')} · 회차 ${nr} · ${esc(md(D.first))} ~ ${esc(md(D.last))}</span>
      <div class="ph-r"><button type="button" class="hq" data-qhelp aria-label="도움말" title="도움말">?</button><button type="button" class="btn sm" data-golist>${I('back',14)}목록</button></div></div>
    <section class="card stp-card" aria-label="판정 단계"><div class="card-b"><div class="stp-top"><b>회차 ${nr}</b><span class="chip">${I('clock',13)}${esc(md(D.first))} ${esc(D.first.t)} ~ ${esc(md(D.last))} ${esc(D.last.t)}</span><div class="r">${pv}</div></div><ol class="stp" id="stp"></ol><div class="stp-dr" id="stpDr" hidden></div></div></section>
    <div class="stats" id="rqStats">
      <div class="stat s-ok"><span class="l">${I('checkC',14)}셀 수율</span><span class="n">${fmt(pct(n['합격'],nc),1)}<small>%</small></span><span class="bar"><i style="width:${pct(n['합격'],nc)}%"></i></span><span class="foot"><span>합격 ${n['합격']} / ${nc}대 · 보류 ${D.holdN}</span></span></div>

      <div class="stat s-none"><span class="l">${I('flag',14)}기준 버전 ${esc(vk.map(k=>k.split(' ')[0]).join(' · ')||'없음')}</span><span class="n">${v1}<small>/ ${nr}회</small></span>
        <span class="bar"><i style="width:${pct(v1,nr)}%;background:var(--ink-2)"></i></span><span class="foot"><span>없음 ${VC['없음']||0}${later.length?` · <span class="mono" title="${esc(uniq(later.map(c=>String(RL.raw[c.r.name].criteria_applied_later))).join(' / '))}">criteria_applied_later ${later.length}</span>`:''}</span></span></div>

// 그림 둘(불량 파레토도 · 히스토그램) — 카드 폭을 재서 그린다. 화면 폭이 바뀌면 이것만 다시 그린다
function qCharts(){

  h.querySelectorAll('figure.qf').forEach(f=>{const pt=M.parts[+f.dataset.pi], it=pt.pf[+f.dataset.ii], vals=valsOf(pt,it);

// 층별 체크시트 — 추이 분석 열빛 지도(.hm)와 같은 칸 · 같은 표지. 모든 칸을 자리로 놓는다(테두리 겹침 때문)
function qSheet(){
  const host=$('cs');if(!host||!RQ||!RQ.M)return;
  const {M}=RQ, G=[];let col=2;const colOf={};
  M.parts.forEach((pt,gi)=>{if(gi){G.push({sp:true,col});col++;}const a=col;pt.rows.forEach(r=>{colOf[pt.p+'|'+r.idx]=col;col++;});G.push({pt,a,b:col});});
  const cntCol=col, used=new Set(Object.values(colOf)), tmpl=['var(--lw)'];for(let c=2;c<cntCol;c++)tmpl.push(used.has(c)?'minmax(20px,1fr)':'8px');tmpl.push('46px');
  host.style.gridTemplateColumns=tmpl.join(' ');host.style.minWidth=`calc(var(--lw) + ${Object.keys(colOf).length*22+(M.parts.length-1)*8+46}px)`;
  const at=(r,c,cls,inner)=>`<div class="${cls}" style="grid-row:${r};grid-column:${c}">${inner}</div>`;
  let h='';
  // 1줄 파트 · 2줄 회차별 불합격 수 · 3줄 회차 번호
  for(const g of G){if(g.sp)continue;const nf=M.cells.filter(c=>c.t[g.pt.p]&&c.t[g.pt.p].fail).length;h+=`<div class="gl${nf?' bad':''}" style="grid-row:1;grid-column:${g.a} / ${g.b}" title="${esc(pName(g.pt.p))} · ${esc(PT(g.pt.p).sub)}">${esc(pL(g.pt.p))}</div>`;}
  h+=at(2,1,'rl hd','불합격');h+=at(3,1,'rl hd','회차');h+=at(3,cntCol,'tot','');
  for(const pt of M.parts)for(const r of pt.rows){const c=colOf[pt.p+'|'+r.idx],nf=r.inv?0:Object.values(r.cells).filter(x=>x.v==='불합격').length,hot=M.hot.has(pt.p+'|'+r.idx);
    h+=at(2,c,'tal',r.inv?'':nf?`<b>${nf}</b><i style="height:${Math.min(22,4+nf*4)}px"></i>`:'');
    h+=at(3,c,'vc',`<button type="button" data-run="${esc(r.name)}" title="${esc(pL(pt.p))} ${r.idx}회차 · ${esc(md(r.date))} ${esc(r.date.t)}${r.inv?' · 장비 무효 · '+esc(r.rig.join(' · ')):''}"><span class="${r.inv?'s-idle':hot?'s-bad solid':nf?'s-bad':'s-none'}">${r.idx}</span></button>`);}
  const ord=RQ.sort==='sn'?[...M.cells].sort((a,b)=>a.s<b.s?-1:1):M.order;
  const sel=RQ.cell||(M.order[0]&&M.order[0].s);let row=4;const rowOf={};
  const fl=ord.filter(c=>c.auto!=='합격'),ps=ord.filter(c=>c.auto==='합격'),nb=fl.filter(c=>c.auto==='불합격').length,nh=fl.length-nb;
  const grp=RQ.sort==='sn'?[[null,ord]]:[[fl.length?`불합격 ${nb}${nh?` · 보류 ${nh}`:''}`:null,fl],[`합격 ${ps.length}`,ps]];
  for(const [lab,list] of grp){if(lab){h+=`<div class="gh${lab.startsWith('불')?' bad':''}" style="grid-row:${row};grid-column:1">${lab}</div>`;row++;}
    for(const c of list){rowOf[c.s]=row;const bd=c.auto==='불합격';
      h+=`<button type="button" class="rl${bd?' bad':''}" role="option" data-cell="${esc(c.s)}" aria-selected="${c.s===sel}" style="grid-row:${row};grid-column:1"><span class="mono">${esc(c.s)}</span><small>${esc(c.dock)}</small></button>`;
      for(const pt of M.parts)for(const r of pt.rows){const x=r.cells[c.s],v=x?x.v:null,cls=r.inv?'h-void':!x?'h-na':v==='불합격'?'h-bad':v==='미판정'?'h-hold':'';
        const why=x&&v==='불합격'?Object.entries(x.pf).filter(([,y])=>y.j==='불합격').map(([id,y])=>{const it=pt.pf.find(i=>i.id===id)||{unit:''};return `${iName(id)} ${VAL(id,y.v)} ${it.unit}`;}).join(' · '):'';
        h+=`<span class="hc ${cls}" data-cell="${esc(c.s)}" style="grid-row:${row};grid-column:${colOf[pt.p+'|'+r.idx]}" title="${esc(c.s)} · ${esc(pL(pt.p))} ${r.idx}회차 · ${r.inv?'장비 무효':!x?'기록 없음':esc(v==='미판정'?'보류':v)}${why?' · '+esc(why):''}"></span>`;}
      h+=`<span class="tot${c.f?' bad':''}" style="grid-row:${row};grid-column:${cntCol}">${c.f}/${c.n}</span>`;row++;}}
  // 표지 — 같은 회차 불합격 ≥ 3대(열), 같은 셀 불합격 ≥ 2회(그 파트 칸만)
  for(const k of M.hot){const c=colOf[k];if(c)h+=`<div class="ring" style="grid-row:3 / ${row};grid-column:${c}"></div>`;}
  for(const [s,L] of Object.entries(M.rep))for(const x of L){const g=G.find(g=>!g.sp&&g.pt.p===x.p);if(g&&rowOf[s])h+=`<div class="ring" style="grid-row:${rowOf[s]};grid-column:${g.a} / ${g.b}"></div>`;}
  host.innerHTML=h;
  const wr=host.parentElement, rg=host.querySelector('.ring'), rl=host.querySelector('.rl');
  if(wr&&rg&&rl&&!qSheet._sc&&wr.scrollWidth>wr.clientWidth){wr.scrollLeft=Math.max(0,rg.offsetLeft-rl.offsetWidth-60);qSheet._sc=true;}
  host.querySelectorAll('[data-cell]').forEach(x=>x.onclick=()=>qPick(x.dataset.cell));
  host.querySelectorAll('[data-run]').forEach(x=>x.onclick=()=>go('railRun',{run:x.dataset.run}));
}
// 셀 서랍 — 추이 분석의 셀 상세와 같은 자리(넓으면 오른쪽 고정, 좁으면 위로 떠서 열림)
function qInsp(){
  const box=$('insp');if(!box||!RQ||!RQ.M)return;const {D,M}=RQ;
  const s=RQ.cell||(M.order[0]&&M.order[0].s),c=M.cells.find(x=>x.s===s);if(!c){box.innerHTML='';return;}
  const st=c.auto==='불합격'?['불합격','s-bad']:c.auto==='미판정'?['보류','s-d1']:['합격','s-ok'], R=D.READ[s], k=c.auto==='합격'?null:qKind(D,c), rp=M.rep[s];

  box.innerHTML=`<div class="card qdr"><div class="ih"><b>셀 <span class="mono">${esc(s)}</span></b><span class="badge sm ${st[1]}"><span class="dot"></span>${st[0]}</span><span class="chip sm mono">칸 ${esc(c.dock)}</span><button type="button" class="x" id="inspX" aria-label="닫기">${I('x',16)}</button></div>
    <div class="ib">${chips?`<div class="chips">${chips}</div>`:''}

// 살펴봄 항목 — 접어 둔다. 숫자만(셀 종합 판정에 넣지 않는 항목)
function qRV(){
  const {M}=RQ, rows=[];let tot=0;
  for(const pt of M.parts){const V=pt.rows.filter(r=>!r.inv&&r.m);const ids=uniq(V.flatMap(r=>(r.m.items||[]).filter(i=>i.kind==='rv').map(i=>i.id)));
    for(const id of ids){let n=0,st=null;const cs=new Set();
      for(const r of V){const it=r.m.items.find(i=>i.id===id);if(it&&it.crit&&it.crit.status)st=it.crit.status;for(const x of Object.values(r.m.cells))if((x.review||[]).some(q=>q.id===id)){n++;cs.add(x.s);}}
      tot+=n;rows.push(`<tr><td>${esc(pL(pt.p))}</td><td>${esc(iName(id))}</td><td>${esc(st||'미정')}</td><td class="n" style="${n?'font-weight:700':''}">${n}</td><td class="n">${V.length}</td><td class="mono" style="white-space:normal">${[...cs].sort().map(esc).join(' · ')||'–'}</td></tr>`);}}

}
// QC 판정 — 세트: 합격 · 불합격 · 재시험, 불합격 셀: 조치 넷. 저장하면 잠긴 모양(고치기로 다시 연다)
function qQC(){
  const {D,M}=RQ, S=D.S, fails=M.order.filter(c=>c.auto!=='합격'), d=qDisp(), lock=qLocked(), q=RQ.q, dec=curDec(), dis=lock?' disabled':'';
  $('qcBadge').innerHTML=decBadge(dec,true);

    const chip=k==='hold'?'<span class="chip sm">보류</span>':k==='run'?'<span class="chip sm">같은 회차 ≥ 3대</span>':k==='rep'?`<span class="chip sm">같은 셀 ${rf?rf.runs.length:2}회</span>`:'<span class="chip sm">1회</span>';
    const sel=`<select class="inp" data-act="${esc(c.s)}" aria-label="${esc(c.s)} 조치"${dis}><option value="">고르기</option>${Object.entries(RACT).map(([v,t])=>`<option value="${v}" ${a===v?'selected':''}>${t}</option>`).join('')}</select>`;
    const lead=`<td><button type="button" class="sn bad" data-cell="${esc(c.s)}">${esc(c.s)}</button></td><td class="mono">${esc(c.dock)}</td>`;

    if(!its.length)return `<tr data-row="${esc(c.s)}">${lead}<td colspan="5" class="muted">${c.auto==='미판정'?'보류 · 판정 재료 없음':esc(fi.map(f=>`${pL(f.pt.p)} 불합격 ${f.t.fail} / ${f.t.n}`).join(' · ')||'불합격')}</td><td>${chip}</td><td>${sel}</td></tr>`;
    return its.map(({f,x},j)=>{const it=x.it, first=j===0;
      return `<tr data-row="${esc(c.s)}">${first?lead:'<td></td><td></td>'}<td>${esc(pL(f.pt.p))}</td><td>${esc(iName(it.id))}</td><td class="n" style="color:var(--bad);font-weight:700">${uniq(x.vals.map(v=>VAL(it.id,v))).join(' · ')} <span class="muted" style="font-weight:500">${esc(it.unit)}</span></td><td class="mono">${it.L?esc(limT(it.L,it.unit)):'–'}</td><td class="n">${f.t.fail} / ${f.t.n}</td>
        ${first?`<td>${chip}</td><td>${sel}</td>`:'<td></td><td></td>'}</tr>`;}).join('');};
  const hist=d&&(d.history||[]).length?`<details class="mini"><summary>이전 판정 ${d.history.length}</summary><div class="tw"><table class="tbl"><thead><tr><th>QC 판정</th><th>저장</th><th>의견</th></tr></thead><tbody>${d.history.map(h=>`<tr><td>${decBadge(h.verdict,true)}</td><td class="mono">${esc(h.by||'')} · ${esc(h.at?fmtLocal(h.at):'')}</td><td class="t">${esc(h.comment||'')}</td></tr>`).join('')}</tbody></table></div></details>`:'';
  const foot=lock?`<div class="qrow"><span class="lab">의견</span><input class="inp cm" id="qcCm" aria-label="의견" value="${esc(d.comment||'')}" disabled></div>
      <div class="qrow qstamp"><span class="lab">저장</span>${decBadge(d.verdict,true)}<span class="chip sm">${esc(d.by||'담당자 미상')}</span><span class="chip sm mono">${esc(d.at?fmtLocal(d.at):'시각 미확인')}</span>${d.tentative?'<span class="chip sm">기준 상태 제안값</span>':''}<button type="button" class="btn sm" id="qcEdit">고치기</button></div>${hist}`
    :`<div class="qrow"><span class="lab">의견</span><input class="inp cm" id="qcCm" aria-label="의견" value="${esc(q.comment)}">${d?'<button type="button" class="btn" id="qcCancel">취소</button>':''}<button type="button" class="btn primary" id="qcSave" ${dec?'':'disabled'}>저장</button></div>${q.err?`<div class="qrow"><span class="qerr" role="alert">${esc(q.err)}</span></div>`:''}${hist}`;
  const body=$('qcBody');

      <span class="chip sm">기준 상태 ${esc(qState(D))}</span><span class="chip sm mono">${esc(D.meta.commit.join(' · ')||'미확인')}</span></div>
    ${fails.length?`<div class="tw" style="border:1px solid var(--line);border-radius:9px"><table class="tbl"><thead><tr><th>셀</th><th>칸</th><th>파트</th><th>합불 항목</th><th class="n">값</th><th>한계</th><th class="n">불합격 / 장비 유효</th><th>층별</th><th>조치</th></tr></thead><tbody>${fails.map(row).join('')}</tbody></table></div>`:''}

}
// 저장 — 로컬은 POST /api/rail/disposition, 클라우드는 표 rail_disposition(API.railDispSave). 값 모양은 그대로(담당자 · 시각 · 기준 버전 · 판정 코드 커밋 · 이력)
async function qSave(){
  const {D}=RQ, S=D.S, q=RQ.q;if(!q)return;
  const fail=m=>{q.err=m;qQC();};
  const cm=q.comment.trim();
  if(!q.dec)return fail('세트 판정 고르기');
  if(q.dec==='fail'&&!cm)return fail('불합격 · 의견 필요');
  if(q.dec==='pass'){const miss=D.fails.filter(c=>!q.act[c.s]);if(miss.length)return fail(`조치 미선택 ${miss.length}대 · ${miss.slice(0,4).map(c=>c.s).join(' · ')}${miss.length>4?' …':''}`);}
  if(D.fails.some(c=>q.act[c.s]==='hold')&&!cm)return fail('판단 보류 · 의견 필요');
  const acts={};for(const c of D.fails){const a=q.act[c.s];if(a&&a!=='none')acts[c.s]={act:a,note:(q.note&&q.note[c.s])||''};}
  const prev=dispOf(S.key), rec={set:S.key,verdict:q.dec,actions:acts,comment:cm,by:API.loggedIn&&API.loggedIn()?API.email():'제어 PC',at:Date.now(),
    criteria_version:Object.keys(D.B.VC||{}).length>1?Object.entries(D.B.VC).map(([k,n])=>`${k} ${n}개`).join(' · '):D.B.ver,tentative:D.B.tentative,judge_commit:D.meta.commit.join(' · ')||null,runs:S.runs.map(r=>r.name),
    history:prev?[{verdict:prev.verdict,actions:prev.actions,comment:prev.comment,by:prev.by,at:prev.at},...(prev.history||[])]:[]};
  try{await API.railDispSave(S.comp,rec);(DP.map=DP.map||{})[S.comp]=rec;RQ.q=null;toast(`저장 · ${S.key} · ${DEC[rec.verdict][0]}`);qQC();qSteps();}
  catch(e){fail('저장 못 함 · '+e.message);}
}

function fig6(A,B,ia,ib){

  const vals=rows.flatMap(s=>[ia.cells[s]&&ia.cells[s].v,ib.cells[s]&&ib.cells[s].v]).filter(num);
  let lo=Math.min(...vals), hi=Math.max(...vals);const pad=(hi-lo)*0.08||1;lo-=pad;hi+=pad;
  const X=v=>padL+(v-lo)/(hi-lo)*(W-padL-8), o=[];
  const nt=nice(lo,hi);
  nt.ticks.filter(t=>t>=lo&&t<=hi).forEach(t=>{o.push(`<line class="grid" x1="${X(t)}" y1="${top-6}" x2="${X(t)}" y2="${top+rows.length*rowH}"/><text class="n" x="${X(t)}" y="${top+rows.length*rowH+14}" text-anchor="middle">${fmt(t,nt.dec)}</text>`);});
  o.push(`<text class="t" x="${padL}" y="12">${esc(ia.label)}</text><text class="u" x="${W-8}" y="12" text-anchor="end">${esc(ia.unit)}</text>`);
  rows.forEach((s,i)=>{const y=top+i*rowH+rowH/2, x=ia.cells[s], z=ib.cells[s], c=x&&z&&x.j!==z.j;
    o.push(`<text class="yl" x="${padL-8}" y="${y+4}" text-anchor="end" style="font-size:10.5px${c?';fill:var(--bad);font-weight:700':''}">${esc(s)}</text>`);
    if(x&&z&&num(x.v)&&num(z.v))o.push(`<line class="db ${c?'chg':''}" x1="${X(x.v)}" y1="${y}" x2="${X(z.v)}" y2="${y}"/>`);
    if(x&&num(x.v))o.push(`<circle class="da" cx="${X(x.v)}" cy="${y}" r="3.6"><title>${esc(s)} A · ${fmtA(x.v)} · ${esc(x.j||'')}</title></circle>`);
    if(z&&num(z.v))o.push(`<circle class="dbb ${c?'chg':''}" cx="${X(z.v)}" cy="${y}" r="3.6"><title>${esc(s)} B · ${fmtA(z.v)} · ${esc(z.j||'')}</title></circle>`);
    if((x&&!num(x.v))||(z&&!num(z.v)))o.push(`<text class="u" x="${W-8}" y="${y+4}" text-anchor="end">${!x||!num(x.v)?'A ':''}${!z||!num(z.v)?'B ':''}값 없음</text>`);});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="항목 차이">${o.join('')}</svg>`;

}

let reqSeq=0, appliedSeq=0;   // 범위를 빨리 바꿔도 늦게 온 이전 응답이 새 그림을 덮지 않게
// 방전 기록 · 사이클 기록 · 셀 추출 결과는 사이클이나 단계가 바뀔 때(또는 5분마다 · 추이 분석을 보는 동안 1분마다)만 다시 받는다(M-5).
// 최근 5사이클 · 전체 범위의 묶음 표본도 1분 동안은 다시 쓴다 — 서버가 수백 사이클을 다시 묶지 않게
let LAZY={key:null,at:0,force:true}, SMP={rng:null,at:0,v:null};
async function refresh(){
  const my=++reqSeq, rng=R; let cs=curSet();
  // 신호등과 지금 상태를 함께 받는다 — 느린 연결에서 첫 화면이 줄줄이 기다리지 않게(H-5). 신호등이 실패해도 아래 화면은 그대로 그린다
  let nowP=API.now(cs).then(x=>({ok:x}),e=>({err:e}));
  await refreshHealth();
  // 신호등을 받고 보니 그 세트가 운전 중이 아니다(또는 그 반대) — 맞는 세트로 다시 받는다(QA D-1)
  if(curSet()!==cs){cs=curSet();nowP=API.now(cs).then(x=>({ok:x}),e=>({err:e}));}
  try{
    const nr=await nowP;if(nr.err)throw nr.err;
    const now=nr.ok||{}, t=Date.now();
    const key=`${cs}|${now.cycle}|${now.phase}`, lazy=LAZY.force||key!==LAZY.key||t-LAZY.at>300e3||(U.view==='trend'&&t-LAZY.at>60e3);
    const reuse=rng!=='cycle'&&SMP.rng===rng&&SMP.key===`${cs}|${now.cycle}`&&t-SMP.at<60e3;
    const [smp,cur,ev,cyc,dis,cx,gg]=await Promise.all([reuse?SMP.v:API.samples(rng,cs),rng==='cycle'?null:API.samples('cycle',cs),API.events(cs),lazy?API.cycles(cs):null,lazy?API.discharge(cs):null,lazy?API.cells(cs):null,lazy?API.gauge(cs).catch(()=>'fail'):null]);
    if(U.view==='trend'&&cs!==curSet())return;   // 그 사이 다른 세트를 골랐다 — 옛 세트 응답은 버린다
    if(my<appliedSeq)return; appliedSeq=my;
    if(rng!=='cycle'&&!reuse)SMP={rng,at:t,key:`${cs}|${now.cycle}`,v:smp};
    if(lazy)LAZY={key,at:t,force:false};
    const rows=(smp&&smp.rows)||[];
    const same=S.set===cs;                 // 다른 세트로 옮겼으면 사이클 · 방전 기록을 그 세트 것으로(옛 세트 것을 이어 쓰지 않는다)
    S={set:cs,now,samples:rows,bucketS:(smp&&+smp.bucket_s)||null,cur:rng==='cycle'?rows:((cur&&cur.rows)||[]),range:rng,cycles:lazy?(cyc||[]):same?S.cycles:[],events:ev||[],dis:lazy?(dis||[]):same?S.dis:[],cellsX:lazy?(cx||[]):same?S.cellsX:[],gauge:ggKeep(S.gauge,gg,lazy,same)};   // gauge: 읽기 실패면 같은 세트의 직전 값을 지킨다(n₁ 이 흔들리지 않게)
    NETERR=false; LOADED=true; LASTOK=Date.now()/1000;
    if(isMulti()){const nb={},eb={};await Promise.all(runningIds().filter(k=>k!==cs).map(async k=>{
      try{nb[k]=await API.now(k);}catch(e){nb[k]=NOWBY[k]||{};}
      try{eb[k]=await API.events(k);}catch(e){eb[k]=EVBY[k]||[];}}));NOWBY=nb;EVBY=eb;}
    else{NOWBY={};EVBY={};}
    if(U.view==='reg'&&!API.cloud)await loadReg();     // 등록 화면에 있으면 감지 목록 · 플러그 표도 새로
    update(); refreshControl();
  }catch(e){console.warn('결과판 갱신 실패 — 마지막으로 받은 값을 유지',e);NETERR=true;update();}
}
// 처음 열 때: 주소 끝의 화면이 이긴다(링크 공유). 없으면 저장된 화면 — 단, 등록은 늘 관제에서 들어간다.
// 처음 연 주소는 기록 하나로 바꿔 둔다 — 직접 연 #register 에서 화면 단추로 나갈 때 결과판 밖으로 나가지 않게(state.reg=false)
{const h0=fromHash();if(h0){U.view=h0.view;if(h0.set)U.set=h0.set;if(h0.run)U.rrun=h0.run;if(h0.cmp)U.rcmp=h0.cmp;if(h0.rcell)U.rcell=h0.rcell;if(h0.rset)U.rset=h0.rset;}else if(U.view==='reg')U.view='ops';else if(U.view==='railRun'||U.view==='railCmp'||U.view==='railSet')U.view='rail';saveU();
 history.replaceState({reg:false},'',location.pathname+location.search+(railHash(U.view)||hashOf(U.view,U.set)));}
if(U.view==='reg')startReg();
render(); refresh(); setInterval(refresh,10000);
})();
</script>
