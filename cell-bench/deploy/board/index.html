<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Bench — 셀 배터리 내구 시험</title>
<script>
(function(){var m='auto';try{m=JSON.parse(localStorage.getItem('theme')||'"auto"')}catch(e){}
var d=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');})();
</script>
<style>
/* 설계 메모 — 승인된 시안 docs/design/cellbench-app-mockup.html 을 실데이터로 입힌 것.
   앱 셸: 왼쪽 내비 216px(관제 · 추이 분석 · 절차 · 기준 · 점검 + 세트 묶음) · 위 막대 52px(위치 · 전역 상태 알약 · 계정).
   화면 6개: 관제(첫 화면) · 세트 상세 · 추이 분석 · 절차 · 기준 · 점검(신호등 9계통) · 세트 등록(3단계).
   점검은 첫 화면에 두지 않는다 — 내비 '점검' + 위 막대 알약 + 내비 배지로만 드러난다. 세트 등록은 관제의 미등록 칸 [등록]에서 들어간다.
   데이터: cloud-config.js 가 없으면 serve_board.py 의 /api/*, 있으면 Supabase. 10초마다 다시 읽는다. 외부 리소스 없음(시험망에 인터넷이 없다).
   상태 색: s-ok 정상 · s-warn 준비 · s-bad 조치 · s-unk 신호 없음(빨강과 같은 무게 — 빨간 고리) · s-idle 운전 대기(회색 고리) · s-none 기록 없음(회색).
   불마다 글자가 함께 간다 — 색만으로 뜻을 전하지 않는다. */
:root{
  --bg:#F5F6F4; --panel:#FFFFFF; --side:#EEF0EC; --line:#E2E5E0; --line-2:#D2D7D0;
  --ink:#1C2124; --ink-2:#4B5458; --ink-3:#7D878C;
  --brand:#0E9F6E; --brand-soft:#E5F5EE; --hover:#F7F8F6; --sel:#EEF6F2;
  --ok:#11A06E; --ok-z:#DDF1E7; --warn:#C27C12; --warn-z:#FBEBCB; --warn-soft:#FDF5E6; --bad:#C2453B; --bad-z:#F6D6D2; --bad-soft:#FCEDEB;
  --unk:#AAB2B6; --unk-z:#E7EAE7;
  --d1:#2F6FB3; --d1-z:#DCE7F4; --on-solid:#FFFFFF; --scrim:rgba(10,15,12,.35);
  --shadow:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06); --lift:0 1px 2px rgba(0,0,0,.08); --lift-2:0 1px 3px rgba(0,0,0,.2);
  --font:"IBM Plex Sans KR","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
}
/* 화면 모드: <head> 의 스크립트가 저장된 선택(자동 · 라이트 · 다크)을 읽어 data-theme 를 light/dark 로 정한다 */
:root[data-theme="dark"]{
  --bg:#111416; --panel:#191E20; --side:#14181A; --line:#283034; --line-2:#343D41;
  --ink:#E8ECE9; --ink-2:#B6BEC1; --ink-3:#7E888D;
  --brand:#34D399; --brand-soft:#16322A; --hover:#1E2427; --sel:#1B2C27;
  --ok:#34D399; --ok-z:#183A2E; --warn:#E8AE52; --warn-z:#4A3816; --warn-soft:#2E2614; --bad:#F08C84; --bad-z:#4D2724; --bad-soft:#2E1C1B;
  --unk:#5F6A70; --unk-z:#262D30;
  --d1:#79AEEB; --d1-z:#1F3047; --on-solid:#111416; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --lift:0 1px 2px rgba(0,0,0,.4); --lift-2:0 1px 3px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:is(button,input,a,label,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg text{font-family:var(--font)}
.mono{font-family:var(--mono)}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* 상태 색 묶음 — 신호 없음은 빨강과 같은 무게(빨간 고리), 운전 대기는 회색 고리, 기록 없음은 회색 */
.s-ok{--c:var(--ok);--z:var(--ok-z);--soft:var(--brand-soft)}
.s-warn{--c:var(--warn);--z:var(--warn-z);--soft:var(--warn-soft)}
.s-bad{--c:var(--bad);--z:var(--bad-z);--soft:var(--bad-soft)}
.s-unk{--c:var(--bad);--z:var(--bad-z);--soft:var(--bad-soft)}
.s-idle{--c:var(--unk);--z:var(--unk-z);--soft:var(--unk-z)}
.s-none{--c:var(--ink-3);--z:var(--line);--soft:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3));flex:none;display:inline-block}
.s-unk.dot,.s-unk .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--bad)}
.s-idle.dot,.s-idle .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--unk)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;background:var(--soft,var(--bg));color:var(--c,var(--ink-2));font-weight:600;font-size:12px;white-space:nowrap}
.s-unk.badge{color:var(--bad)} .s-idle.badge,.s-none.badge{color:var(--ink-3)}
button.badge{border:0;cursor:pointer}
.badge.sm{height:20px;padding:0 7px;font-size:11px;gap:5px}
.badge.sm .dot{width:7px;height:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip svg{color:var(--ink-3)}
.chip.sm{height:20px;padding:0 7px;font-size:11px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:700;margin-left:6px;vertical-align:1px}
.muted{color:var(--ink-3)} .sm{font-size:12px}
.msg-bad{color:var(--bad)} .msg-ok{color:var(--ok)} .msg-warn{color:var(--warn)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-z);background:var(--bad-soft)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);background:var(--bad-soft)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:var(--on-solid)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
/* 잠긴 주 단추는 채움을 빼고 점선 테두리로 — 누를 수 있는 단추처럼 보이지 않게 (QA D-11) */
.btn.primary:disabled,.btn.danger:disabled{background:none;color:var(--ink-3);border-color:var(--line-2);border-style:dashed;opacity:.8}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.icon-btn{width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.inp{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;min-width:0}
.inp.pin{width:84px;font-family:var(--mono);letter-spacing:.08em}
.inp:disabled{opacity:.5}

/* 분할 단추 (범위 · 정렬 · 화면 모드) */
.seg{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px}
.seg>div{display:inline-flex;padding:2px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--lift),0 0 0 1px var(--line)}
.seg.th button{width:28px;padding:0;justify-content:center}

/* 앱 셸 */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 0 215px,var(--line) 215px 216px,transparent 216px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em;flex:none}
.brand>div{min-width:0}
.brand b{display:block;font-size:13.5px} .brand small{display:block;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:grid;gap:2px}
.nav button,.sets button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--ink-2);cursor:pointer;text-align:left;font-weight:500;width:100%}
.nav button:hover,.sets button:hover{background:var(--hover)}
.nav button[aria-current="page"],.sets button[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--c);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .cnt.s-unk{background:var(--panel);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.sets{display:grid;gap:2px}
.sets .gl{padding:0 10px 4px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.sets button{height:30px;font-size:13px}
.sets button .dot{margin:0 3px 0 4px}
.sets button small{margin-left:auto;color:var(--ink-3);font-size:11.5px;font-weight:500}
.sets button small.s-warn{color:var(--warn);font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:6px 4px 6px 10px;color:var(--ink-3);font-size:12px}
.side-foot .lv{display:flex;align-items:center;gap:8px;min-width:0}
.side-foot .lv span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .md{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pulse{position:relative}
@media (prefers-reduced-motion:no-preference){
  .pulse.s-ok::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb button{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:5px;color:var(--ink-3);cursor:pointer}
.crumb button:hover{color:var(--ink);background:var(--hover)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.health{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--c);white-space:nowrap}
.health.s-unk{border-style:dashed;border-color:var(--bad-z)}
.health.s-none,.health.s-idle{color:var(--ink-2)}
.me{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 10px 0 3px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2);max-width:220px}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .av,.av{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.me.out{padding:0 12px 0 10px}
.th-m,.det-m{display:none}

.content{padding:24px;display:grid;gap:18px;max-width:1400px;width:100%;align-content:start}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:32px}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph h1:focus,#regChk:focus,.wz-b h2:focus{outline:none}
.ph .sub{color:var(--ink-3);font-size:12.5px}
.ph .ph-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 카드 · 집계 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:6px 10px;min-height:52px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-b{padding:16px}
.tbl tr.pick{cursor:pointer}
.tbl tr.pick:hover td{background:var(--hover)}
.tbl tr.pick[aria-selected="true"] td{background:var(--hover);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;display:grid;gap:6px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s;align-content:start;min-width:0}
div.stat{cursor:default}
button.stat:hover{border-color:var(--line-2)}
.stat[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px var(--z)}
.stat .l{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:500;font-size:12.5px;min-width:0}
.stat .l svg{color:var(--ink-3);flex:none}
.stat .n{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:5px}
.stat .n small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.stat .n.c{color:var(--c)}
.stat.zero .n{color:var(--ink-3)}
.stat .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.stat .bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.stat .foot{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;min-height:18px;min-width:0}
.stat .foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .foot.wrap span{white-space:normal;overflow:visible}
.tbx{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 16px;margin:0;padding:12px 16px 16px;font-size:12.5px;color:var(--ink-2)}
.tbx dt{color:var(--ink-3);font-weight:600}
.tbx dd{margin:0;min-width:0}
.tbx ul{margin:0;padding-left:18px}
@media (max-width:600px){.tbx{grid-template-columns:1fr}.tbx dd{margin-bottom:6px}}

/* 기준 게이지 (셀 잔량 · 공용) */
.g{position:relative;height:8px;border-radius:4px;background:var(--line);display:flex;overflow:visible}
.g .z{position:absolute;top:0;bottom:0}
.g .z.ok{background:var(--ok-z)} .g .z.warn{background:var(--warn-z)} .g .z.bad{background:var(--bad-z)}
.g .z:first-child{border-radius:4px 0 0 4px} .g .z:last-of-type{border-radius:0 4px 4px 0}
.g .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 3px var(--c),var(--lift-2)}
.soc{position:relative;height:8px;border-radius:4px;background:var(--line);display:block}
.soc i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}
.soc .bl{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--warn)}
.ends{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--ink-3);position:relative}
.ends .blab{position:absolute;transform:translateX(-50%);color:var(--warn);font-weight:600}

/* 목록 + 상세 패널 */
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1280px){.body{grid-template-columns:minmax(0,1fr) 360px}}
.insp{display:none;align-content:start}
@media (min-width:1280px){.insp{display:grid;position:sticky;top:76px;max-height:calc(100vh - 96px)}.insp .card{overflow:auto}}
.insp .card{display:grid;box-shadow:var(--shadow)}
.ih{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ih b{font-size:15px}
.ih .x{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:none;place-items:center}
.ib{padding:18px 16px;display:grid;gap:20px;min-width:0}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big span{font-size:15px;color:var(--ink-2);font-weight:600}
.big .tag{font-size:11px;font-weight:700;color:var(--warn);align-self:center}
.big .tag.bad{background:var(--bad-z);color:var(--bad)}
.lab{color:var(--ink-3);font-size:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-3);font-weight:600;gap:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv>div{padding:10px 12px;display:grid;gap:3px;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-child(odd){border-right:1px solid var(--line)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv>div:nth-child(odd):last-child{grid-column:1/-1;border-right:0}
.kv span{color:var(--ink-3);font-size:11.5px;display:flex;align-items:center;gap:5px}
.kv b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.kv b small{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.kv.t b{font-size:13px;font-weight:600;line-height:1.35}
.scrim{display:none}
@media (max-width:1279px){
  .insp.open{display:grid;position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(400px,100%);padding:12px}
  .insp.open .card{max-height:100%;overflow:auto}
  .insp .ih .x{display:grid}
  .scrim.open{display:block;position:fixed;inset:0;z-index:15;background:var(--scrim)}
}

/* 알림 · 토스트 · 떠 있는 상자 */

/* 표 · 접기 */

.sc .hrl svg{color:var(--ink-3);flex:none} .sc .hrl.s-warn,.sc .hrl.s-bad{color:var(--c)} .sc .hrl.s-warn svg,.sc .hrl.s-bad svg{color:var(--c)}

/* 시험실 구성 — 세트마다 한 줄(HTML 격자 · 2026-10-16 확정 시안). 선 색 묶음: --lc 색 · --ls 모양. 끊김 · 모름은 점선 */
.tp .l-ok{--lc:var(--ok);--ls:solid} .tp .l-warn{--lc:var(--warn);--ls:solid}
.tp .l-bad{--lc:var(--bad);--ls:dashed} .tp .l-none{--lc:var(--line-2);--ls:dashed}
.tp .c-ok{color:var(--ok)} .tp .c-warn{color:var(--warn)} .tp .c-bad{color:var(--bad)} .tp .c-none{color:var(--ink-3)}
.tpw{container-type:inline-size}
.tp{--g:28px;--tx:13px;--b:44px;--chip:26px;--trunk:var(--line-2);position:relative}
.tp .tic{width:18px;height:18px;flex:none;color:var(--ink-2)}
.tp .nd{position:relative;display:flex;align-items:center;gap:10px;min-width:0;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.tp .nd:hover{background:var(--hover)}
.tp .nd[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.tp .nd .tx{display:grid;gap:1px;min-width:0}
.tp .nd b{font-size:13px;font-weight:600;line-height:1.3}
.tp .nd small{font-size:11px;color:var(--ink-3);line-height:1.35}
.tp .nd small .c-warn,.tp .nd small .c-bad{font-weight:700}
.tp .nd small.c-warn,.tp .nd small.c-bad{font-weight:600}
.tp .nd small.c-warn,.tp .nd small .c-warn{color:var(--warn)} .tp .nd small.c-bad,.tp .nd small .c-bad{color:var(--bad)}
.tp .nd.bad{border-color:var(--bad)} .tp .nd.warn{border-color:var(--warn)}
.tp .nd.dash{border-style:dashed}
/* 위 띠: 윗줄 = 제어 PC ─ 유선 인터넷 ─ 클라우드 · 아랫줄 = LiveHub(제어 PC 아래, Wi-Fi 5 GHz) · 범례.
   USB 데이터는 제어 PC 아래에서 오른쪽 끝으로 나가 허브 쪽 줄기(오른쪽)로 이어진다 */
.tp-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(56px,1fr) minmax(0,2fr);grid-template-rows:auto auto;row-gap:28px;align-items:stretch}
.tp-pc{grid-column:1;grid-row:1}
.tp-pc::before{content:"";position:absolute;right:19px;top:100%;height:14px;margin-top:1px;border-left:2px var(--trs,solid) var(--trc,var(--trunk))}
.tp-inet{grid-column:2;grid-row:1;position:relative}
.tp-inet::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px var(--ls) var(--lc);transform:translateY(-1px)}
.tp-cloud{grid-column:3;grid-row:1}
.tp-lh{grid-column:1;grid-row:2}
.tp-wifi{grid-column:1;grid-row:2;position:relative;align-self:start;height:0;pointer-events:none}
.tp-wifi::before{content:"";position:absolute;left:30%;bottom:0;height:29px;border-left:2px var(--ls) var(--lc)}
.tp-inet>span,.tp-wifi>span{position:absolute;height:18px;padding:0 6px;border-radius:5px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;font-weight:600;color:var(--ink-3);white-space:nowrap;line-height:18px}
.tp-inet>span{left:50%;bottom:calc(50% + 5px);transform:translateX(-50%)}
.tp-wifi>span{left:calc(30% + 8px);bottom:5px}
.tp-usb{grid-column:1/-1;grid-row:2;align-self:stretch;margin:-14px var(--tx) 0 calc(40% - 21px);border-top:2px var(--trs,solid) var(--trc,var(--trunk));border-right:2px var(--trs,solid) var(--trc,var(--trunk));border-top-right-radius:6px;pointer-events:none}
.tp-top.nousb .tp-usb,.tp-top.nousb .tp-pc::before{display:none}
.tp-leg{grid-column:2/4;grid-row:2;align-self:center;display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 calc(var(--tx) + 12px) 0 16px;font-size:11.5px;color:var(--ink-3)}
.tp-leg span{display:inline-flex;align-items:center;gap:6px}
.tp-leg i{display:inline-block;width:22px;border-top:2px solid var(--ink-3)}
.tp-leg i.dt{border-top-style:dotted}
.tp .meter{display:grid;gap:3px;margin-top:5px}
.tp .meter .bar{position:relative;height:4px;border-radius:2px;background:var(--line)}
.tp .meter .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink-3)}
.tp .meter .bar i.w{background:var(--warn)} .tp .meter .bar i.b{background:var(--bad)}
.tp .meter .bar u{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1.5px solid var(--ink-2)}
.tp .meter.unk .bar{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.tp .meter small{display:flex;justify-content:space-between;gap:6px}
/* 줄기: 왼쪽 = LiveHub 2.4 GHz (셀 · 플러그) · 오른쪽 = USB 데이터 (제어 PC) */
.tp-gap{position:relative;height:16px}
.tp-gap .tl,.tp .gl::before{content:"";position:absolute;left:var(--tx);top:0;bottom:0;border-left:2px var(--tls,solid) var(--tlc,var(--trunk))}
.tp-gap .tr,.tp .gr::before{content:"";position:absolute;right:var(--tx);top:0;bottom:0;border-right:2px var(--trs,solid) var(--trc,var(--trunk))}
.tp-row{display:grid;grid-template-columns:var(--g) minmax(0,1fr) var(--b) minmax(0,1fr) var(--g);align-items:center}
.tp .gl,.tp .gr{position:relative;align-self:stretch}
.tp .gl.no::before,.tp .gr.no::before{display:none}
.tp .gl.end::before{bottom:50%}
.tp .gr.end1::before{bottom:50%}
.tp .gr.end2::before{bottom:calc(6px + var(--chip) / 2 - 1px)}
.tp .gl.tk::after{content:"";position:absolute;left:calc(var(--tx) + 2px);right:0;top:50%;border-top:2px var(--ls) var(--lc);transform:translateY(-1px)}
.tp-row .sn,.tp-row .hb{margin:6px 0}
.tp .sn{padding:8px 11px;gap:9px;align-items:flex-start}
.tp .sn .tic{margin-top:1px}
.tp .sn .ln{display:flex;flex-wrap:wrap;column-gap:4px}
.tp .sn .hr{display:inline-flex;align-items:center;gap:4px}
.tp .sn .hr svg{width:12px;height:12px}
/* 블루투스: 세트 → 보드 묶음 (점선 하나 · 허브가 몇 대든 한 줄) */
.tp .ble{position:relative;align-self:stretch;display:grid;place-items:center}
.tp .ble::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dotted var(--bc);transform:translateY(-1px)}
.tp .ble svg{position:relative;width:16px;height:16px;padding:2px;background:var(--panel);color:var(--bc);border-radius:4px}
.tp .hb{position:relative;display:grid;gap:5px;padding-left:8px}
.tp .hb::before{content:"";position:absolute;left:0;top:calc(var(--chip) / 2 - 1px);bottom:calc(var(--chip) / 2 - 1px);border-left:2px dotted var(--bc)}
.tp .hb.solo::before{display:none}
.tp .hc{position:relative;height:var(--chip);padding:0 9px;gap:7px;border-radius:7px}
.tp .hc::before{content:"";position:absolute;right:100%;width:8px;margin-right:1px;top:50%;border-top:2px dotted var(--bc);transform:translateY(-1px)}
.tp .hc::after{content:"";position:absolute;left:100%;margin-left:1px;width:calc(var(--g) - var(--tx) - 2px);top:50%;border-top:2px var(--ls) var(--lc);transform:translateY(-1px)}
.tp .hc .tic{width:14px;height:14px}
.tp .hc b{font-size:12px;white-space:nowrap}
.tp .hc small{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
/* 전원만 — 오류가 아니라 정상 구성. 꺼진 듯한 바탕(bg) · 실선 · 회색 글자 · USB 꼬리 없음 */
.tp .hc.pw{height:auto;min-height:var(--chip);padding:5px 9px;background:var(--bg);border-color:var(--line-2);align-items:flex-start}
.tp .hc.pw::after{display:none}
.tp .hc.pw .tx{gap:0}
.tp .hc.pw .tic{margin-top:2px;color:var(--ink-3)}
.tp .hc.pw small{white-space:normal;margin-left:0}
.tp .nohr{font-size:11.5px;color:var(--ink-3);padding-left:4px;grid-column:3/5}
.tp-emp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0 0 var(--g)}
.tp-emp span.e{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1px dashed var(--line-2);border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-3)}
.tp-emp svg{width:12px;height:12px}
#topoDr .tw{max-height:320px}
/* 좁은 카드(폰 390px 화면이면 카드 안쪽 약 330px) — 창 폭이 아니라 카드 폭으로 가른다(관제 두 단 ops2 에서 카드 폭은 화면 폭과 다르다) */

  .tp-leg{font-size:10.5px;gap:2px 10px;padding:0 calc(var(--tx) + 8px) 0 10px;flex-direction:column} .tp-leg i{width:16px}

/* ── 추이 분석 ── */

/* gauge: 사이클 머리의 세모 = 그 사이클에 셀 IC 재학습 셀이 있다(색이 아니라 모양으로) · 범례의 세모. 이탈(빨강)과 섞이지 않게 주의 계열 — 셀 카드의 표지는 기본 .tag(주의 계열) */

.ct:hover{border-color:var(--line-2)}

.ct .cb{grid-area:c;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line-2);display:grid;place-items:center;color:var(--panel)}
.ct .s{grid-area:s;font-weight:600;font-size:12.5px}
.ct .p{grid-area:p;color:var(--ink-3);font-size:11.5px;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.ct.on{border-color:var(--brand);background:var(--sel)}
.ct.on .cb{background:var(--brand);box-shadow:none}
.ct.s-warn{background:var(--warn-soft);border-color:var(--warn-z)}
.ct.s-warn .p b{color:var(--warn)}
.ct.s-bad{background:var(--bad-soft);border-color:var(--bad-z)}
.ct.s-bad .p b{color:var(--bad)}
.ct.on.s-warn,.ct.on.s-bad{border-color:var(--brand)}
.prog{display:grid;gap:6px}
.prog .pb{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--brand);border-radius:2px;transition:width .2s linear}
.prog.fail .pb i{background:var(--bad)}
.prog .pl{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px}
.chk{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px}
.chk li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chk li:last-child{border-bottom:0}
.chk .si{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-3)}
.chk li.ok .si{background:var(--brand-soft);box-shadow:none;color:var(--brand)}
.chk li.bad .si{background:var(--bad-soft);box-shadow:none;color:var(--bad)}
.chk li.warn .si{background:var(--warn-soft);box-shadow:none;color:var(--warn)}
.chk li.run .si{box-shadow:none;color:var(--brand)}
.chk li.wait{color:var(--ink-3)}
.chk b{font-weight:600}
.chk .cv{font-weight:600;text-align:right;color:var(--ink-2);font-size:12.5px;overflow-wrap:anywhere}
.chk li.bad .cv{color:var(--bad)}
.chk .td{grid-column:2/-1;font-size:12.5px;background:var(--warn-soft);border-radius:6px;padding:5px 9px}
@media (prefers-reduced-motion:no-preference){.chk li.run .si svg{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.res{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:var(--soft);border:1px solid var(--z)}
.res .ri{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-solid);flex:none}
.res b{font-size:15px}
.res .rs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pinrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* 좁은 화면: 내비는 위로 한 줄 */

  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}

/* 더한 토큰 — FIFA EPTS 보고서의 다섯 등급 색띠(레일 시험 그림 3 배경에만 쓴다). 기존 색 묶음은 넷(초록 · 파랑 · 노랑 · 빨강)이라 다섯 칸을 가를 수 없어 더했다. 기존 토큰 값은 그대로 */
:root{--g1:#C9EBD6; --g2:#CDEEF1; --g3:#F6E8B4; --g4:#F5D3BB; --g5:#EEC2BF}
:root[data-theme="dark"]{--g1:#1C3B2B; --g2:#173A3F; --g3:#3B3419; --g4:#422E1E; --g5:#472524}
/* ── 레일 시험 (목록 · 결과 · 비교) — 확정 시안 rail-design/results.html(2026-10-29)을 옮겼다 ──
   모든 규칙은 .rail(레일 화면의 뿌리) 아래로 좁혔다 — 기존 화면에 새지 않게. 기존 토큰 값은 바꾸지 않았고, 더한 토큰은 FIFA 다섯 등급 색 --g1~--g5 뿐.
   셸 쪽 이름과 겹치는 시안 클래스는 바꿔 달았다: fig→rfig · lgd→rlgd · dot→cd · rng→rrg · fl.row→fl.frow · tr.g→tr.grp(셸의 .fig · .lgd · .dot · .rng · .row · .g 가 전역이라) */
.rail{display:grid;gap:16px;min-width:0;align-content:start}
.rail select{font:inherit;color:inherit}
.rail .card-h{min-height:48px}
.rail .card-h .fn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-3)}
.rail .tbl th,.rail .tbl td{vertical-align:middle}
.rail .empty{padding:32px}
.rail .s-d1{--c:var(--d1);--z:var(--d1-z);--soft:var(--d1-z)}
/* 사각 상태 표지(lozenge) — Jira 처럼 3px 모서리 */
.rail .lz{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:3px;font-size:11.5px;font-weight:700;line-height:1;white-space:nowrap;background:var(--z,var(--line));color:color-mix(in srgb,var(--c,var(--ink-3)) 72%,var(--ink));vertical-align:middle}
.rail .lz.sm{height:18px;padding:0 5px;font-size:11px}
.rail .lz.bold{background:var(--c);color:var(--on-solid)}
.rail .lz.ol{background:none;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2)}
.rail .cs{font-size:10.5px;font-weight:700;color:var(--ink-3)} .rail .cs.s-warn{color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.rail .sel{height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);padding:0 8px;font-size:12.5px;font-weight:600;max-width:100%}
/* 세부 정보 필드 — Jira 의 '라벨 : 값' */
.rail .fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 24px;margin:0}
.rail .fl>div{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.rail .fl dt{color:var(--ink-3);font-size:11.5px;white-space:nowrap} .rail .fl dt .k{font-family:var(--mono);font-size:10.5px;margin-left:4px;opacity:.85}
.rail .fl dd{margin:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .fl dd.unk{color:var(--ink-3);font-weight:500}
.rail .fl.frow{grid-template-columns:repeat(6,minmax(0,1fr))}
.rail .fl.frow>div{border-bottom:0;padding:0 0 0 12px;border-left:1px solid var(--line)} .rail .fl.frow>div:first-child{border-left:0;padding-left:0}
.rail .fl.kv2{grid-template-columns:1fr}
.rail .fl.kv2>div{grid-template-columns:120px minmax(0,1fr);align-items:center;gap:12px;padding:7px 0}
.rail details.all>summary{cursor:pointer;list-style:none;font-size:12px;font-weight:600;color:var(--ink-3);display:inline-flex;gap:6px;align-items:center;margin-top:12px}
.rail details.all>summary::-webkit-details-marker{display:none}
.rail details.all>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg)}
.rail details.all[open]>summary::before{transform:rotate(45deg)}
.rail details.all .fl{margin-top:8px}
/* 알림 줄 — Jira 의 section message, 3px 왼쪽 띠 (바탕 --soft 는 셸의 상태 색 묶음이 준다) */
.rail .smsg{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:3px;background:var(--soft,var(--bg));border-left:3px solid var(--c,var(--ink-3));font-size:12.5px}
.rail .smsg b{color:color-mix(in srgb,var(--c) 80%,var(--ink));white-space:nowrap}
.rail .msgs{display:grid;gap:8px}
/* 목록 — 판정 누적 막대 */
.rail .vb{display:flex;width:96px;height:8px;border-radius:2px;overflow:hidden;background:var(--line)}
.rail .vb i{display:block;height:100%}
.rail .vb .ok{background:var(--ok)} .rail .vb .bad{background:var(--bad)} .rail .vb .d1{background:var(--d1)} .rail .vb .unk{background:var(--unk)}
.rail #lst th,.rail #lst td{padding:8px 8px}
.rail #lst th:first-child,.rail #lst td:first-child{padding-left:14px}
.rail .tbl td.cnt{text-align:right;font-family:var(--mono);font-weight:600;width:1%}
.rail .tbl td.cnt.z{color:var(--line-2);font-weight:400}
.rail .tbl th.sq::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:0}
.rail .tbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--ink);margin:0;vertical-align:middle}
.rail .tbl td.unsup{white-space:normal}
/* 결과 화면 배치 */
.rail .r2{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.rail .r3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.rail .rfig{padding:12px 16px 4px}
.rail .rfig svg{display:block;width:100%}
.rail .rlgd{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:8px 16px 14px;color:var(--ink-3);font-size:11.5px}
.rail .rlgd span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rail .rlgd i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c,var(--line-2))}
.rail .rlgd i.ho{background:none;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.rail .rlgd i.dsh{background:none;border:1.5px dashed var(--d1)}
.rail .rlgd i.sw{width:14px;height:10px;border-radius:0}
.rail .rlgd .hint{margin-left:auto}
/* 그림 1 · 5 — 독 4 × 6 */
.rail .dk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:14px 16px 6px}
.rail .dt{position:relative;display:grid;gap:1px;align-content:center;min-height:46px;padding:5px 8px 5px 11px;border-radius:3px;border:1px solid var(--line);background:var(--panel);text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.rail .dt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:3px 0 0 3px;background:var(--c,var(--line-2))}
.rail .dt:hover{border-color:var(--line-2)}
.rail .dt b{font-family:var(--mono);font-size:12px;font-weight:700}
.rail .dt span{font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--c,var(--ink-3)) 75%,var(--ink))}
.rail .dt.s-bad{background:var(--bad-z);border-color:var(--bad)} .rail .dt.s-d1{background:var(--d1-z);border:1px dashed var(--d1)} .rail .dt.s-idle{background:var(--unk-z)}
.rail .dt.s-idle b,.rail .dt.s-idle span{color:var(--ink-3)}
.rail .dt .rv{position:absolute;right:6px;top:5px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.rail .dt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand)}
.rail .dt.mm{border:1.5px solid var(--ink)}
.rail .dt .ab{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px}
.rail .dt .ab i{height:6px;border-radius:1px;background:var(--c)}
.rail .dt.cmp::before{display:none} .rail .dt.cmp{padding-left:8px;cursor:default}
/* 그림 2 — 셀 × 항목 판정표 */
.rail .mx{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
.rail .mx th,.rail .mx td{padding:0 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;height:30px}
.rail .mx thead th{font-size:11.5px;font-weight:600;color:var(--ink-2);vertical-align:bottom;padding:6px 4px;height:auto;background:var(--panel)}
.rail .mx thead tr.grp th{font-size:11px;color:var(--ink-3);border-bottom:2px solid var(--line-2);text-align:left;padding:8px 8px 4px}
.rail .mx thead tr.it th{white-space:normal;line-height:1.25;min-width:58px;max-width:86px}
.rail .mx thead tr.it th .k{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:500;margin-top:2px}
.rail .mx thead tr.cr th{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-3);border-bottom:2px solid var(--line-2);vertical-align:top;white-space:normal;line-height:1.3}
.rail .mx thead tr.cr th .cs{display:block;font-family:var(--font)}
.rail .mx th.rh,.rail .mx td.rh{text-align:left;padding-left:16px;position:sticky;left:0;background:var(--panel);z-index:1;width:72px;min-width:72px;max-width:72px}
.rail .mx td.rh{font-family:var(--mono);font-weight:600}
.rail .mx td.vd{text-align:left;padding-right:12px;width:64px;min-width:64px;position:sticky;left:72px;background:var(--panel);z-index:1;border-right:1px solid var(--line)}
.rail .mx th.vd{position:sticky;left:72px;background:var(--panel);z-index:1;border-right:1px solid var(--line)}
.rail .mx .gs{border-left:1px solid var(--line-2)}
.rail .mx tbody tr{cursor:pointer} .rail .mx tbody tr:hover td{background:var(--hover)}
.rail .mx tbody tr[aria-selected="true"] td{background:var(--sel)}
.rail .mx tbody tr[aria-selected="true"] td.rh{box-shadow:inset 3px 0 0 var(--brand)}
.rail .mk{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:middle;background:var(--c)}
.rail .mk.ho{background:none;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.rail .mk.hold{background:none;border:1.5px dashed var(--d1)}
.rail .mx .z{font-family:var(--mono);font-size:10.5px;font-weight:700;color:color-mix(in srgb,var(--warn) 80%,var(--ink));margin-left:4px}
.rail .mx .v{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.rail .mx .v.w{color:color-mix(in srgb,var(--warn) 80%,var(--ink));font-weight:700}
.rail .mx .v.b{color:var(--bad);font-weight:700}
.rail .mx .na{color:var(--line-2)}
.rail .mx .unkv{font-size:11px;color:var(--ink-3)}
.rail .mx.inv .mk{--c:var(--unk)!important}
.rail .mx.inv .v{color:var(--ink-3)!important}
/* 그림 3 · 4 · 6 (svg) */
.rail svg text.t{font-size:11.5px;fill:var(--ink-2);font-weight:600} .rail svg text.u{font-size:10.5px;fill:var(--ink-3)}
.rail svg text.yl{font-size:11.5px;fill:var(--ink-2);font-family:var(--mono)}
.rail svg .g1{fill:var(--g1)} .rail svg .g2{fill:var(--g2)} .rail svg .g3{fill:var(--g3)} .rail svg .g4{fill:var(--g4)} .rail svg .g5{fill:var(--g5)} .rail svg .gn{fill:var(--bg)}
.rail svg .cd{fill:var(--ink-2);fill-opacity:.42} .rail svg .cd.sel{fill:var(--brand);fill-opacity:1;stroke:var(--panel);stroke-width:1.5}
.rail svg .med{fill:var(--ink)} .rail svg .rrg{stroke:var(--ink);stroke-width:1.5}
.rail svg .ml{stroke:var(--ink);stroke-width:1.6;fill:none} .rail svg .sl{stroke:var(--brand);stroke-width:1.6;fill:none}
.rail svg .ref{stroke:var(--ink-3);stroke-dasharray:4 3}
.rail svg .acc{fill:var(--ok-z)}
.rail svg .db{stroke:var(--line-2);stroke-width:2} .rail svg .db.chg{stroke:var(--bad)}
.rail svg .da{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.5} .rail svg .dbb{fill:var(--ink-2)} .rail svg .dbb.chg{fill:var(--bad)}
.rail .nofig{display:grid;place-items:center;align-content:center;gap:4px;min-height:180px;color:var(--ink-3);text-align:center;padding:24px}

.railq .hm.cs .tal i{display:block;width:12px;background:var(--bad);border-radius:2px 2px 0 0}
.railq .hm.cs .tal b{font-size:10.5px;color:var(--bad);line-height:1}
.railq .hm.cs .ring{pointer-events:none;border:2px solid var(--ink);border-radius:5px;z-index:2}
.railq .hm.cs .gh{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:10px 10px 2px;position:sticky;left:0;white-space:nowrap;background:var(--panel);z-index:1}
.railq .hm.cs .gh.bad{color:var(--bad)}
.railq .hm.cs .tot{font-family:var(--mono);font-size:11.5px;display:grid;place-items:center end;padding-right:4px;color:var(--ink-3)}
.railq .hm.cs .tot.bad{color:var(--bad);font-weight:700}
/* 셀 서랍 (.insp) */
.railq .insp .ib{gap:16px}
.railq .qdr .chips{display:flex;flex-wrap:wrap;gap:6px}
.railq .qdr .pt{display:grid;gap:10px}
.railq .qdr details.mini>summary{display:flex;justify-content:space-between;gap:8px}
/* 히스토그램 */
.railq .qhp{display:grid;gap:10px;padding:14px 16px 16px}
.railq .qhp .sec-h>span:last-child,.railq .qdr .sec-h>span:last-child{white-space:nowrap}
.railq .qhp+.qhp{border-top:1px solid var(--line)}
.railq .qhg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px 28px}
.railq .qsers{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;align-items:center}
.railq .qsers .k{color:var(--bad);font-weight:700;font-size:11px}

.railq .qqc{display:grid;gap:14px}
.railq .qrow{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.railq .qrow .lab{min-width:64px}
.railq .qdec .btn{min-width:88px}
.railq .qdec .btn[aria-pressed="true"]{border-color:var(--c);background:var(--soft);color:var(--c);box-shadow:0 0 0 3px var(--z)}
.railq .qdec .btn[aria-pressed="true"]:disabled{opacity:1}
.railq .qqc .tbl select.inp{height:28px;font-weight:500;min-width:132px}
.railq .qqc .inp:disabled{opacity:1;background:var(--bg);color:var(--ink-2)}
.railq .qqc .tbl td.n{font-family:var(--mono)}
.railq .qqc .inp.cm{flex:1 1 260px}
.railq .qqc .qerr{color:var(--bad);font-weight:700;font-size:12.5px}
.railq .qqc .qstamp .btn{margin-left:auto}

.railq .qdock{display:grid;grid-template-columns:22px repeat(4,minmax(0,1fr));gap:8px;padding:16px}
.railq .qdock .ax{font-size:11.5px;color:var(--ink-3);font-weight:600;display:grid;place-items:center}
.railq .qdock .cell{cursor:default}
.railq .qdock .cell .sn{font-family:var(--mono)}
.railq .qdock .cell .pc small{font-family:var(--font)}
.railq .qdock .cell .vd{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.railq .qdock .cell.s-bad .vd{color:var(--bad)}
.railq .qdock .cell.void{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 6px)}
.railq .qdock .gap{border:1px dashed var(--line);border-radius:9px}
.railq .tbl .vm{display:inline-flex;align-items:center;gap:6px}
.railq .tbl .vm i{width:10px;height:10px;border-radius:2px;background:var(--c,var(--line-2));display:inline-block}
.railq .tbl td.bad{color:var(--bad);font-weight:700}
.railq .tbl th small{display:block;font-weight:500;color:var(--ink-3);font-size:10.5px}
/* 도움말 서랍 · 가림막 — 화면 밖 body 에 붙인다 */
.railq.qhelp{position:fixed;top:0;right:0;bottom:0;z-index:35;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .18s ease-out;display:grid;gap:0;grid-template-rows:auto minmax(0,1fr)}
.railq.qhelp.open{transform:none}
.railq.qhelp .ih b{font-size:15px}
.railq.qhelp .ih .x{display:grid}
.railq.qhelp .bd{overflow:auto;padding:4px 0 20px}
.railq.qhelp .tbx{grid-template-columns:116px 1fr}
.railq.scrim2{display:none;position:fixed;inset:0;z-index:30;background:var(--scrim)}
.railq.scrim2.open{display:block}
@media (max-width:820px){

  .railq .qhg{grid-template-columns:minmax(0,1fr)}
  .railq .qdock{gap:5px;padding:12px}
  .railq .qdock .cell{padding:7px 7px 8px}
  .railq .qdock .cell .pc{font-size:15px}
}
@media (max-width:560px){.railq .card-h .r{margin-left:0}}

  [[sw,HW],[sb,HB]].forEach(([s,h])=>{s.innerHTML='';s.setAttribute('viewBox',`0 0 ${W} ${h}`);s.setAttribute('width',W);s.setAttribute('height',h);});
  const clip=(s,id,y1,y0)=>{const d=el('defs');const c=el('clipPath',{id});c.appendChild(el('rect',{x:x0,y:y1-3,width:x1-x0,height:y0-y1+6}));d.appendChild(c);
    const pt=el('pattern',{id:id+'h',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'});pt.appendChild(el('line',{x1:0,y1:0,x2:0,y2:6,stroke:'var(--line-2)','stroke-width':2}));d.appendChild(pt);s.appendChild(d);};
  clip(sw,'clipW',pw.top,pw.y0); clip(sb,'clipB',pb.y1,pb.y0);
  const sg=segments(ts,ilo,ihi);
  const line=(s,cp,Y,key,color,wd)=>{const g=el('g',{'clip-path':`url(#${cp})`});sg.forEach(ix=>{const pts=ix.filter(i=>has(rows[i][key])).map(i=>`${X(ts[i]).toFixed(1)},${Y(+rows[i][key]).toFixed(1)}`);
    if(pts.length>1)g.appendChild(el('polyline',{points:pts.join(' '),fill:'none',stroke:color,'stroke-width':wd,'stroke-linejoin':'round','stroke-linecap':'round'}));});s.appendChild(g);};
  if(proj){const xn=X(proj.t0),xe=X(tB);
    sw.appendChild(el('rect',{x:xn,y:pw.top,width:Math.max(0,xe-xn),height:pw.y0-pw.top,fill:'url(#clipWh)',opacity:.7}));
    sb.appendChild(el('rect',{x:xn,y:pb.y1,width:Math.max(0,xe-xn),height:pb.y0-pb.y1,fill:'url(#clipBh)',opacity:.7}));}

  // ① 경계: 이번 사이클 = 단계가 바뀌는 자리, 여러 사이클 = 사이클이 바뀌는 자리
  const marks=[];
  if(!bucket){let prev=null;rows0.forEach((r,i)=>{if(r.phase!==prev&&ts0[i]<=tB){const t=Math.max(ts0[i],tA);if(marks.length&&marks[marks.length-1].t===t)marks.pop();marks.push({t,label:PHK[r.phase]||r.phase,line:ts0[i]>tA,major:true});}prev=r.phase;});}
  else{let prev;rows0.forEach((r,i)=>{const c=has(r.cycle)?+r.cycle:null;if(c!==prev&&c!=null&&ts0[i]<=tB){const t=Math.max(ts0[i],tA);if(marks.length&&marks[marks.length-1].t===t)marks.pop();marks.push({t,c,line:ts0[i]>tA});}prev=c;});
    // 사이클이 많으면 1·2·5·10… 단위로 솎아 번호를 단다 (라벨 하나 폭 + 여백이 들어가는 가장 작은 단위)
    const pxPer=(x1-x0)/Math.max(1,(tB-tA)/(marks.length>2?(marks[marks.length-1].t-marks[1].t)/(marks.length-2):(tB-tA)));
    const maxC=Math.max(...marks.map(m=>m.c)), lw=textW(`${maxC}회`)+10;
    const step=[1,2,5,10,20,25,50,100,200,250,500].find(s=>s*pxPer>=lw)||1000;
    marks.forEach(m=>{m.major=step===1||m.c%step===0;m.label=`${m.c}회`;m.minor=pxPer>=4;});}
  // 라벨은 자기 자리(다음 라벨 경계까지)에 들어갈 때만 단다 — 서로 겹치지 않게
  const lab=marks.filter(m=>m.major);
  lab.forEach((m,k)=>{const xs=X(m.t), xe=k+1<lab.length?X(lab[k+1].t):(proj?X(proj.t0)-20:W+4);m.show=xs+4+textW(m.label)<=xe-4;});
  marks.forEach(m=>{const x=X(m.t);if(x<x0-0.5||x>x1+0.5)return;
    if(m.major){sw.appendChild(el('line',{x1:x,x2:x,y1:2,y2:pw.top-6,class:'rul'}));
      if(m.line){sw.appendChild(el('line',{x1:x,x2:x,y1:pw.top,y2:pw.y0,class:'cyc'}));sb.appendChild(el('line',{x1:x,x2:x,y1:pb.y1,y2:pb.y0,class:'cyc'}));}
      if(m.show)txt(sw,x+4,12,m.label,'m','start');}
    else if(m.minor)sw.appendChild(el('line',{x1:x,x2:x,y1:pw.top-11,y2:pw.top-6,class:'rul'}));});

  // ② 전력: 축은 0~80 W 고정 (충전 시작이 약 68 W) — 넘으면 20 W 단위로 늘린다. 범위를 바꿔도 눈금이 그대로라 비교가 쉽다
  const wTop=Math.max(80,Math.ceil(Math.max(0,...rows.map(r=>has(r.watts)?+r.watts:0))/20)*20), Yw=v=>pw.y0-(pw.y0-pw.top)*v/wTop;
  for(let i=0;i<=4;i++){const v=wTop*i/4;sw.appendChild(el('line',{x1:x0,x2:x1,y1:Yw(v),y2:Yw(v),class:'grid'}));if(i%2===0)txt(sw,x0-6,Yw(v)+4,String(v),'n','end');}
  line(sw,'clipW',Yw,'watts','var(--ink-2)',1.6);
  $('legW').textContent=bucket?`${grpLab} 평균`:'';

  // ③ 잔량: 띠 = 최저~최고 (원본 = 그 순간 셀 24대의 최저~최고, 묶음 = 그 구간 동안의 최저~최고), 선 = 평균
  const Yb=v=>pb.y0-(pb.y0-pb.y1)*Math.max(0,Math.min(100,v))/100, stop=n.stop_pct??30;
  for(const v of [0,25,50,75,100]){sb.appendChild(el('line',{x1:x0,x2:x1,y1:Yb(v),y2:Yb(v),class:'grid'}));if(v%50===0)txt(sb,x0-6,Yb(v)+4,String(v),'n','end');}
  {const g=el('g',{'clip-path':'url(#clipB)'});sg.forEach(ix=>{const k=ix.filter(i=>has(rows[i].batt_min)&&has(rows[i].batt_max));if(k.length<2)return;
    const top=k.map(i=>`${X(ts[i]).toFixed(1)},${Yb(+rows[i].batt_max).toFixed(1)}`), bot=k.slice().reverse().map(i=>`${X(ts[i]).toFixed(1)},${Yb(+rows[i].batt_min).toFixed(1)}`);
    g.appendChild(el('polygon',{points:top.concat(bot).join(' '),class:'band'}));});sb.appendChild(g);}
  sb.appendChild(el('line',{x1:x0,x2:x1,y1:Yb(stop),y2:Yb(stop),stroke:'var(--warn)','stroke-dasharray':'5 4','stroke-width':1.4}));
  txt(sb,proj?x0+4:x1-2,Yb(stop)-5,`기준선 ${stop}`,'m',proj?'start':'end').setAttribute('style','fill:var(--warn)');   // 예상선 끝점(오른쪽)과 겹치지 않게
  line(sb,'clipB',Yb,'batt_avg','var(--d1)',bucket?1.5:1.9);
  if(proj){const xn=X(proj.t0), xb=X(proj.t1);
    sb.appendChild(el('line',{x1:xn,y1:Yb(proj.v0),x2:xb,y2:Yb(stop),stroke:'var(--warn)','stroke-width':1.6,'stroke-dasharray':'3 3'}));
    sb.appendChild(el('circle',{cx:xb,cy:Yb(stop),r:4,fill:'var(--panel)',stroke:'var(--warn)','stroke-width':2}));
    txt(sb,Math.min(xb,x1-24),Yb(stop)+17,`≈ ${hm(proj.t1)}`,'m','middle').setAttribute('style','fill:var(--warn);font-weight:700');
    [sw,sb].forEach((s,j)=>s.appendChild(el('line',{x1:xn,x2:xn,y1:j?pb.y1:pw.top-4,y2:j?pb.y0:pw.y0,stroke:'var(--ink)','stroke-width':1.1})));
    txt(sw,xn,pw.top-8,'지금','m','middle').setAttribute('style','fill:var(--ink);font-weight:700');}
  // ④ 방전 종료 표지 (여러 사이클 범위만): 사이클 기록의 실제 바닥 — 묶음 간격과 무관하게 읽힌다. 점 = 종료 때 24셀 최저, 위로 뻗은 짧은 선 = 셀별 종료 중앙값
  const floors=bucket?dischargeFloors(S.cycles,S.dis).filter(f=>f.t>=tA&&f.t<=tB):[];
  if(floors.length){const g=el('g',{class:'flo'});floors.forEach(f=>{const x=X(f.t), y=Yb(f.min);
    if(f.med!=null&&f.med>f.min)g.appendChild(el('line',{x1:x,x2:x,y1:Yb(f.med),y2:y,stroke:'var(--warn)','stroke-width':1.6}));
    const c=el('circle',{cx:x,cy:y,r:3.6,fill:'var(--warn)',stroke:'var(--panel)','stroke-width':1.5});
    c.appendChild(el('title',null,`사이클 ${f.cycle} 방전 종료 ${wide?dhm(f.t):hm(f.t)} · 최저 ${f.min} %${f.med!=null?` · 중앙값 ${f.med} %`:''}`));g.appendChild(c);});sb.appendChild(g);}
  $('legB').innerHTML=`<span style="--c:var(--ink-2)"><i></i>전력</span><span style="--c:var(--d1)"><i></i>${bucket?`잔량 · ${grpLab} 평균`:'잔량 평균'}</span><span><i class="band"></i>${bucket?`${grpLab} 안`:'셀'} 최저~최고</span>${bucket?`<span><i class="flo"></i>방전 종료 최저 · 중앙값${floors.length?'':' (사이클 기록 없음)'}</span>`:''}<span><i class="dash"></i>기준선 ${stop} %</span>${proj?'<span><i class="fut"></i>예상</span>':''}<span class="hint">${HINT}</span>`;
  // 시각 축 (아래 그래프에만 — 두 그래프가 같은 시각을 공유한다)
  let tkEnd=-1e9; timeTicks(tA,tB,x1-x0).forEach(([t,s])=>{const x=X(t),w=textW(s);if(x-w/2<2||x+w/2>W-2||x-w/2<tkEnd+8)return;tkEnd=x+w/2;sb.appendChild(el('line',{x1:x,x2:x,y1:pb.y0,y2:pb.y0+4,class:'axis'}));txt(sb,x,pb.y0+17,s,'n tk').dataset.w=w;});

  // 범위 설명 한 줄
  const f=wide?dhm:hm, tEnd=Z?tB:tEndRaw;
  const nc=new Set(rows0.filter((r,i)=>ts0[i]>=tA&&ts0[i]<=tB).map(r=>r.cycle).filter(has).map(Number)).size, wh=+rows[rows.length-1].wh||0;
  $('chartNote').textContent=bucket?`${f(tA)} ~ ${f(tEnd)} · ${nc}사이클 · ${grpLab} 평균${bs!==bs0?' (화면에 맞춤)':''}`
    :`${f(tA)} ~ ${f(tEnd)} · 사이클 ${rows[lo].cycle??n.cycle??'-'} · 원본 표본${wh>0&&!Z?` · 충전 누적 ${wh.toFixed(1)} Wh`:''}`;
  G={rows,ts,lo,hi,X,tA,tB,x0,x1,W,pw,pb,Yw,Yb,bucket,wide,bs,grpLab,floors,
    near:t=>{let a=lo,b=hi;while(b-a>1){const m=(a+b)>>1;if(ts[m]<t)a=m;else b=m;}return Math.abs(ts[a]-t)<=Math.abs(ts[b]-t)?a:b;}};
  if(PT!=null&&(PT<tA||PT>tB))PT=null;
  drawXH();
}
// 값 읽기: 두 그래프에 같은 세로 기준선, 아래 축에 시각 표, 위 줄에 그 시각의 값. 아무것도 가리키지 않으면 마지막 표본
function renderReadout(){
  const box=$('readout');if(!box)return;
  if(!G){box.innerHTML='';return;}
  const t=HOV??PT, i=t==null?G.hi:G.near(t), r=G.rows[i], s=G.ts[i], f=G.wide?dhm:hm;
  const when=G.bucket?`${f(s)}–${G.bs>=86400?dhm(s+G.bs):hm(s+G.bs)}`:hms(s), live=t==null&&R==='cycle'&&!Z&&engineStat().cls==='ok';
  box.innerHTML=`<span class="tm">${when}</span>${t==null?`<span class="${live?'now':''}">${live?'지금':'마지막'}</span>`:''}<span>${has(r.cycle)?`${+r.cycle}회 · `:''}${G.bucket?G.grpLab:esc(PHK[r.phase]||r.phase||'-')}</span>`
    +`<span>전력<b>${has(r.watts)?(+r.watts).toFixed(1):'-'} W</b></span>`
    +`<span>잔량 평균<b>${has(r.batt_avg)?Math.round(+r.batt_avg):'-'} %</b></span>`
    +`<span>${G.bucket?'구간':'셀'} 최저~최고<b>${has(r.batt_min)?+r.batt_min:'-'}–${has(r.batt_max)?+r.batt_max:'-'} %</b></span>`
    +(G.bucket?G.floors.filter(q=>G.near(q.t)===i).map(q=>`<span>방전 종료 ${f(q.t)}<b>최저 ${q.min} %${q.med!=null?` · 중앙값 ${q.med} %`:''}</b></span>`).join(''):'')
    +(PT!=null&&HOV==null?'<button type="button" class="btn sm" id="readClear" aria-label="값 읽기 해제">해제</button>':'');
}
function drawXH(){
  document.querySelectorAll('#chartW .xh,#chartB .xh').forEach(g=>g.remove());
  document.querySelectorAll('#chartB text.tk').forEach(tk=>tk.style.visibility='');
  renderReadout();
  const t=HOV??PT; if(!G||t==null)return;
  const i=G.near(t), r=G.rows[i], x=G.X(G.ts[i]), gw=el('g',{class:'xh'}), gb=el('g',{class:'xh'});
  gw.appendChild(el('line',{x1:x,x2:x,y1:G.pw.top,y2:G.pw.y0}));
  if(has(r.watts))gw.appendChild(el('circle',{cx:x,cy:G.Yw(+r.watts),r:4,fill:'var(--ink-2)',stroke:'var(--panel)','stroke-width':2}));
  gb.appendChild(el('line',{x1:x,x2:x,y1:G.pb.y1,y2:G.pb.y0}));
  if(has(r.batt_avg))gb.appendChild(el('circle',{cx:x,cy:G.Yb(+r.batt_avg),r:4,fill:'var(--d1)',stroke:'var(--panel)','stroke-width':2}));
  const s=G.wide?dhm(G.ts[i]):hm(G.ts[i]), w=textW(s)+12, cx=Math.min(Math.max(x,G.x0+w/2-6),G.W-w/2-1);
  gb.appendChild(el('rect',{x:cx-w/2,y:G.pb.y0+4,width:w,height:18,rx:4,fill:'var(--ink)'}));
  gb.appendChild(el('text',{x:cx,y:G.pb.y0+17,'text-anchor':'middle',class:'n',style:'fill:var(--panel)'},s));
  $('chartB').querySelectorAll('text.tk').forEach(tk=>{tk.style.visibility=Math.abs(+tk.getAttribute('x')-cx)<w/2+(+tk.dataset.w)/2+4?'hidden':'';});
  $('chartW').appendChild(gw); $('chartB').appendChild(gb);
}
// 조작: 가로로 끌면 확대(두 그래프에 같은 선택 구간), 누르면 값 고정, 마우스는 올리기만 해도 값. 세로로 끌면 페이지가 스크롤된다(touch-action:pan-y)
function bindChart(svg){
  let sx=null, sel=[];
  const vx=cx=>{const bb=svg.getBoundingClientRect();return (cx-bb.left)/bb.width*G.W;};
  const toT=px=>G.tA+(G.tB-G.tA)*(Math.min(G.x1,Math.max(G.x0,px))-G.x0)/(G.x1-G.x0);
  const clearSel=()=>{sel.forEach(r=>r.remove());sel=[];};
  svg.addEventListener('pointerdown',e=>{if(!G||e.button>0)return;sx=e.clientX;try{svg.setPointerCapture(e.pointerId);}catch(_){}});
  svg.addEventListener('pointermove',e=>{if(!G)return;
    if(sx==null){if(e.pointerType==='mouse'){const t=G.ts[G.near(toT(vx(e.clientX)))];if(t!==HOV){HOV=t;drawXH();}}return;}
    if(Math.abs(e.clientX-sx)<8&&!sel.length)return;
    if(!sel.length){HOV=null;drawXH();sel=[$('chartW'),$('chartB')].map(s=>s.appendChild(el('rect',{class:'zsel',y:0,height:'100%'})));}
    const a=Math.max(G.x0,Math.min(vx(sx),vx(e.clientX))), b=Math.min(G.x1,Math.max(vx(sx),vx(e.clientX)));
    sel.forEach(r=>{r.setAttribute('x',a);r.setAttribute('width',Math.max(0,b-a));});});
  svg.addEventListener('pointerup',e=>{if(sx==null||!G)return;const moved=sel.length>0;const a=toT(vx(Math.min(sx,e.clientX))),b=toT(vx(Math.max(sx,e.clientX)));sx=null;clearSel();
    if(moved){if(G.ts.filter(t=>t>=a&&t<=b).length>=3){Z=[a,b];PT=null;HOV=null;renderCharts();}}
    else{const t=G.ts[G.near(a)];PT=PT===t?null:t;drawXH();}});
  svg.addEventListener('pointercancel',()=>{sx=null;clearSel();});
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&sx==null&&HOV!=null){HOV=null;drawXH();}});
  svg.addEventListener('dblclick',()=>{if(Z){Z=null;PT=null;renderCharts();}});
}
function bindChartUI(){
  bindChart($('chartW')); bindChart($('chartB'));
  $('fig').addEventListener('keydown',e=>{if(!G)return;const k=e.key;
    if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();const d=(k==='ArrowLeft'?-1:1)*(e.shiftKey?10:1);const i=PT==null?G.hi:Math.min(G.hi,Math.max(G.lo,G.near(PT)+d));PT=G.ts[i];HOV=null;drawXH();}
    else if(k==='Home'||k==='End'){e.preventDefault();PT=G.ts[k==='Home'?G.lo:G.hi];HOV=null;drawXH();}
    else if(k==='Escape'){if(PT!=null){e.stopPropagation();PT=null;drawXH();}else if(Z){e.stopPropagation();Z=null;renderCharts();}}});
  $('readout').addEventListener('click',e=>{if(e.target.closest('#readClear')){PT=null;drawXH();$('fig').focus();}});
  $('zoomReset').onclick=()=>{Z=null;PT=null;renderCharts();$('fig').focus();};
  document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{
    if(b.dataset.r===R&&!Z)return;
    R=b.dataset.r;Z=null;PT=null;HOV=null;store('range',R);
    document.querySelectorAll('#range button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    if(S.range!==R){$('fig').classList.add('loading');$('chartNote').textContent=`${RLABEL[R]} 불러오는 중…`;}
    refresh();});
}
// ───── 3. 추이 분석 ─────
// <trend-base> 추이 기준값 — 첫 사이클 기준은 안정화 구간 때문에 결론이 뒤집히고, 사이클 간 흔들림(1.8~2.6 %)이 보려는 변화(노화 ~2.5 %)와 같은 크기라 한 사이클끼리
// 비교하지 않는다. 안정화 구간은 눈대중(1~3)이 아니라 세트마다 데이터로 정한다 — 배터리 IC(연료 게이지)가 용량을 학습하는 속도가 세트마다 달라서다(실데이터: 세트 2 는 3회, 세트 1 은 5회).
//  A. 지수 수렴 적합(주 규칙) — 사이클 1~15 중 거르기를 통과한 (사이클, 셀 평균 est) 점에 y = y∞ − A·exp(−n/τ) 를 맞춘다(τ 0.5~8.0 격자, 각 τ 에서 y∞·A 는 선형 최소제곱).
//     안정화 끝 = 점근값의 1 % 안에 처음 드는 사이클 ceil(−τ·ln(0.01·y∞/A)). A ≤ 0 이면 안정화 없음(1). 유효 점 4개 미만이면 옛 규칙(1~3 제외).
//  B. 정착 판정(보조) — 그 값이 '그 뒤 유효 10회 평균 ±2σ(σ 최소 1 %)' 안에 3회 연속 드는 첫 사이클(후보는 사이클 1~15). A 와 2회 넘게 다르면 둘 중 늦은(큰) 쪽을 n₁ 로 쓴다
//     — 적합은 점 하나에 흔들릴 수 있어서다(QA: 사이클 15 기록 하나를 빼면 n₁ 6 → 9). B 를 정하려면 뒤 기록이 필요하므로, B 가 정해지기 전에는 n₁ 을 확정하지 않는다.
//     이렇게 해야 n₁ 이 한번 정해진 뒤에는 어떤 기록이 늘어도 바뀌지 않는다(기준 고정).

const names=arr=>{const a=arr.filter(e=>e!=='avg'),hasAvg=arr.includes('avg');const p=[];if(hasAvg)p.push('평균');if(a.length)p.push(a.length<=3?a.map(s=>'셀 '+s).join(', '):`셀 ${a[0]} 외 ${a.length-1}대`);return p.join(' · ');};

// A. 지수 수렴 적합 — 점 [{c,v}] 에 y = y∞ − A·exp(−c/τ). τ 는 격자 탐색, 각 τ 에서 (y∞, A) 는 선형 최소제곱의 닫힌 해

  if(last<W)return S;

  else{const f=tbFit(pts);Object.assign(S,{tau:f.tau,yinf:f.yinf,A:f.A});

}
// C. 충전 Wh/%p — 사이클 기록의 charge_wh ÷ (100 − 방전 종료 %). 정상 범위 = 거르기 통과 사이클 10~30 의 평균 ±2σ(σ 최소 1 %) — 표본 8개부터.
// 표지(충전량 이상 — IC 재학습 의심) = 2회 연속 벗어난 사이클부터. 안정화 구간(n₁ 전)과 n₁ 미확정일 때는 표지를 내지 않는다. 기준 · 판정에는 쓰지 않는다

function pickCycles(D,C,ic){   // 세트 단위로 한 번 — 셀별 기준도 같은 사이클들에서 잰다. ic = <gauge> 의 IC 측정 {n1,stable,t,row} (없으면 곡선 추정만)
  const lo=new Map(), note=new Map(), sum=new Map(), when=new Map();
  D.forEach(r=>{const c=+r.cycle,p=tbNum(r.start_pct),v=tbNum(r.est_runtime_h);if(p!=null)lo.set(c,lo.has(c)?Math.min(lo.get(c),p):p);
    if(v!=null){const s=sum.get(c)||{t:0,n:0};s.t+=v;s.n++;sum.set(c,s);}});

    if(r.judged)ents.forEach(e=>{const v=vOf(e,c);if(v==null||ref[e]==null)return;
      if(v<ref[e]*0.95){r.out.push(e);run[e]=(run[e]||0)+1;if(run[e]>=3){run[e]=0;warns[e]=(warns[e]||0)+1;(warns[e]>=2?r.inspect:r.caution).push(e);}}else run[e]=0;});

  if(!P.ready){const w=P.n1==null?P.ok:P.okJ;vd.forEach(r=>{if(w.includes(r.c))r.status='wait';});}   // 기준 후보 — '제외'가 아니라 '대기'

function tbBadge(M,c){   // 셀 배지의 근거 — 정상 · 범위 밖은 판정을 거친 마지막 한 사이클, 주의 · 점검은 그 판정이 난 사이클, 대기는 그 이유

      ['cloud','외부','유선 인터넷 · Slack 알림 · 클라우드','원격 접속 Tailscale · PIN (제어 PC 결과판) · 로그인 (클라우드 결과판)']];
    const SRC=[['배터리 잔량','셀 라이브 UDP 60222 · 바이트 52 · 0.5초 주기'],['심박','셀 라이브 바이트 51 (심박대 연결 시)'],['플러그 전력','Tapo P110M · 20초 주기 · 수 초 지연'],
      ['방전 시간','플러그 OFF → 첫 셀 기준선 도달'],['추정 작동시간','방전 시간 동안 셀별 하락 % → 100 % → 기준선 환산 (discharge_####.csv)'],

    return `<div class="ph"><h1 tabindex="-1">절차 · 기준</h1><span class="sub">${cs?`사이클 1회 ≈ ${dur(cs.s)} · 최근 ${cs.n}회 평균`:'사이클 1회 · 기록 없음'}</span></div>
    <section class="card" aria-label="사이클 흐름">
      <div class="card-h"><h2>사이클 흐름</h2><div class="r"><span class="chip">${I('repeat',13)}자동 반복</span></div></div>
      <ol class="flow" style="list-style:none;margin:0">${FLOW.map(([ic,t,c])=>`<li class="fs"><span class="fn">${I(ic,20)}</span><b>${t}</b><span class="cs">${c.map(x=>`<span class="chip">${x}</span>`).join('')}</span></li>`).join('')}</ol>
      <div class="plugband" aria-label="플러그 상태"><span class="off" style="grid-column:span 2">${I('plug',13)}플러그 OFF</span><span class="on" style="grid-column:span 3">${I('zap',13)}플러그 ON</span><span class="off">OFF</span></div>
      <div class="loop"><i></i><span>${I('repeat',13)} 반복 · 정지 상태는 항상 충전 쪽(플러그 ON)</span><i></i></div>
    </section>
    <section class="nums" aria-label="수치 기준">${NUMS.map(([ic,l,v2,u,d,tg])=>`<div class="num"><span class="l">${I(ic,15)}${l}${tg?'<span class="tag">가안</span>':''}</span><b>${v2}${u?`<small>${u}</small>`:''}</b><span class="d">${d}</span></div>`).join('')}</section>
    <div class="proc3">
      <section class="card" aria-label="이상 대응">
        <div class="card-h"><h2>이상 대응</h2><div class="r"><span class="muted sm">PC 알림은 빨강 · 신호 없음을 확인 전까지 15분마다</span></div></div>
        <div class="esc"><div class="eh"><span>${I('alert',13)}발생</span><span></span><span>${I('bot',13)}자동 조치</span><span></span><span>${I('user',13)}실패 시</span></div>
          ${ESC.map(r=>`<div class="er">${eb('ev',r.e)}${I('arrow',14)}${eb('au',r.a)}${I('arrow',14)}${eb('hu',r.h)}</div>`).join('')}</div>
      </section>
      <div class="side-stack">
        <section class="card" aria-label="판정 규칙">
          <div class="card-h"><h2>판정 규칙</h2><span class="tag">가안</span><div class="r"><span class="muted sm">셀마다 · 기준(안정화 뒤 10회 평균) 대비</span></div></div>
          <div class="rules">
            <div class="rc"><span class="mini"><i class="o"></i><i></i><i class="b"></i></span><b>이탈</b><small>−5 % 밖</small></div>${I('chev',14)}
            <div class="rc"><span class="mini"><i class="b"></i><i class="b"></i><i class="b"></i></span><b style="color:var(--bad)">주의</b><small>3사이클 연속</small></div>${I('chev',14)}
            <div class="rc"><span class="mini" style="gap:5px"><span class="badge s-bad" style="height:16px;padding:0 5px;font-size:10px">주의</span><span class="badge s-bad" style="height:16px;padding:0 5px;font-size:10px">주의</span></span><b style="color:var(--bad)">점검</b><small>주의 2회</small></div>
          </div>
          <div class="rsub">${I('flag',13)}<span>사이클이 끝날 때마다 셀별 작동시간을 기준과 비교한다. 기준은 안정화 구간을 뺀 뒤, 방전 시작이 98 % 이상이고 비고가 없는 사이클을 앞에서부터 10회 골라 평균한 값이다. 안정화 구간은 세트마다 데이터로 정한다 — 사이클 1~15 의 평균 작동시간이 최종값의 1 % 안에 들어온 사이클부터를 안정화 뒤로 본다지수 곡선 적합으로 찾고, 보조 판정과 2사이클 넘게 다르면 늦은 쪽을 쓴다. 로컬 결과판에서 셀 IC 학습 용량 측정이 있으면 그것을 먼저 쓰되, 기준이 정해진 뒤 들어온 측정은 기준을 바꾸지 않는다. 기준은 한번 정해지면 다시 바뀌지 않는다. 사이클 15까지 기록이 모이고, 보조 판정에 필요한 뒤 기록이 몇 회 더 쌓이면 정해진다. 변화율의 + 는 최근 10회의 작동시간이 기준보다 길다는 뜻, − 는 짧다는 뜻이다. 10회가 모이기 전에는 판정하지 않는다. 충전 Wh/%p 가 정상 범위를 2회 연속 벗어난 사이클에는 '충전량 이상(IC 재학습 의심)' 표지만 붙이고 판정에서 빼지는 않는다. 1~2회 미달은 관찰로 두고, 점검이 뜨면 사람이 판단한다.</span></div>
        </section>
        <section class="card" aria-label="원격 명령">
          <div class="card-h"><h2>원격 명령</h2><div class="r"><span class="chip">${I(cl?'lock':'key',12)}${cl?'로그인 필요':'PIN 필요'}</span></div></div>
          <div class="tw"><table class="cmd"><thead><tr><th></th><th><span>${I('battery',13)}방전 중</span></th><th><span>${I('batChg',13)}충전 중</span></th></tr></thead>
            <tbody>${CMD.map(c=>`<tr class="${c.dg?'dg':''}"><th><span>${I(c.ic,15)}${c.t}</span></th>${[c.d,c.c].map(x=>x?`<td>${x}</td>`:`<td class="no"><span>${I('minus',12)}변화 없음</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="route">${ROUTE.map(([ic,t],i)=>`${i?I('chev',12):''}<span class="chip sm">${I(ic,12)}${t}</span>`).join('')}</div>

        <div class="tw"><table class="tbl"><thead><tr><th>장비</th><th>역할</th><th>연결 · 주의</th></tr></thead><tbody>${DEV.map(([ic,k,r,c])=>`<tr><td><span style="display:inline-flex;gap:8px;align-items:center;font-weight:600">${I(ic,15)}${k}</span></td><td class="t">${r}</td><td class="t">${c}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="card" aria-label="데이터 출처"><div class="card-h"><h2>데이터 출처</h2></div>
        <div class="tw"><table class="tbl"><tbody>${SRC.map(([k,v2])=>`<tr><th style="color:var(--ink-2);font-weight:600;font-size:12.5px">${k}</th><td class="t">${v2}</td></tr>`).join('')}</tbody></table></div></section>

// ───── 5. 점검 — 신호등 9계통 (cellbench/health.py 의 판정을 그대로 그린다 — 판정은 여기서 하지 않는다) ─────
// 첫 화면에 두지 않는다: 내비 '점검' · 위 막대 알약 · 내비 배지로만 드러난다. 신호 없음은 빨강과 같은 무게(빨간 고리 · 점선)
const LIC={power:'power',program:'term',wireless:'wifi',plug:'plug',dock:'battery',live:'radio',hr:'heart',disk:'drive',cloud:'cloud',human:'hand'};
const CK_ORDER=[['ok','정상','green'],['warn','경고','yellow'],['bad','조치','red'],['unk','신호 없음','unknown']];
const headOf=v=>String(v??'-').split(' · ')[0];
const urgentLane=l=>l.light==='red'||l.light==='unknown';
const ackLane=l=>(urgentLane(l)||l.light==='yellow')&&!l.hold;   // 노랑도 '확인' 표시를 받는다 (QA M-3)
function ckSel(){const ls=(HL&&HL.lanes)||[];if(ls.some(l=>l.key===U.ck))return U.ck;const w=['red','unknown','yellow'].map(x=>ls.find(l=>l.light===x)).find(Boolean);return (w||ls[0]||{}).key;}
function renderCheck(){
  const h=HL, lanes=(h&&h.lanes)||[], cnt=k=>lanes.filter(l=>l.light===k).length, none=cnt('none');
  $('ckSub').textContent=h?(h.stale?`클라우드 판정 · 마지막 ${kst(h.t,true)}`:`${API.cloud?'감시자 판정':'지금 판정'} · ${kstS(h.t)}`)+(none?` · 기록 없음 ${none}`:''):(HERR||'불러오는 중');
  // 시험대 띠 — 한 줄 이유 + 둘째 줄 '지금 할 일'(판정은 health.band_todo)
  const L=h?h.light:'unknown', c=LCLS[L]||'unk', td=h&&h.todo, on=!!h&&h.engine==='live'&&!h.stale;
  $('ckBand').className='band s-'+c;
  $('ckBand').innerHTML=`<span class="badge s-${c}"><span class="dot"></span>${LWORD[L]||'신호 없음'}</span><span class="who">${esc(benchName())}</span>
    <span class="why" aria-live="polite">${h?bandWhy(h):esc(HERR||'신호등 불러오는 중')}</span>
    <span class="beat"><span class="dot pulse s-${on?'ok':'none'}"></span>${h?`심박 ${h.beat_age==null?'없음':agoTxt(h.beat_age)} · ${esc(h.supervisor||'')}`:'심박 -'}</span>
    ${td?`<div class="todo"><b>지금 할 일</b>${esc(td.name)} — ${esc(td.human)}</div>`:''}`;
  keepFocus($('ckStats'),()=>{$('ckStats').innerHTML=CK_ORDER.map(([k,w,lt])=>{const n=cnt(lt);return `<button type="button" class="stat s-${k} ${n?'':'zero'}" data-f="${k}" data-fk="cf-${k}" aria-pressed="${U.ckf===k}">
      <span class="l"><span class="dot"></span>${w}</span><span class="n">${n}</span><span class="bar"><i style="width:${lanes.length?n/lanes.length*100:0}%"></i></span></button>`;}).join('');
    $('ckStats').querySelectorAll('.stat').forEach(b=>b.onclick=()=>{U.ckf=U.ckf===b.dataset.f?null:b.dataset.f;renderCheck();});});
  const sel=ckSel(), list=lanes.filter(l=>!U.ckf||(LCLS[l.light]||'unk')===U.ckf);
  keepFocus($('ckRows'),()=>{$('ckRows').innerHTML=!h?`<div class="empty">${esc(HERR||'불러오는 중')}</div>`:list.length?list.map(l=>{const lc=l.off?'none':LCLS[l.light]||'unk', ur=urgentLane(l)&&!l.hold;
      const ak=!ackLane(l)?'':l.acked_at?`<span class="badge sm s-ok">${I('check',11,2.4)}확인함</span>`:API.cloud||!ur?'':`<span class="badge sm s-bad">${l.ack_old?'다시 확인':'확인 필요'}</span>`;
      return `<button type="button" role="option" class="row s-${lc}" data-k="${l.key}" data-fk="ck-${l.key}" aria-selected="${l.key===sel}">
        <span class="st"><span class="dot" title="${LWORD[l.light]||'신호 없음'}"></span></span>
        <span class="nm"><span class="ic">${I(LIC[l.key]||'shield')}</span><span>${esc(l.name)}</span></span>
        <span class="val" title="${esc(l.value)}"><b>${esc(l.head||headOf(l.value))}</b></span>
        <span class="rs">${l.off?esc(plain(l.reason)):l.light==='green'?'이상 없음':l.light==='none'?'기록 없음':esc(plain(l.reason))}</span>
        <span class="ak">${ak}</span><span class="chev">${I('chev',14)}</span></button>`;}).join('')
    :'<div class="empty">해당 계통 없음</div>';
    $('ckRows').querySelectorAll('.row').forEach(b=>{b.onclick=()=>{U.ck=b.dataset.k;$('ckRows').querySelectorAll('.row').forEach(x=>x.setAttribute('aria-selected',String(x===b)));openInsp(true);ckInsp();};
      b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const all=[...$('ckRows').querySelectorAll('.row')],t=all[all.indexOf(b)+(e.key==='ArrowDown'?1:-1)];
        if(t){U.ck=t.dataset.k;all.forEach(x=>x.setAttribute('aria-selected',String(x===t)));t.focus();ckInsp();}}};});});
  ckInsp();
}
function ckInsp(){

function adaptV4(m,raw){

  for(const c of Object.values(cells))for(const k of Object.keys(c.items||{}))if(!ids.includes(k))ids.push(k);
  ids.sort((a,b)=>(ORDER.indexOf(a)+1||99)-(ORDER.indexOf(b)+1||99));
  const X=id=>Object.values(cells).map(c=>(c.items||{})[id]).filter(Boolean);
  // 항목의 갈래 — criteria.<id>.kind 를 먼저 읽는다(7-6 의 7). 없으면 파일의 글자로: flag 나 z 가 있으면 살펴봄, pass · fail 이 있으면 합불, 나머지 참고
  const kindOf=id=>{const k=crit[id]&&crit[id].kind;if(k)return KIND[k]||'rv';
    const xs=X(id);if(xs.some(x=>x.verdict==='flag'||num(x.z)))return'rv';if(xs.some(x=>x.verdict==='pass'||x.verdict==='fail'))return'pf';return'info';};
  const items=ids.map(id=>{let kind=kindOf(id);const forced=rep&&GPS_RE.test(id);if(forced)kind='info';
    const u=(X(id).find(x=>x.unit)||{}).unit;
    return{id,label:LABEL[id]||id,unit:u||'',kind,crit:crit[id]||null,forced};});
  const K=Object.fromEntries(items.map(i=>[i.id,i]));
  const CM={};
  for(const [s,c] of Object.entries(cells)){
    const v=c.verdict||{}, I=c.items||{}, it={};
    for(const id of ids){const x=I[id];if(!x){it[id]={j:null};continue;}
      let j=VMAP[x.verdict]||null;
      if(K[id].kind==='rv'&&x.verdict==='pass')j='정상 범위';   // 살펴봄 항목이 정상 범위(7-2 의 '이상치' 과 짝)
      if(K[id].forced&&j&&j!=='미판정')j='참고';                    // sky=repeater 의 GPS 항목
      it[id]={j,v:x.value,z:x.z,why:x.basis||null};}
    const flags=Array.isArray(v.flags)?v.flags:[];
    CM[s]={s,verdict:VMAP[v.overall]||'기타',reasons:Array.isArray(v.reasons)?v.reasons:[],why:(v.reasons||[]).join(' · ')||null,
      review:flags.map(id=>({id,값:I[id]?I[id].value:null,z:I[id]?I[id].z:null,basis:I[id]?I[id].basis:null})),items:it,dock:c.dock||null};
  }
  m.items=items;m.cells=CM;m.rig=rigOf(raw.rig);m.counts=countV(CM);m.group=raw.group||{};m.crit=crit;
  // 그림 3 — 속도별 값
  const band=Object.entries(cells).filter(([,c])=>c.items&&c.items.sog_band&&Array.isArray(c.items.sog_band.value));
  const gm=Object.entries(cells).filter(([,c])=>c.items&&c.items.gps_move&&c.items.gps_move.value&&c.items.gps_move.value.v_ratio);
  if(band.length){
    m.speed={type:'band',bands:band[0][1].items.sog_band.value.map(b=>b.band),edges:Array.isArray(crit.sog_band&&crit.sog_band.value)?crit.sog_band.value:null,
      edgeStatus:crit.sog_band?crit.sog_band.status:'미정',cells:Object.fromEntries(band.map(([s,c])=>[s,c.items.sog_band.value])),group:(raw.group||{}).sog_band||null,info:rep};
  }else if(gm.length){const st=Object.keys(gm[0][1].items.gps_move.value.v_ratio);const G=((raw.group||{}).gps_move||{}).v_ratio||{};
    m.speed={type:'ratio',steps:st,unit:'mm/s',ylab:'원시 속도 ÷ 시나리오 속도',src:'gps_move.v_ratio',cells:Object.fromEntries(gm.map(([s,c])=>[s,c.items.gps_move.value.v_ratio])),
      med:Object.fromEntries(st.map(k=>[k,G[k]?G[k].med:null])),info:rep};
  }else m.speed=null;
  // 그림 4 — 가속도 단계별
  const AP=['imu','gate_on','gate_off','gate_share'].filter(id=>X(id).some(x=>x.value&&typeof x.value==='object'&&!Array.isArray(x.value)));
  if(AP.length){const steps=[...new Set(AP.flatMap(id=>X(id).flatMap(x=>Object.keys(x.value||{}))))].sort((a,b)=>a-b);
    m.accel={steps,panels:AP.map(id=>({id,label:LABEL[id],unit:K[id].unit,crit:crit[id]||null,
      cells:Object.fromEntries(Object.entries(cells).map(([s,c])=>[s,(c.items&&c.items[id]&&c.items[id].value)||{}])),
      med:Object.fromEntries(steps.map(k=>[k,((raw.group||{})[id]||{})[k]?raw.group[id][k].med:null]))}))};}
  else m.accel=null;
  return m;
}
function adaptV1(m,raw){
  const cells=raw.cells||{}, CM={};
  const VAL=['r_share','cn0','sats','still_speed','r_p95_mm'];
  for(const [s,c] of Object.entries(cells)){
    const v=c.verdict||{}, z=v.GPS_z||{}, st=c.static||{}, it={};
    it.rx={j:v['수신']===true?'합격':v['수신']===false?'불합격':null,v:c.loss_pct};
    it.clock={j:v['시각']===true?'합격':v['시각']===false?'불합격':null,v:v.clock_dev_ms};
    it.imu={j:v.IMU===true?'합격':v.IMU===false?'불합격':null,v:null};
    it.gps={j:v.GPS==='정상'?'정상 범위':v.GPS==='살펴볼 셀'?'이상치':null,v:null,z:Object.values(z)[0],why:Object.entries(z).map(([k,x])=>`${LABEL[k]||k} z ${x}`).join(' · ')||null};
    for(const k of VAL)it[k]={j:'값',v:st[k],z:z[k],w:k in z};
    CM[s]={s,verdict:v['판정']||'기타',review:Object.entries(z).map(([k,x])=>({id:k,값:st[k],z:x})),items:it};
  }
  m.items=[{id:'rx',kind:'pf'},{id:'clock',kind:'pf'},{id:'imu',kind:'pf'},{id:'gps',kind:'rv'},...VAL.map(id=>({id,kind:'val'}))]
    .map(x=>({...x,label:LABEL[x.id]||x.id,unit:UNIT[x.id]||'',crit:null}));
  m.cells=CM;m.rig=rigOf(raw.rig);m.counts=countV(CM);m.group=raw.group||{};m.crit={};
  const steps=(raw.steps||[]).map(String);
  m.speed=steps.length?{type:'ratio',steps,unit:'mm/s',ylab:'GNSS ÷ 레일',src:'speeds',
    cells:Object.fromEntries(Object.entries(cells).map(([s,c])=>[s,Object.fromEntries(steps.map(k=>[k,c.speeds&&c.speeds[k]?c.speeds[k].ratio:null]))])),
    med:Object.fromEntries(steps.map(k=>[k,raw.group&&raw.group.ratio&&raw.group.ratio[k]?raw.group.ratio[k].med:null])),info:false}:null;
  m.accel=null;
  return m;
}
// 목록 한 줄 — 서버 요약(GET /api/rail/runs 의 한 항목)을 그대로 옮긴다. 판정 개수는 서버가 글자를 센 것
function listModel(s){
  s=s||{};
  const vc=s.verdicts||{}, n=s.n_cells||0;
  const ver=s.error?'?':s.protocol==null?(n>0&&(vc['없음']||0)===n?'?':'v1'):SUPPORTED.includes(s.protocol)?String(s.protocol):'unsupported';
  const u=v=>v==null||v===''?'미확인':Array.isArray(v)?v.join(' · '):String(v);
  return{name:s.name,sample:s.sample===true,ver,protocol:s.error?'–':s.protocol!=null?String(s.protocol):(ver==='v1'?'v1':'미확인'),date:stampDate(s.stamp||stampOf(s.name)),
    top:{sky:u(s.sky),part:u(s.part),scene:u(s.scene),set:u(s.set),cell_type:u(s.cell_type),judge_commit:u(s.judge_commit),site:u(s.site)},
    n,counts:{'합격':vc['합격']||0,'불합격':vc['불합격']||0,'미판정':(vc['보류']||0)+(vc['미판정']||0),'무효':vc['무효']||0},
    rig:s.rig_valid===true?true:s.rig_valid===false?false:null,unsupported:ver==='unsupported'||ver==='?',error:s.error||null};
}
// 독 순서: grid(6행 × 4열)가 있으면 열마다 위에서부터, 없으면 시리얼 순
function order(m){const g=m.grid;if(g&&g.length){const o=[];for(let c=0;c<(g[0]||[]).length;c++)for(let r=0;r<g.length;r++)if(g[r][c]!=null)o.push(String(g[r][c]));
  for(const s of Object.keys(m.cells))if(!o.includes(s))o.push(s);return o.filter(s=>m.cells[s]);}return Object.keys(m.cells).sort();}

const VCLS={'합격':'s-ok','불합격':'s-bad','미판정':'s-d1','무효':'s-idle'};
// 보기 좋은 눈금(1 · 2 · 2.5 · 5 × 10ⁿ) — 그리기 도구일 뿐 판정과 무관
function nice(lo,hi){if(!(hi>lo)){hi=lo+1;}const s0=(hi-lo)/3,p=Math.pow(10,Math.floor(Math.log10(s0))),f=s0/p,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const t=[];for(let x=Math.ceil(lo/st)*st;x<=hi+st*1e-6;x+=st)t.push(+x.toFixed(6));return{ticks:t,dec:st>=1?0:st>=0.1?1:2};}

const FMT_ERR='파일 형식 오류 · 쓰는 프로그램 확인';
async function railGet(url){
  let r,txt;
  try{r=await fetch(url,{cache:'no-store'});txt=await r.text();}catch(e){throw new Error('결과판 서버 응답 없음');}
  try{return{ok:r.ok,status:r.status,j:JSON.parse(txt)};}
  catch(e){const k=/(NaN|-?Infinity)/.exec(txt);throw new Error(FMT_ERR+(k?` · ${k[1]}`:''));}
}
async function loadRuns(){
  if(RL.busy)return false; RL.busy=true; RL.at=Date.now();
  try{const j=CLOUD?await API.railRuns():(await railGet('/api/rail/runs')).j;RL.runs=Array.isArray(j)?j:[];RL.err='';}catch(e){RL.err=e.message;}
  if(!CLOUD){try{RL.cloud=await API.railCloud();}catch(e){RL.cloud=null;}}
  RL.busy=false;
  const sig=JSON.stringify(RL.runs)+'|'+RL.err+'|'+JSON.stringify(RL.cloud), ch=sig!==RL.sig; RL.sig=sig; return ch;
}
async function loadRun(name){
  if(RL.raw[name])return true; if(RL.loading[name])return RL.loading[name];
  RL.loading[name]=(async()=>{try{const {ok,status,j}=CLOUD?await API.railRun(name):await railGet('/api/rail/run?name='+encodeURIComponent(name));
      if(!ok){RL.bad[name]=(j&&j.error)||`${status}`;return false;}RL.raw[name]=j;delete RL.bad[name];return true;}
    catch(e){RL.bad[name]=e.message;return false;}
    finally{RL.badAt[name]=Date.now();delete RL.loading[name];}})();
  return RL.loading[name];
}

const tName=(p,full)=>p==='미확인'?'파트 미확인':String(p).split(' · ').map(x=>TESTS[x]?(full?TESTS[x].f:TESTS[x].s):x).join(' · ');
const skyName=v=>SKY[v]||v, siteName=v=>SITE[v]||v, modelName=v=>MODEL[v]||v;

const reasonText=r=>String(r).replace(/^([a-z][a-z_0-9]*)(?=\s)/,id=>LABEL[id]||id);
// 판정 파일의 기준 — 셀 판정에 들어가는 합부 항목과, 판정에 안 들어가는 관찰 항목
function basisOf(raw){const cr=(raw&&raw.criteria)||{}, pf=[], rv=[];
  for(const [id,c] of Object.entries(cr))(c.kind==='합불'?pf:rv).push({id,label:LABEL[id]||id,c});

const critShort=x=>{const c=x.c, v=c.value, u=c.unit?' '+c.unit:'';

  return `${x.label} ${t}${c.status==='제안값'?' (제안값)':''}`;};

/* ---- QC 판정 — 세트 단위. 판정 파일과 따로 둔다(파일은 시험 PC 가 쓰고 결과판은 읽기만) ---- */

const dispOf=key=>{if(!DP.map)return null;const S=setsOf().find(x=>x.key===key);return S&&S.comp?DP.map[S.comp]||null:null;};
/* ---- 세트 — 셀 구성(시리얼 목록)으로 정한다. 사람이 번호를 넣지 않는다
   처음 보는 구성은 세트 1 부터 차례로 번호를 붙이고, 같은 구성이면 같은 세트(자리만 바꾼 것도 같은 세트)
   기존 세트의 일부 셀만 다시 돌린 것은 그 세트의 재시험, 셀이 하나라도 바뀌면 새 세트 ---- */
function setsOf(){
  const runs=(RL.runs||[]).map(listModel).filter(m=>!m.unsupported&&!m.error).sort((a,b)=>a.name<b.name?-1:1);
  const sets=[], pend=[];
  for(const m of runs){if(RL.bad[m.name])continue;const raw=RL.raw[m.name];if(!raw||!raw.cells){pend.push(m);continue;}
    const ser=Object.keys(raw.cells).sort(), comp=ser.join(',');
    let S=sets.find(x=>x.comp===comp)||[...sets].reverse().find(x=>ser.every(c=>x.ser.has(c)));
    if(!S){let from=null,best=0;for(const x of sets){const o=ser.filter(c=>x.ser.has(c)).length;if(o>best){best=o;from=x;}}
      S={key:`세트 ${sets.length+1}`,no:sets.length+1,comp,ser:new Set(ser),top:m.top,runs:[],
        from:from?{key:from.key,swap:ser.length-best}:null};sets.push(S);}

  if(pend.length)sets.push({key:'확인 중',no:0,comp:'',ser:new Set(),top:pend[0].top,runs:pend,from:null});
  return sets.sort((a,b)=>a.runs[a.runs.length-1].name<b.runs[b.runs.length-1].name?1:-1);}

// 세트로 묶지 못한 기록 — 서버가 읽지 못한 파일 · 결과판이 모르는 판 · 브라우저가 읽지 못한 파일(형식 오류). 판정 파일은 한 번 쓰고
// 끝나므로 깨진 채 남으면 사람이 알아야 한다 — 목록에서 숨기지 않는다
const looseRuns=()=>(RL.runs||[]).map(listModel).filter(m=>m.error||m.unsupported||RL.bad[m.name]);
// 셀 시리얼마다 시험별 결과 — 장비 이상 회차는 셀 판정을 쓰지 않으므로 뺀다
function setCells(S){
  const C={}, parts=new Set(), inval=[], nRun={};let last=null;
  for(const lm of S.runs){const m=runModel(lm.name);if(!m||m.unsupported)continue;const p=m.top.part;parts.add(p);
    if(m.rig.valid===false){inval.push(lm.name);continue;}
    nRun[p]=(nRun[p]||0)+1;last=lm.name;
    for(const x of Object.values(m.cells)){const c=C[x.s]=C[x.s]||{s:x.s,dock:null,t:{}};if(x.dock)c.dock=x.dock;
      const t=c.t[p]=c.t[p]||{n:0,fail:0,hold:0,last:null,firstFail:null,why:[]};t.n++;t.last=lm.name;
      if(x.verdict==='불합격'){t.fail++;if(!t.firstFail)t.firstFail=lm.name;for(const r of x.reasons||[]){const w=reasonText(r);if(!t.why.includes(w))t.why.push(w);}}
      if(x.verdict==='미판정')t.hold++;}}
  // 자동 판정: 어느 시험이든 불합격 회차가 있으면 불합격, 모두 판정됐고 불합격이 없으면 합격, 그 밖은 미판정
  for(const c of Object.values(C)){const ts=Object.values(c.t);c.auto=ts.some(t=>t.fail)?'불합격':ts.length&&ts.every(t=>t.n>t.hold)?'합격':'미판정';}
  const cells=Object.values(C).sort((a,b)=>(a.auto==='합격')-(b.auto==='합격')||(a.s<b.s?-1:1));
  const n={'합격':0,'불합격':0,'미판정':0};for(const c of cells)n[c.auto]++;
  return{cells,n,parts:[...PART_ORDER.filter(p=>parts.has(p)),...[...parts].filter(p=>!PART_ORDER.includes(p))],nRun,inval,last,loaded:S.runs.every(r=>RL.raw[r.name]||RL.bad[r.name])};}
const serialRange=ss=>{const v=[...ss].sort();return v.length?`${v[0]} ~ ${v[v.length-1]}`:'–';};
