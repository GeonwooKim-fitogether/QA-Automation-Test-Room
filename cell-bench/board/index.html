<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Bench — 셀 배터리 내구 시험</title>
<script>
(function(){var m='auto';try{m=JSON.parse(localStorage.getItem('theme')||'"auto"')}catch(e){}
var d=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');})();
</script>
<style>
/* 설계 메모 — 승인된 시안 docs/design/cellbench-app-mockup.html 을 실데이터로 입힌 것.
   앱 셸: 왼쪽 내비 216px(관제 · 추이 분석 · 절차 · 기준 · 점검 + 세트 묶음) · 위 막대 52px(위치 · 전역 상태 알약 · 계정).
   화면 6개: 관제(첫 화면) · 세트 상세 · 추이 분석 · 절차 · 기준 · 점검(신호등 9계통) · 세트 등록(3단계).
   점검은 첫 화면에 두지 않는다 — 내비 '점검' + 위 막대 알약 + 내비 배지로만 드러난다. 세트 등록은 관제의 미등록 칸 [등록]에서 들어간다.
   데이터: cloud-config.js 가 없으면 serve_board.py 의 /api/*, 있으면 Supabase. 10초마다 다시 읽는다. 외부 리소스 없음(시험망에 인터넷이 없다).
   상태 색: s-ok 정상 · s-warn 준비 · s-bad 조치 · s-unk 미확인(빨강과 같은 무게 — 빨간 고리) · s-idle 운전 대기(회색 고리) · s-none 기록 없음(회색).
   불마다 글자가 함께 간다 — 색만으로 뜻을 전하지 않는다. */
:root{
  --bg:#F5F6F4; --panel:#FFFFFF; --side:#EEF0EC; --line:#E2E5E0; --line-2:#D2D7D0;
  --ink:#1C2124; --ink-2:#4B5458; --ink-3:#7D878C;
  --brand:#0E9F6E; --brand-soft:#E5F5EE; --hover:#F7F8F6; --sel:#EEF6F2;
  --ok:#11A06E; --ok-z:#DDF1E7; --warn:#C27C12; --warn-z:#FBEBCB; --warn-soft:#FDF5E6; --bad:#C2453B; --bad-z:#F6D6D2; --bad-soft:#FCEDEB;
  --unk:#AAB2B6; --unk-z:#E7EAE7;
  --d1:#2F6FB3; --d1-z:#DCE7F4; --on-solid:#FFFFFF; --scrim:rgba(10,15,12,.35);
  --shadow:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06); --lift:0 1px 2px rgba(0,0,0,.08); --lift-2:0 1px 3px rgba(0,0,0,.2);
  --font:"IBM Plex Sans KR","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
}
/* 화면 모드: <head> 의 스크립트가 저장된 선택(자동 · 라이트 · 다크)을 읽어 data-theme 를 light/dark 로 정한다 */
:root[data-theme="dark"]{
  --bg:#111416; --panel:#191E20; --side:#14181A; --line:#283034; --line-2:#343D41;
  --ink:#E8ECE9; --ink-2:#B6BEC1; --ink-3:#7E888D;
  --brand:#34D399; --brand-soft:#16322A; --hover:#1E2427; --sel:#1B2C27;
  --ok:#34D399; --ok-z:#183A2E; --warn:#E8AE52; --warn-z:#4A3816; --warn-soft:#2E2614; --bad:#F08C84; --bad-z:#4D2724; --bad-soft:#2E1C1B;
  --unk:#5F6A70; --unk-z:#262D30;
  --d1:#79AEEB; --d1-z:#1F3047; --on-solid:#111416; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --lift:0 1px 2px rgba(0,0,0,.4); --lift-2:0 1px 3px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:is(button,input,a,label,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg text{font-family:var(--font)}
.mono{font-family:var(--mono)}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* 상태 색 묶음 — 미확인은 빨강과 같은 무게(빨간 고리), 운전 대기는 회색 고리, 기록 없음은 회색 */
.s-ok{--c:var(--ok);--z:var(--ok-z);--soft:var(--brand-soft)}
.s-warn{--c:var(--warn);--z:var(--warn-z);--soft:var(--warn-soft)}
.s-bad{--c:var(--bad);--z:var(--bad-z);--soft:var(--bad-soft)}
.s-unk{--c:var(--bad);--z:var(--bad-z);--soft:var(--bad-soft)}
.s-idle{--c:var(--unk);--z:var(--unk-z);--soft:var(--unk-z)}
.s-none{--c:var(--ink-3);--z:var(--line);--soft:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3));flex:none;display:inline-block}
.s-unk.dot,.s-unk .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--bad)}
.s-idle.dot,.s-idle .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--unk)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;background:var(--soft,var(--bg));color:var(--c,var(--ink-2));font-weight:600;font-size:12px;white-space:nowrap}
.s-unk.badge{color:var(--bad)} .s-idle.badge,.s-none.badge{color:var(--ink-3)}
button.badge{border:0;cursor:pointer}
.badge.sm{height:20px;padding:0 7px;font-size:11px;gap:5px}
.badge.sm .dot{width:7px;height:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip svg{color:var(--ink-3)}
.chip.sm{height:20px;padding:0 7px;font-size:11px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:700;margin-left:6px;vertical-align:1px}
.muted{color:var(--ink-3)} .sm{font-size:12px}
.msg-bad{color:var(--bad)} .msg-ok{color:var(--ok)} .msg-warn{color:var(--warn)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-z);background:var(--bad-soft)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);background:var(--bad-soft)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:var(--on-solid)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.icon-btn{width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.inp{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;min-width:0}
.inp.pin{width:84px;font-family:var(--mono);letter-spacing:.08em}
.inp:disabled{opacity:.5}

/* 분할 단추 (범위 · 정렬 · 화면 모드) */
.seg{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px}
.seg>div{display:inline-flex;padding:2px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--lift),0 0 0 1px var(--line)}
.seg.th button{width:28px;padding:0;justify-content:center}

/* 앱 셸 */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 0 215px,var(--line) 215px 216px,transparent 216px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em;flex:none}
.brand>div{min-width:0}
.brand b{display:block;font-size:13.5px} .brand small{display:block;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:grid;gap:2px}
.nav button,.sets button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--ink-2);cursor:pointer;text-align:left;font-weight:500;width:100%}
.nav button:hover,.sets button:hover{background:var(--hover)}
.nav button[aria-current="page"],.sets button[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--c);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .cnt.s-unk{background:var(--panel);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.sets{display:grid;gap:2px}
.sets .gl{padding:0 10px 4px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.sets button{height:30px;font-size:13px}
.sets button .dot{margin:0 3px 0 4px}
.sets button small{margin-left:auto;color:var(--ink-3);font-size:11.5px;font-weight:500}
.sets button small.s-warn{color:var(--warn);font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:6px 4px 6px 10px;color:var(--ink-3);font-size:12px}
.side-foot .lv{display:flex;align-items:center;gap:8px;min-width:0}
.side-foot .lv span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .md{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pulse{position:relative}
@media (prefers-reduced-motion:no-preference){
  .pulse.s-ok::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb button{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:5px;color:var(--ink-3);cursor:pointer}
.crumb button:hover{color:var(--ink);background:var(--hover)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.health{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--c);white-space:nowrap}
.health.s-unk{border-style:dashed;border-color:var(--bad-z)}
.health.s-none,.health.s-idle{color:var(--ink-2)}
.me{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 10px 0 3px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2);max-width:220px}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .av,.av{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.me.out{padding:0 12px 0 10px}
.th-m,.det-m{display:none}

.content{padding:24px;display:grid;gap:18px;max-width:1400px;width:100%;align-content:start}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:32px}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph h1:focus{outline:none}
.ph .sub{color:var(--ink-3);font-size:12.5px}
.ph .ph-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 카드 · 집계 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:6px 10px;min-height:52px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-b{padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;display:grid;gap:6px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s;align-content:start;min-width:0}
div.stat{cursor:default}
button.stat:hover{border-color:var(--line-2)}
.stat[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px var(--z)}
.stat .l{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:500;font-size:12.5px;min-width:0}
.stat .l svg{color:var(--ink-3);flex:none}
.stat .n{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:5px}
.stat .n small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.stat .n.c{color:var(--c)}
.stat.zero .n{color:var(--ink-3)}
.stat .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.stat .bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.stat .foot{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;min-height:18px;min-width:0}
.stat .foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 기준 게이지 (셀 잔량 · 공용) */
.g{position:relative;height:8px;border-radius:4px;background:var(--line);display:flex;overflow:visible}
.g .z{position:absolute;top:0;bottom:0}
.g .z.ok{background:var(--ok-z)} .g .z.warn{background:var(--warn-z)} .g .z.bad{background:var(--bad-z)}
.g .z:first-child{border-radius:4px 0 0 4px} .g .z:last-of-type{border-radius:0 4px 4px 0}
.g .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 3px var(--c),var(--lift-2)}
.soc{position:relative;height:8px;border-radius:4px;background:var(--line);display:block}
.soc i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}
.soc .bl{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--warn)}
.ends{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--ink-3);position:relative}
.ends .blab{position:absolute;transform:translateX(-50%);color:var(--warn);font-weight:600}

/* 목록 + 상세 패널 */
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1280px){.body{grid-template-columns:minmax(0,1fr) 360px}}
.insp{display:none;align-content:start}
@media (min-width:1280px){.insp{display:grid;position:sticky;top:76px;max-height:calc(100vh - 96px)}.insp .card{overflow:auto}}
.insp .card{display:grid;box-shadow:var(--shadow)}
.ih{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ih b{font-size:15px}
.ih .x{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:none;place-items:center}
.ib{padding:18px 16px;display:grid;gap:20px;min-width:0}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big span{font-size:15px;color:var(--ink-2);font-weight:600}
.lab{color:var(--ink-3);font-size:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-3);font-weight:600;gap:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv>div{padding:10px 12px;display:grid;gap:3px;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-child(odd){border-right:1px solid var(--line)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv>div:nth-child(odd):last-child{grid-column:1/-1;border-right:0}
.kv span{color:var(--ink-3);font-size:11.5px;display:flex;align-items:center;gap:5px}
.kv b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.kv b small{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.kv.t b{font-size:13px;font-weight:600;line-height:1.35}
.scrim{display:none}
@media (max-width:1279px){
  .insp.open{display:grid;position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(400px,100%);padding:12px}
  .insp.open .card{max-height:100%;overflow:auto}
  .insp .ih .x{display:grid}
  .scrim.open{display:block;position:fixed;inset:0;z-index:15;background:var(--scrim)}
}

/* 알림 · 토스트 · 떠 있는 상자 */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);z-index:40;background:var(--ink);color:var(--panel);border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:var(--on-solid)}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:12;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;text-align:left}
.pop>b{display:flex;align-items:center;gap:8px;font-size:13.5px}
.pop>b.dg{color:var(--bad)}
.pop ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--ink-2);font-size:12.5px}
.pop li{display:flex;align-items:center;gap:7px}
.pop li svg{color:var(--ink-3);flex:none}
.pop .r{display:flex;justify-content:flex-end;gap:8px}
.pop form{display:grid;gap:8px}
.pop .inp{width:100%}
.login{position:fixed;top:58px;right:16px;z-index:30}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
.empty-c{display:grid;place-items:center;gap:8px;min-height:200px;padding:24px;color:var(--ink-3);text-align:center}

function cloudApi(cfg){
  const tok=()=>{try{return JSON.parse(sessionStorage.getItem('sb_session')||'null')}catch(e){return null}};
  const headers=()=>{const t=tok();return {'apikey':cfg.anon,'Authorization':'Bearer '+(t?t.access_token:cfg.anon),'Content-Type':'application/json'};};
  const rest=async(path,opt={})=>{const r=await fetch(`${cfg.url}/rest/v1/${path}`,{...opt,headers:{...headers(),...(opt.headers||{})},cache:'no-store'});
    if(r.status===401){sessionStorage.removeItem('sb_session');authLost();throw new Error('로그인 필요');}
    if(!r.ok){throw new Error(`${r.status} ${await r.text()}`);} const txt=await r.text();return txt?JSON.parse(txt):null;};
  const b=`bench_id=eq.${encodeURIComponent(cfg.bench)}`;
  let lastCycle=null;
  return {cloud:true, cfg,
    loggedIn:()=>!!tok(), email:()=>(tok()||{}).user?.email||'',
    login:async(email,password)=>{const r=await fetch(`${cfg.url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':cfg.anon,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.msg||j.error||'로그인 실패'); sessionStorage.setItem('sb_session',JSON.stringify(j));},
    logout:()=>sessionStorage.removeItem('sb_session'),
    now:async()=>{const rows=await rest(`bench_state?${b}&select=payload,updated_at`);const n=rows[0]?rows[0].payload:{};lastCycle=n.cycle??lastCycle;return n;},
    samples:async(rng)=>{const conv=r=>({time:fmtLocal(r.t),cycle:r.cycle,phase:r.phase,plug:r.plug_on==null?'':(r.plug_on?'on':'off'),watts:r.watts==null?'':String(r.watts),wh:String(r.wh??0),cells:r.cells_alive,batt_min:r.batt_min??'',batt_avg:r.batt_avg??'',batt_max:r.batt_max??'',hr_cells:0,n:r.n});
      if(rng==='all'){const rows=await rest(`bench_sample_1h?${b}&order=t.asc&limit=5000`);return {cycle:null,range:rng,rows:rows.map(conv)};}
      if(rng==='recent'){if(lastCycle==null)return{cycle:null,range:rng,rows:[]};const rows=await rest(`bench_sample_10m?${b}&cycle=gte.${Math.max(1,lastCycle-4)}&order=t.asc&limit=5000`);return {cycle:null,range:rng,rows:rows.map(conv)};}
      if(lastCycle==null)return{cycle:null,rows:[]};const rows=await rest(`bench_sample?${b}&cycle=eq.${lastCycle}&order=t.asc&limit=2000`);
      return {cycle:lastCycle,rows:rows.map(conv)};},
    cycles:async()=>(await rest(`bench_cycle?${b}&order=cycle.asc`)).map(r=>r.row),
    events:async()=>(await rest(`bench_event?${b}&order=t.desc&limit=200`)).reverse().map(r=>({time:fmtLocal(r.t),cycle:r.cycle,phase:r.phase,kind:r.kind,serial:r.serial,detail:r.detail})),
    discharge:async()=>(await rest(`bench_discharge?${b}&order=cycle.asc,serial.asc`)).map(r=>({cycle:r.cycle,serial:r.serial,start_pct:r.start_pct,end_pct:r.end_pct,hours:r.hours,pct_per_h:r.pct_per_h,est_runtime_h:r.est_runtime_h==null?'':r.est_runtime_h})),
    cells:async()=>[],
    control:async()=>{if(!tok())return {enabled:true,locked:false,needLogin:true,pending:null,last_ack:null};const rows=await rest(`bench_command?${b}&order=requested_at.desc&limit=5`);const p=rows.find(r=>!r.taken_at);const a=rows.find(r=>r.result);
      return {enabled:true,locked:false,pending:p?{cmd:p.cmd,t:Date.parse(p.requested_at)/1000}:null,last_ack:a?{cmd:a.cmd,result:a.result,t:Date.parse(a.taken_at||a.requested_at)/1000}:null};},
    send:async(cmd)=>{const email=(tok()||{}).user?.email;await rest('bench_command',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({bench_id:cfg.bench,cmd,requested_by:email})});
      return {ok:true,note:'시험 프로그램이 20초 안에 집어 갑니다. 결과는 아래에 나옵니다'};},
    // 신호등 — 감시자가 1분마다 올린 판정. updated_at 이 stale_after_s(5분)보다 묵으면 화면이 스스로 전체를 '미확인'으로 (PC 가 죽어도 불이 켜진다)
    health:async()=>{const rows=await rest(`bench_health?${b}&select=payload,updated_at`);if(!rows||!rows.length)return null;
      const p=rows[0].payload||{}, age=Date.now()/1000-Date.parse(rows[0].updated_at)/1000;
      return age>(p.stale_after_s||300)?staleHealth(p,age):p;}};
}

const SLOTS=5;
function setSlots(){
  const hs=HL&&Array.isArray(HL.sets)&&HL.sets.length?HL.sets:[{id:1,running:true}];

}

function dischargeEta(){   // 범위와 무관하게 이번 사이클 원본 표본(S.cur)으로 — 최근 30분 최저 잔량의 직선 기울기
  const n=S.now, rows=(S.cur||[]).filter(r=>r.phase==='DISCHARGE'&&r.batt_min!=='');
  if(rows.length<6) return null;
  const pts=rows.map(r=>[parseTs(r.time),+r.batt_min]); const tEnd=pts[pts.length-1][0];
  const w=pts.filter(p=>tEnd-p[0]<=1800); if(w.length<6) return null;
  const mx=w.reduce((a,p)=>a+p[0],0)/w.length, my=w.reduce((a,p)=>a+p[1],0)/w.length;
  const num=w.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0), den=w.reduce((a,p)=>a+(p[0]-mx)**2,0);

}

      <span class="n ${lvl==null?'muted':''}">${lvl==null?'—':lvl}<small>%</small></span>
      <span class="soc ${low?'s-warn':'s-ok'}"><i style="width:${lvl??0}%"></i><span class="bl" style="left:${stop}%"></span></span>
      <span class="ends"><span>0</span><span class="blab" style="left:${stop}%">기준선 ${stop}</span><span>100</span></span></div>
    <div class="meta"><span title="사이클">${I('repeat',13)}${have?`${n.cycle}회`:'—'}</span><span title="수신">${I('radio',13)}${have?`${a.length}/${n.expected||24}`:'—'}</span><span title="플러그 전력">${I('plug',13)}${n.plug&&n.plug.w!=null?`${(+n.plug.w).toFixed(1)} W`:'—'}</span></div>
  </button>`;
}
function setCard(s){
  if(s.kind==='run')return runCard(s);
  if(s.kind==='idle')return `<button type="button" class="sc s-idle" data-set="${esc(s.id)}" data-fk="sc-${esc(s.id)}" aria-label="세트 ${esc(s.id)} — 운전 대기 · 짝 보기"${s.reason?` title="${esc(s.reason)}"`:''}>
    <div class="sc-h"><b>세트 ${esc(s.id)}</b><span class="badge s-idle"><span class="dot"></span>운전 대기</span></div>
    <div class="det"><div><span class="ic">${I('check',15)}</span>등록됨</div><div><span class="ic">${I('timer',15)}</span><span class="sm">다중 세트 적용 뒤 운전</span></div></div>
    <div class="meta"><span>${I('link',13)}짝 보기</span><span></span><span>${API.cloud?'':'해제 →'}</span></div></button>`;
  if(s.kind==='detect'){const d=s.detect||{};
    return `<div class="sc new s-warn"${s.reason?` title="${esc(s.reason)}"`:''}><div class="sc-h"><b>세트 ${esc(s.id)}</b><span class="badge s-warn"><span class="dot"></span>미등록 감지</span></div>
      <div class="det"><div><span class="ic">${I('battery',15)}</span>셀 <b>${d.cells??0}</b></div><div><span class="ic">${I('plug',15)}</span>플러그 <b>${d.plugs??0}</b></div></div>
      ${API.cloud?'<div class="note">등록은 제어 PC 결과판에서</div>':`<button type="button" class="btn primary" data-reg="${esc(s.id)}" data-fk="reg-${esc(s.id)}">${I('plus',15)}등록</button>`}</div>`;}
  return `<div class="sc empty">${I('plus',18)}<b>세트 ${esc(s.id)}</b><small>비어 있음</small></div>`;
}
function topo(host){
  // 3단: 제어 PC → LiveHub (시험망 · 공용 1대) → 세트 5칸 (위 세트 카드와 같은 5열)
  if(!host)return;
  const W=wOf(host), sm=W<480, v=n=>`var(--${n})`, n=S.now, have=!!n.phase, es=engineStat(), live=es.cls==='ok';
  const g=sm?6:10, sw=(W-4*g)/5, nw=sm?Math.min(W,230):240, nh=46, sh=sm?62:66;
  const yPC=4, yHub=yPC+nh+40, yBus=yHub+nh+26, ySet=yBus+20, H=ySet+sh+4, cx=W/2;
  const node=(x,y,w,h,ic,t,sub,stroke)=>`<rect x="${x+.5}" y="${y+.5}" width="${w-1}" height="${h-1}" rx="9" fill="${v('panel')}" stroke="${stroke||v('line-2')}"/>
    ${svgIcon(ic,x+12,y+h/2-9,18,v('ink-2'))}<text x="${x+40}" y="${y+h/2-2}" font-size="13" font-weight="600" fill="${v('ink')}">${esc(t)}</text>
    <text x="${x+40}" y="${y+h/2+13}" font-size="11" fill="${stroke&&stroke.includes('bad')?v('bad'):v('ink-3')}">${esc(sub)}</text>`;
  let e='',nd='';
  const link=have?(live?v('ink-3'):v('bad')):v('line-2');
  e+=`<line x1="${cx}" y1="${yPC+nh}" x2="${cx}" y2="${yHub}" stroke="${link}" stroke-width="1.5" ${live?'':'stroke-dasharray="4 3"'}/>`;
  nd+=`<rect x="${cx+10}" y="${yPC+nh+11}" width="76" height="18" rx="5" fill="${v('bg')}" stroke="${v('line')}"/><text x="${cx+48}" y="${yPC+nh+24}" font-size="11" font-weight="600" text-anchor="middle" fill="${v('ink-3')}">Wi-Fi 5 GHz</text>`;
  const sx=i=>i*(sw+g), slots=setSlots();
  e+=`<line x1="${cx}" y1="${yHub+nh}" x2="${cx}" y2="${yBus}" stroke="${v('ink-3')}" stroke-width="1.5"/>`;
  e+=`<line x1="${sx(0)+sw/2}" y1="${yBus}" x2="${sx(4)+sw/2}" y2="${yBus}" stroke="${v('line-2')}" stroke-width="1.5"/>`;
  slots.forEach((s,i)=>{const x=sx(i),mx=x+sw/2,t=setTone(s),k=s.kind;
    const col=k==='empty'?v('line-2'):k==='idle'?v('ink-3'):k==='detect'?v('warn'):`var(--${{ok:'ok',warn:'warn',bad:'bad',unk:'bad',none:'ink-3'}[t.cls]||'ink-3'})`;
    e+=`<line x1="${mx}" y1="${yBus}" x2="${mx}" y2="${ySet}" stroke="${col}" stroke-width="${k==='empty'?1.5:2}" ${k==='empty'?'stroke-dasharray="2 3"':k==='detect'||t.cls==='unk'?'stroke-dasharray="4 3"':''}/>`;
    if(k!=='empty')e+=`<circle cx="${mx}" cy="${yBus}" r="3" fill="${col}"/>`;
    const sub=k==='empty'?'비어 있음':k==='detect'?'미등록':k==='idle'?'운전 대기':have?`수신 ${alive().length}/${n.expected||24}`:'기록 없음';
    nd+=`<rect x="${x+.5}" y="${ySet+.5}" width="${sw-1}" height="${sh-1}" rx="9" fill="${k==='empty'?'none':v('panel')}" stroke="${k==='detect'?v('warn'):v('line-2')}" ${k==='empty'||k==='detect'?'stroke-dasharray="4 3"':''}/>`;
    if(k!=='empty')nd+=`<circle cx="${x+sw-11}" cy="${ySet+11}" r="4" fill="${k==='idle'||t.cls==='unk'?'none':col}" ${k==='idle'||t.cls==='unk'?`stroke="${col}" stroke-width="1.6"`:''}/>`;
    nd+=svgIcon(k==='empty'?'plus':'box',mx-8,ySet+(sm?10:11),16,k==='empty'?v('ink-3'):v('ink-2'));
    nd+=`<text x="${mx}" y="${ySet+(sm?42:44)}" font-size="${sm?11.5:12.5}" font-weight="600" text-anchor="middle" fill="${k==='empty'?v('ink-3'):v('ink')}">세트 ${esc(s.id)}</text>`;
    if(!sm)nd+=`<text x="${mx}" y="${ySet+59}" font-size="11" text-anchor="middle" fill="${k==='detect'?v('warn'):v('ink-3')}">${esc(sub)}</text>`;});
  nd+=node(cx-nw/2,yPC,nw,nh,'monitor','제어 PC',`${es.text} · 갱신 ${have?hms(n.t):'-'}`,es.cls==='bad'?v('bad'):null);
  nd+=node(cx-nw/2,yHub,nw,nh,'router','LiveHub','공용 1대 · 2.4 GHz → 셀 · 플러그');
  host.innerHTML=`<svg class="topo" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="제어 PC 에서 Wi-Fi 5 GHz 로 LiveHub, LiveHub 에서 세트 1~5 (${esc(benchSets())})">${e}${nd}</svg>`;
}
function benchSets(){
  const sl=setSlots(), parts=[], em=sl.filter(s=>s.kind==='empty').map(s=>s.id);
  sl.forEach(s=>{if(s.kind==='run')parts.push(`세트 ${s.id} 운전 (${S.now.expected||24}셀)`);else if(s.kind==='idle')parts.push(`세트 ${s.id} 운전 대기`);else if(s.kind==='detect')parts.push(`세트 ${s.id} 미등록 감지`);});
  if(em.length)parts.push(`세트 ${em.length>1?`${em[0]}~${em[em.length-1]}`:em[0]} 빈 자리`);
  return parts.join(' · ');
}
// 최근 활동 — 따로 쌓는 기록은 없다. 이미 있는 것에서 모은다: 사이클 기록(cycles.csv 의 시각 칸) · 이상 기록(events.csv) · 지금 단계 · 미등록 감지
const tday=t=>{const d=new Date(t*1000),n=new Date();return d.toDateString()===n.toDateString()?hm(t):`${pad(d.getMonth()+1)}-${pad(d.getDate())} ${hm(t)}`;};
function feedItems(){
  const out=[], n=S.now, run=runSlot().id;
  const det=setSlots().find(s=>s.kind==='detect');
  if(det)out.push({t:Infinity,set:det.id,ic:'alert',s:'warn',a:'미등록 감지',d:`셀 ${(det.detect||{}).cells??0} · 플러그 ${(det.detect||{}).plugs??0}`});
  if(n.phase&&n.phase_since)out.push({t:+n.phase_since,set:run,ic:(PH[phaseIdx(n.phase)]||{}).ic||'activity',a:`${PHK[n.phase]||n.phase} 시작`,d:`사이클 ${n.cycle}`});
  (S.cycles||[]).slice(-3).forEach(r=>{const c=r.cycle;
    if(r.plug_on)out.push({t:parseTs(r.plug_on),set:run,ic:'flag',a:'기준선 도달 · 충전 개시',d:`사이클 ${c} · 최저 ${r.min_batt_at_stop??'-'} %`});
    if(r.extract_end)out.push({t:parseTs(r.extract_end),set:run,ic:'download',a:`데이터 추출 ${r.extract_ok??'-'} / 24`,d:`사이클 ${c} · ${r.extract_mb??'-'} MB`});
    if(r.full_at)out.push({t:parseTs(r.full_at),set:run,ic:'batFull',a:'만충',d:`사이클 ${c} · ${r.charge_wh??'-'} Wh`});
    if(r.plug_off)out.push({t:parseTs(r.plug_off),set:run,ic:'checkC',s:'ok',a:`사이클 ${c} 완료`,d:`방전 ${has(r.discharge_h)?(+r.discharge_h).toFixed(2):'-'} h · 이상 ${r.events??0}`});});
  (S.events||[]).slice(-40).forEach(r=>{const k=r.kind;out.push({t:parseTs(r.time),set:run,ic:EV_IC[k]||'alert',s:EV_RED.has(k)?'bad':'warn',a:EV_KO[k]||k,
    d:[r.serial?`셀 ${r.serial}`:'',r.detail||''].filter(Boolean).join(' · '),title:k});});
  return out.filter(x=>x.t!=null&&!isNaN(x.t)).sort((a,b)=>b.t-a.t).slice(0,8);
}
function renderFeed(){
  const box=$('feed');if(!box)return;const it=feedItems();
  box.innerHTML=it.length?it.map(f=>`<li><span class="fi ${f.s?'s-'+f.s:''}">${I(f.ic,14)}</span><span class="ft"><b${f.title?` title="${esc(f.title)}"`:''}>${esc(f.a)}</b><span>세트 ${esc(f.set)} · ${esc(f.d)}</span></span><time>${f.t===Infinity?'지금':tday(f.t)}</time></li>`).join('')
    :`<li style="display:block"><div class="empty" style="padding:24px 0">활동 없음 — 엔진이 돌면 단계 · 사이클 · 이상이 여기에 쌓입니다</div></li>`;
}
V.ops={nav:'ops',crumb:()=>[['관제']],
  html:()=>`<div class="ph"><h1 tabindex="-1">관제</h1><span class="sub" id="opsSub"></span></div>
    <section class="sets5" id="sets5" aria-label="세트 5칸"></section>

      <section class="card"><div class="card-h"><h2>최근 활동</h2><div class="r"><span class="muted sm">사이클 · 이상 기록에서</span></div></div><ul class="feed" id="feed"></ul></section>

let reqSeq=0, appliedSeq=0;   // 범위를 빨리 바꿔도 늦게 온 이전 응답이 새 그림을 덮지 않게
async function refresh(){
  const my=++reqSeq, rng=R;
  await refreshHealth();          // 먼저 — 세트 표시가 신호등의 불을 얹는다. 실패해도 아래 화면은 그대로 그린다
  try{

    if(my<appliedSeq)return; appliedSeq=my;
    const rows=(smp&&smp.rows)||[];
    S={now:now||{},samples:rows,cur:rng==='cycle'?rows:((cur&&cur.rows)||[]),range:rng,cycles:cyc||[],events:ev||[],dis:dis||[],cellsX:cx||[]};
