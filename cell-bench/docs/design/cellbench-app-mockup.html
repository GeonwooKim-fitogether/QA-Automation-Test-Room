<title>Cell Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Cell Bench — 앱 셸(왼쪽 내비 216px · 위 막대 52px) 안의 6개 화면. 정본: check-sheet.html 의 토큰 · 상태 색 · 카드 · 게이지 · 눈금 · 상세 패널.
   더한 토큰: --d1(그래프 계열색 — 초록은 '정상' 상태에 묶여 있어 계열색으로 쓰지 않는다), --on-solid(진한 상태색 위 글자), --scrim. */
:root{
  --bg:#F5F6F4; --panel:#FFFFFF; --side:#EEF0EC; --line:#E2E5E0; --line-2:#D2D7D0;
  --ink:#1C2124; --ink-2:#4B5458; --ink-3:#7D878C;
  --brand:#0E9F6E; --brand-soft:#E5F5EE; --hover:#F7F8F6; --sel:#EEF6F2;
  --ok:#11A06E; --ok-z:#DDF1E7; --warn:#C27C12; --warn-z:#FBEBCB; --warn-soft:#FDF5E6; --bad:#C2453B; --bad-z:#F6D6D2; --bad-soft:#FCEDEB;
  --unk:#AAB2B6; --unk-z:#E7EAE7;
  --d1:#2F6FB3; --d1-z:#DCE7F4; --on-solid:#FFFFFF; --scrim:rgba(10,15,12,.35);
  --shadow:0 1px 2px rgba(20,30,25,.05),0 8px 24px rgba(20,30,25,.06); --lift:0 1px 2px rgba(0,0,0,.08); --lift-2:0 1px 3px rgba(0,0,0,.2);
  --font:"IBM Plex Sans KR","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111416; --panel:#191E20; --side:#14181A; --line:#283034; --line-2:#343D41;
  --ink:#E8ECE9; --ink-2:#B6BEC1; --ink-3:#7E888D;
  --brand:#34D399; --brand-soft:#16322A; --hover:#1E2427; --sel:#1B2C27;
  --ok:#34D399; --ok-z:#183A2E; --warn:#E8AE52; --warn-z:#4A3816; --warn-soft:#2E2614; --bad:#F08C84; --bad-z:#4D2724; --bad-soft:#2E1C1B;
  --unk:#5F6A70; --unk-z:#262D30;
  --d1:#79AEEB; --d1-z:#1F3047; --on-solid:#111416; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --lift:0 1px 2px rgba(0,0,0,.4); --lift-2:0 1px 3px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111416; --panel:#191E20; --side:#14181A; --line:#283034; --line-2:#343D41;
  --ink:#E8ECE9; --ink-2:#B6BEC1; --ink-3:#7E888D;
  --brand:#34D399; --brand-soft:#16322A; --hover:#1E2427; --sel:#1B2C27;
  --ok:#34D399; --ok-z:#183A2E; --warn:#E8AE52; --warn-z:#4A3816; --warn-soft:#2E2614; --bad:#F08C84; --bad-z:#4D2724; --bad-soft:#2E1C1B;
  --unk:#5F6A70; --unk-z:#262D30;
  --d1:#79AEEB; --d1-z:#1F3047; --on-solid:#111416; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --lift:0 1px 2px rgba(0,0,0,.4); --lift-2:0 1px 3px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:is(button,input,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg text{font-family:var(--font)}

/* 상태 색 묶음 */
.s-ok{--c:var(--ok);--z:var(--ok-z);--soft:var(--brand-soft)}
.s-warn{--c:var(--warn);--z:var(--warn-z);--soft:var(--warn-soft)}
.s-bad{--c:var(--bad);--z:var(--bad-z);--soft:var(--bad-soft)}
.s-unk{--c:var(--unk);--z:var(--unk-z);--soft:var(--unk-z)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.s-unk.dot,.s-unk .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--unk)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;background:var(--soft);color:var(--c);font-weight:600;font-size:12px;white-space:nowrap}
.s-unk.badge{color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip svg{color:var(--ink-3)}
.muted{color:var(--ink-3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-z);background:var(--bad-soft)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.icon-btn{width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--hover);color:var(--ink)}

/* 분할 단추 (예시 전환 · 범위) */
.seg{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px}
.seg>div{display:inline-flex;padding:2px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--lift),0 0 0 1px var(--line)}
.seg[hidden]{display:none}

/* 앱 셸 */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 0 215px,var(--line) 215px 216px,transparent 216px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em;flex:none}
.brand b{display:block;font-size:13.5px} .brand small{display:block;color:var(--ink-3);font-size:11.5px}
.nav{display:grid;gap:2px}
.nav button,.sets button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--ink-2);cursor:pointer;text-align:left;font-weight:500;width:100%}
.nav button:hover,.sets button:hover{background:var(--hover)}
.nav button[aria-current="page"],.sets button[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--c);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .cnt[hidden]{display:none}
.sets{display:grid;gap:2px}
.sets .gl{padding:0 10px 4px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.sets button{height:30px;font-size:13px}
.sets button .dot{margin:0 3px 0 4px}
.sets button small{margin-left:auto;color:var(--ink-3);font-size:11.5px;font-weight:500}
.sets button small.s-warn{color:var(--warn);font-weight:600}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:6px 4px 6px 10px;color:var(--ink-3);font-size:12px}
.side-foot .icon-btn{margin-left:auto}
.pulse{position:relative}
@media (prefers-reduced-motion:no-preference){
  .pulse.s-ok::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb button{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:5px;color:var(--ink-3);cursor:pointer}
.crumb button:hover{color:var(--ink);background:var(--hover)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.health{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--c);white-space:nowrap}
.me{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 10px 0 3px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.me .av{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:11px;font-weight:700}
.me.out{padding:0 12px 0 10px}
.me.out .av{display:none}

.content{padding:24px;display:grid;gap:18px;max-width:1400px;width:100%;align-content:start}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:32px}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph .sub{color:var(--ink-3);font-size:12.5px}
.ph .ph-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 카드 · 집계 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-b{padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;display:grid;gap:6px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s;align-content:start}
div.stat{cursor:default}
button.stat:hover{border-color:var(--line-2)}
.stat[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px var(--z)}
.stat .l{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:500;font-size:12.5px}
.stat .l svg{color:var(--ink-3)}
.stat .n{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:5px}
.stat .n small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.stat .n.c{color:var(--c)}
.stat.zero .n{color:var(--ink-3)}
.stat .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.stat .bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.stat .foot{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;min-height:18px}

/* 기준 게이지 · 24시간 눈금 (점검과 공용) */
.g{position:relative;height:8px;border-radius:4px;background:var(--line);display:flex;overflow:visible}
.g .z{position:absolute;top:0;bottom:0}
.g .z.ok{background:var(--ok-z)} .g .z.warn{background:var(--warn-z)} .g .z.bad{background:var(--bad-z)}
.g .z:first-child{border-radius:4px 0 0 4px} .g .z:last-of-type{border-radius:0 4px 4px 0}
.g .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 3px var(--c),var(--lift-2)}
.g.steps{gap:3px;background:none}
.g.steps .sp{flex:1;border-radius:3px;background:var(--z)}
.g.steps .sp.on{background:var(--c)}
.tk{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:2px;height:20px}
.tk i{border-radius:2px;background:var(--c);opacity:.9}
.tk i.s-ok{opacity:.55}
.tk i.s-unk{background:var(--unk-z);opacity:1}

/* 목록 + 상세 패널 */
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1280px){.body{grid-template-columns:minmax(0,1fr) 360px}}
.insp{display:none;align-content:start}
@media (min-width:1280px){.insp{display:grid;position:sticky;top:76px}}
.insp .card{display:grid;box-shadow:var(--shadow)}
.ih{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ih b{font-size:15px}
.ih .x{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;display:none;place-items:center}
.ib{padding:18px 16px;display:grid;gap:20px}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big span{font-size:15px;color:var(--ink-2);font-weight:600}
.lab{color:var(--ink-3);font-size:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-3);font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv>div{padding:10px 12px;display:grid;gap:3px;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){border-right:1px solid var(--line)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv span{color:var(--ink-3);font-size:11.5px;display:flex;align-items:center;gap:5px}
.kv b{font-size:15px;font-weight:700}
.kv b small{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.scrim{display:none}
@media (max-width:1279px){
  .insp.open{display:grid;position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(400px,100%);padding:12px}
  .insp.open .card{max-height:100%;overflow:auto}
  .insp .ih .x{display:grid}
  .scrim.open{display:block;position:fixed;inset:0;z-index:15;background:var(--scrim)}
}

/* 진행 단계 (스테퍼) */
.stp{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);list-style:none;margin:0;padding:0}
.stp li{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;padding:0 4px}
.stp li::before{content:"";position:absolute;top:11px;left:calc(-50% + 16px);right:calc(50% + 16px);height:2px;border-radius:1px;background:var(--line)}
.stp li:first-child::before{display:none}
.stp li.done::before,.stp li.cur::before{background:var(--brand)}
.stp .nd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line-2);color:var(--ink-3);font-size:11.5px;font-weight:700;position:relative}
.stp li.done .nd{background:var(--brand);box-shadow:none;color:var(--panel)}
.stp li.cur .nd{box-shadow:inset 0 0 0 2px var(--brand),0 0 0 4px var(--brand-soft);color:var(--brand)}
.stp li.cur .nd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.stp .t{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.3}
.stp li.todo .t{color:var(--ink-3);font-weight:500}
.stp .s{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.stp li.cur .s{color:var(--brand);font-weight:600}

/* 알림 · 토스트 */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);z-index:40;background:var(--ink);color:var(--panel);border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;animation-iteration-count:1!important}}

/* 좁은 화면: 내비는 위로 한 줄 */
@media (max-width:820px){
  .app{grid-template-columns:1fr;background:none}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand div,.side-foot,.sets{display:none}
  .brand{padding:0}
  .nav{display:flex;gap:2px}
  .nav button{height:30px;padding:0 8px;white-space:nowrap;font-size:12.5px;width:auto}
  .nav button svg{display:none}
  .nav .cnt{margin-left:6px;min-width:18px;height:18px}
  .top{padding:0 16px;gap:8px}
  .crumb .c-root{display:none}
  .seg>span{display:none}
  .me{display:none}
  .content{padding:16px;gap:14px}
  .ph h1{font-size:20px}
  .stats{gap:8px}
  .stat{padding:10px;gap:4px}
  .stat .n{font-size:22px}
  .stat .n small{font-size:12px}
  .stat .l{font-size:11.5px;gap:5px}
  .stat .bar,.stat .foot{display:none}
  .insp.open{top:auto;left:0;width:100%;max-height:85%;padding:0}
  .insp.open .card{border-radius:14px 14px 0 0}
  .card-h{padding:10px 14px}
  .card-b{padding:14px}
}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ── 관제 ── */
.sets5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.sc{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px 14px;display:grid;grid-template-rows:auto 1fr auto;gap:14px;min-height:204px;text-align:left;min-width:0}
button.sc{cursor:pointer;transition:border-color .15s,box-shadow .15s}
button.sc:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.sc-h{display:flex;align-items:center;gap:8px;min-width:0}
.sc-h b{font-size:14px;font-weight:700}
.sc-h .badge{margin-left:auto}
.sc .lvl{display:grid;gap:8px;align-content:center}
.sc .lvl .n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:4px}
.sc .lvl .n small{font-size:14px;color:var(--ink-3);font-weight:600}
.sc .lvl .lb{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px}
.sc-ax{position:relative}
.sc-ax .blab{position:absolute;transform:translateX(-50%);color:var(--warn);font-weight:600}
.soc{position:relative;height:8px;border-radius:4px;background:var(--line)}
.soc i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}
.soc .bl{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--warn)}
.sc .meta{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:6px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12px;font-weight:600}
.sc .meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sc .meta svg{color:var(--ink-3)}
.sc.new .det{display:grid;gap:8px;align-content:center}
.sc.new .det div{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600}

const PH=['방전','기준선 도달','충전 개시','데이터 추출','충전','만충'];
function cycPoint(c,t){            // 사이클 c 의 t 분 시점 값
  const D=c.D, r=rng(c.k*1000+Math.round(t))();
  if(t<D){const f=t/D,mn=100-70*f;return{ph:0,w:0,mn,avg:mn+4.5*f,mx:mn+8*f};}
  if(t<D+10){const f=(t-D)/10,mn=30+2.5*f;return{ph:3,w:66+r*4,mn,avg:mn+4.5,mx:mn+8};}
  if(t<D+70){const f=(t-D-10)/60,sp=1-f,mn=32.5+67.5*(1-Math.pow(1-f,1.4));return{ph:4,w:31+37*Math.pow(1-f,1.6)+(r-.5)*1.2,mn:Math.min(100,mn),avg:Math.min(100,mn+4.5*sp),mx:Math.min(100,mn+8*sp)};}
  return{ph:5,w:31+(r-.5)*.6,mn:100,avg:100,mx:100};
}
function series(range){
  const ks=range==='cycle'?[12]:range==='recent'?[8,9,10,11,12]:CYC.filter(Boolean).map(c=>c.k);
  const step=range==='all'?30:10, out=[];
  ks.forEach(k=>{const c=CYC[k],L=c.D+80,end=k===12?NOW-c.st:L;
    for(let t=0;t<end;t+=step)out.push({m:c.st+t,k,...cycPoint(c,t)});
    if(k===12)out.push({m:NOW,k,...cycPoint(c,NOW-c.st)});});
  const c12=CYC[12];
  const dom=range==='cycle'?[c12.st,c12.st+c12.D+80]:[CYC[ks[0]].st,NOW+(range==='all'?60:30)];
  return{pts:out,dom,ks};
}
function chartSVG(host,range,onRead){

  const yP=v=>top+hP-(v/80)*hP, s0=top+hP+gap, yS=v=>s0+hS-(v/100)*hS;

  [0,50,100].forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${yS(t)}" y2="${yS(t)}" stroke="${v('line')}"/><text x="${L-6}" y="${yS(t)+3.5}" font-size="10.5" text-anchor="end" fill="${v('ink-3')}">${t}</text>`;});

  g+=`<text x="${L}" y="${s0-10}" font-size="11.5" font-weight="600" fill="${v('ink-2')}">잔량 <tspan fill="${v('ink-3')}" font-weight="400">%</tspan></text>`;
  // 사이클 경계 · 회차

    g+=`<line x1="${xs}" x2="${xs}" y1="${top}" y2="${s0+hS}" stroke="${v('line-2')}"/>`;

  const segs=[];let cur=[];pts.forEach((p,i)=>{if(i&&p.k!==pts[i-1].k){segs.push(cur);cur=[];}cur.push(p);});segs.push(cur);
  segs.forEach(sg=>{

    g+=`<path d="M${sg.map(p=>`${x(p.m).toFixed(1)} ${yS(p.avg).toFixed(1)}`).join('L')}" fill="none" stroke="${v('d1')}" stroke-width="1.8" stroke-linejoin="round"/>`;

/* 사이클별 추정 작동시간 — 점 · 선 · 사이클 1 기준 ±5 % 띠 (세트 상세 패널 · 추이 분석이 함께 쓴다) */
function wtChart(host,{pcts,w1,H=96,Lp=34,Rp=8,labels='few',dotR=3.5,fixedW,title}){
  const W=fixedW||wOf(host), n=pcts.length, v=k=>`var(--${k})`;
  const vals=pcts.map(p=>w1*(1+p/100)), lo=Math.min(w1*.935,Math.min(...vals)-w1*.006), hi=w1*1.02;
  const top=8, bot=labels?20:6, x=i=>Lp+(i+.5)*(W-Lp-Rp)/n, y=val=>top+(hi-val)/(hi-lo)*(H-top-bot);
  let g=`<rect x="${Lp}" y="${y(w1*1.05>hi?hi:w1*1.05)}" width="${W-Lp-Rp}" height="${y(w1*.95)-y(Math.min(hi,w1*1.05))}" fill="${v('ok-z')}" opacity=".55"/>`;
  g+=`<line x1="${Lp}" x2="${W-Rp}" y1="${y(w1*.95)}" y2="${y(w1*.95)}" stroke="${v('bad')}" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>`;
  g+=`<line x1="${Lp}" x2="${W-Rp}" y1="${y(w1)}" y2="${y(w1)}" stroke="${v('ink-3')}" stroke-width="1" stroke-dasharray="2 3"/>`;
  if(title)g+=`<text x="10" y="16" font-size="11.5" font-weight="600" fill="${v('ink-2')}">${title}</text>`;
  g+=`<text x="${Lp-6}" y="${y(w1)+3.5}" font-size="10.5" text-anchor="end" fill="${v('ink-3')}">${w1.toFixed(2)}</text>`;
  g+=`<text x="${Lp-6}" y="${y(w1*.95)+3.5}" font-size="10.5" text-anchor="end" fill="${v('bad')}">−5%</text>`;
  g+=`<path d="M${vals.map((val,i)=>`${x(i).toFixed(1)} ${y(val).toFixed(1)}`).join('L')}" fill="none" stroke="${v('ink-2')}" stroke-width="1.6" stroke-linejoin="round"/>`;
  vals.forEach((val,i)=>{const s=verdict(pcts[i]);g+=`<circle cx="${x(i)}" cy="${y(val)}" r="${dotR}" fill="var(--${s})" stroke="${v('panel')}" stroke-width="1.5"><title>사이클 ${i+1} · ${val.toFixed(2)} h · ${neg(pcts[i].toFixed(1))} % · ${VW[s]}</title></circle>`;
    if(labels==='all'||(labels==='few'&&(i===0||i===n-1||i===Math.floor(n/2))))g+=`<text x="${x(i)}" y="${H-5}" font-size="10.5" text-anchor="middle" fill="${v('ink-3')}">${i+1}</text>`;});
  host.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="사이클별 추정 작동시간">${g}</svg>`;
}

/* ───── 2. 세트 상세 ───── */
S.range='cycle'; S.cell=null; S.pop=false;
const cellInfo=(s,i)=>{const r=rng(s.sn[i])();return{dbm:-44-Math.round(r*22),start:s.state==='run'?(r>.8?99:100):null,mb:s.state==='run'?55+Math.round(r*7):null};};
const lowest=s=>s.soc.indexOf(Math.min(...s.soc));
function ctlHTML(s){
  const lock=!S.login, on=s.plugOn;
  return `<div class="ctl ${lock?'locked':''}" id="ctl">
    <span class="who" title="${lock?'로그인한 사람만 원격 제어':'김건우 · 원격 제어 가능'}">${lock?I('lock',14)+'로그인 필요':`<span class="av">김</span>${I('unlock',14)}`}</span>
    <button type="button" class="btn" id="pOn" ${lock||on?'disabled':''} title="${on?'이미 켜짐':''}">${I('zap',15)}플러그 켜기</button>
    <button type="button" class="btn" id="pOff" ${lock||!on?'disabled':''} title="${!on?'이미 꺼짐':''}">${I('power',15)}플러그 끄기</button>
    <button type="button" class="btn danger" id="eStop" ${lock?'disabled':''} aria-expanded="${S.pop}">${I('stop',15)}안전 정지</button>

      <ul><li>${I('zap',14)}플러그 ON (충전 쪽)</li><li>${I('repeat',14)}사이클 멈춤 · 기록 보존</li><li>${I('hand',14)}재시작은 제어 PC 에서</li></ul>
      <div class="r"><button type="button" class="btn sm" id="popNo">취소</button><button type="button" class="btn sm danger fill" id="popYes">정지</button></div></div>`:''}
  </div>`;
}
function cellInsp(s){
  const i=S.cell, sn=s.sn[i], soc=s.soc[i], ci=cellInfo(s,i), near=soc<=BASE+10, st=near?'warn':'ok';
  const run=s.state==='run', tr=TR.find(c=>c.sn===sn);
  $('insp').innerHTML=`<div class="card">
    <div class="ih"><span class="ic">${I('battery')}</span><b>셀 ${sn}</b><span class="badge s-${st}"><span class="dot"></span>${near?(soc<BASE?'기준선 아래':'기준선 근접'):'정상'}</span>
      <button type="button" class="x" id="close" aria-label="닫기">${I('x',16)}</button></div>
    <div class="ib">
      <div><div class="big"><b>${soc}</b><span>%</span></div><div class="lab">잔량 · ${run?'방전 중':'운전 대기'}</div></div>
      <div class="gb"><div class="g"><span class="z warn" style="left:0;width:${BASE}%"></span><span class="z ok" style="left:${BASE}%;width:${100-BASE}%"></span><span class="mk s-${st}" style="left:${soc}%"></span></div>
        <div class="ends" style="position:relative"><span>0 %</span><span style="position:absolute;left:${BASE}%;transform:translateX(-50%);color:var(--warn);font-weight:600">기준선 ${BASE}</span><span>100 %</span></div></div>
      <div class="kv">
        <div><span>${I('battery',12)}방전 시작</span><b>${ci.start??'—'}<small>${ci.start?'%':''}</small></b></div>
        <div><span>${I('wifi',12)}Wi-Fi</span><b>${neg(ci.dbm)}<small>dBm</small></b></div>
        <div><span>${I('heart',12)}심박</span><b>있음<small>12초 전</small></b></div>
        <div><span>${I('download',12)}최근 추출</span><b>${ci.mb??'—'}<small>${ci.mb?'MB':''}</small></b></div>
      </div>
      <div><div class="sec-h"><span>사이클별 추정 작동시간</span><span>h</span></div><div id="miniW">${run&&tr?'':`<div class="empty-c" style="height:80px">기록 없음</div>`}</div></div>
      ${run&&tr?`<button type="button" class="btn sm" id="toTrend">${I('trend',14)}추이 분석에서 보기</button>`:''}
    </div></div>`;
  $('close').onclick=()=>openInsp(false);
  if(run&&tr){wtChart($('miniW'),{pcts:tr.pct,w1:tr.w1,H:100,Lp:36,labels:'few'});
    $('toTrend').onclick=()=>go('trend',{tsel:TR.indexOf(tr)});}
}
function readout(s,p){
  const el=$('rd');if(!el)return;
  if(s.state!=='run'){el.innerHTML=`<span class="muted">시작 전</span>`;return;}
  const q=p||series('cycle').pts.slice(-1)[0], now=!p;
  el.innerHTML=`<span class="tm">${hm(q.m)}</span>${now?'<span class="now">지금</span>':''}<span>${q.k}회 · ${PH[q.ph]}</span>
    <span>전력<b>${q.w.toFixed(1)} W</b></span><span>잔량 평균<b>${Math.round(q.avg)} %</b></span><span>최저~최고<b>${Math.round(q.mn)}–${Math.round(q.mx)} %</b></span>`;
}
function drawRec(s){const h=$('chart');if(!h)return;
  if(s.state!=='run'){h.innerHTML=`<div class="empty-c">${I('activity',28)}<span>기록 없음 · 사이클 1 시작 후 표시</span></div>`;return;}
  chartSVG(h,S.range,p=>readout(s,p));readout(s,null);}

    const req=(t,ic)=>toast(`${t} 요청 · 세트 ${s.id}`,ic);
    $('pOn').onclick=()=>req('플러그 켜기','zap'); $('pOff').onclick=()=>req('플러그 끄기','power');
    $('eStop').onclick=()=>{S.pop=!S.pop;render();};
    if($('popNo')){$('popNo').onclick=()=>{S.pop=false;render();};$('popYes').onclick=()=>{S.pop=false;render();req('안전 정지','stop');};}
    cellInsp(s); drawRec(s);
  },
  resize(){const s=SETS[S.set];drawRec(s);cellInsp(s);}
};

/* ───── 3. 추이 분석 ───── */
S.tsel=TR.findIndex(c=>c.sn===11746); S.tsort='sn';
const streak=p=>{let n=0;for(let k=p.length-1;k>=0&&p[k]<-5;k--)n++;return n;};
const cellState=c=>streak(c.pct)>=3?'bad':verdict(c.pct[c.pct.length-1]);
const CW={ok:'정상',warn:'관찰',bad:'주의'};
function trendInsp(){
  const c=TR[S.tsel], last=c.pct[10], st=cellState(c), sk=streak(c.pct), w11=c.w1*(1+last/100);
  const stage=st==='bad'?1:0;
  $('insp').innerHTML=`<div class="card">
    <div class="ih"><span class="ic">${I('battery')}</span><b>셀 ${c.sn}</b><span class="badge s-${st}"><span class="dot"></span>${CW[st]}</span>
      <button type="button" class="x" id="close" aria-label="닫기">${I('x',16)}</button></div>
    <div class="ib">
      <div><div class="big"><b style="color:var(--${verdict(last)==='ok'?'ink':verdict(last)})">${neg(last.toFixed(1))}</b><span>%</span></div><div class="lab">사이클 11 · 사이클 1 대비</div></div>
      <div><div class="sec-h"><span>사이클별 추정 작동시간</span><span>h</span></div><div id="tMini"></div></div>
      <div class="kv">
        <div><span>사이클 1</span><b>${c.w1.toFixed(2)}<small>h</small></b></div>
        <div><span>사이클 11</span><b>${w11.toFixed(2)}<small>h</small></b></div>
        <div><span>연속 이탈</span><b>${sk}<small>사이클</small></b></div>
        <div><span>주의</span><b>${stage}<small>회</small></b></div>
      </div>
      <div><div class="sec-h"><span>판정</span></div>
        <div class="rule3"><div class="st ${sk>0&&sk<3?'on s-warn':''}"><b>이탈</b>±5 % 밖</div>${I('chev',14)}
          <div class="st ${sk>=3?'on s-bad':''}"><b>주의</b>3연속</div>${I('chev',14)}<div class="st"><b>점검</b>주의 2회</div></div></div>
      <button type="button" class="btn sm" id="toSet">${I('box',14)}세트 1 에서 보기</button>
    </div></div>`;
  $('close').onclick=()=>openInsp(false);
  wtChart($('tMini'),{pcts:c.pct,w1:c.w1,H:110,Lp:36,labels:'few'});
  $('toSet').onclick=()=>go('set',{set:1,cell:SN1.indexOf(c.sn)});
}
function heatmap(){

    ${order.map(i=>{const c=TR[i],st=cellState(c),l=c.pct[10];return `<div class="row-b" role="option" tabindex="0" data-i="${i}" aria-selected="${i===S.tsel}">

  const top=$('hmTop');

  $('wzBack').onclick=()=>{RG.step--;render();};
  if($('wzNext'))$('wzNext').onclick=()=>{RG.step++;render();};
  if($('wzDone'))$('wzDone').onclick=()=>{const s=SETS[2];s.state='wait';s.minSoc=5;s.cycle=0;
    FEED.unshift({t:'09:53',set:2,ic:'checkC',s:'ok',a:'등록됨',d:'셀 24 · Tapo P110M 2'});go('ops');toast('세트 2 등록됨 · 운전 대기');};
}
function wstHTML(){const fin=RG.step===3&&!RG.fail&&RG.t>=LIMIT, bad=RG.step===3&&RG.fail&&RG.t>=5;
  return ['플러그','셀','확인'].map((t,i)=>{const k=i+1,c=k<RG.step||fin?'done':k===RG.step?(bad?'bad':'cur'):'';return `${i?`<span class="wl ${k<=RG.step?'done':''}"></span>`:''}<span class="ws ${c}" ${c==='cur'||c==='bad'?'aria-current="step"':''}><span class="wn">${c==='done'?I('check',13,2.6):c==='bad'?I('x',13,2.6):k}</span>${t}</span>`;}).join('');}
function regBody(){
  if(RG.step===1)return `<h2>플러그<span class="muted">감지 2</span></h2>
    <div class="pks" role="radiogroup" aria-label="플러그">${PLUGS.map(p=>`<button type="button" class="pk" role="radio" data-p="${p.id}" aria-checked="${RG.plug===p.id}" ${p.free?'':'disabled'}>
      <span class="ro"></span><span class="ic">${I('plug',16)}</span><span class="nm2"><b>${p.n}</b><span>${p.mac}</span></span>
      <span class="pr">${p.free?`${p.w}<small>W</small><span class="badge s-warn" style="height:22px">미등록</span>`:`<span class="badge s-unk" style="height:22px">${I('lock',12)}세트 ${p.set}</span>`}</span></button>`).join('')}</div>`;
  if(RG.step===2){const n=RG.sel.size;
    return `<h2>셀<span class="muted">감지 24</span></h2>
      <div class="rng"><label for="rf">범위</label><input id="rf" type="number" inputmode="numeric" value="${RG.from}" aria-label="시작 시리얼"><span class="tilde">~</span><input id="rt" type="number" inputmode="numeric" value="${RG.to}" aria-label="끝 시리얼">
        <button type="button" class="btn" id="rSel">범위 선택</button><button type="button" class="btn ghost" id="rClr">전체 해제</button>
        <span class="counter ${n===24?'s-ok':'s-unk'}" style="${n===24?'':'color:var(--ink-3)'}" aria-live="polite">${n}<small>/ 24</small></span></div>
      <div class="cts" role="group" aria-label="감지된 셀">${SN2.map((sn,i)=>{const v=SOC2[i],low=v<=15;return `<button type="button" class="ct ${low?'s-warn':''}" role="checkbox" data-sn="${sn}" aria-checked="${RG.sel.has(sn)}">
        <span class="cb">${RG.sel.has(sn)?I('check',11,3):''}</span><span class="s">${sn}</span><span class="p">${v} %</span></button>`;}).join('')}</div>`;}
  return `<h2>확인<span class="muted">10초 검사</span></h2><div id="chk" style="display:grid;gap:14px"></div>`;
}
V.reg={nav:'ops',crumb:()=>[['관제','ops'],['세트 2 등록']],
  seg:()=>({opts:['통과','실패'],at:RG.fail?1:0,pick:i=>{RG.fail=!!i;if(RG.step===3)render();else{$('exSeg').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));}}}),
  html(){
    return `<div class="wz-col"><div class="ph"><h1>세트 2 등록</h1><span class="sub">감지 09:41 · 셀 24 · 플러그 1</span></div>
      <section class="card" aria-label="세트 등록">
        <div class="wst" id="wst">${wstHTML()}</div>
        <div class="wz-b">${regBody()}</div>
        <div class="wz-f" id="wzf"></div>
      </section></div>`;},
  mount(){
    document.querySelectorAll('.pk:not(:disabled)').forEach(b=>b.onclick=()=>{RG.plug=b.dataset.p;render();});
    document.querySelectorAll('.ct').forEach(b=>b.onclick=()=>{const sn=+b.dataset.sn;RG.sel.has(sn)?RG.sel.delete(sn):RG.sel.add(sn);render();});
    if($('rSel')){const rd=()=>{RG.from=+$('rf').value;RG.to=+$('rt').value;};$('rf').onchange=rd;$('rt').onchange=rd;
      $('rSel').onclick=()=>{rd();SN2.forEach(sn=>{if(sn>=Math.min(RG.from,RG.to)&&sn<=Math.max(RG.from,RG.to))RG.sel.add(sn);});render();};
      $('rClr').onclick=()=>{RG.sel.clear();render();};}
    if(RG.step===3){RG.t=0;regChecks();regRun();}
    regFoot();
  }
};

/* ==SCREENS-END== */

go('ops');
})();
</script>
